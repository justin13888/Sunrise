# Clippy deny list enforcing the determinism rules from
# docs/01-architecture/shared-core.md §determinism-rules.
# Direct calls to non-deterministic stdlib surfaces are forbidden in core
# crates; use the injected `Clock`, `Rng`, `Storage` handles instead.

disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "use CoreConfig::clock" },
    { path = "std::time::Instant::now", reason = "use CoreConfig::clock" },
    { path = "std::process::exit", reason = "return Err(CoreError::Fatal) instead" },
    # These bind only inside the six crates that declare `rand` directly
    # (crypto, core, e2e, bench, onboarding, crypto-test-vectors) — which are
    # the ones that matter. Elsewhere clippy cannot resolve the path and emits
    # a *config* warning that `-D warnings` does not catch, so this is
    # deliberately not the only enforcement: the `determinism` CI job greps
    # every crate. Keep both. Path-based matching here is immune to turbofish
    # and aliasing; the grep covers the crates clippy cannot see.
    { path = "rand::thread_rng", reason = "use CoreConfig::rng" },
    { path = "rand::random", reason = "use CoreConfig::rng" },
]

disallowed-types = [
    # No entries in v1 — types like `std::sync::Mutex` are still permitted.
]


# Cognitive limits — keep submit/query handlers small.
cognitive-complexity-threshold = 25
type-complexity-threshold = 250
too-many-arguments-threshold = 8
