name: CI

on:
  push:
    branches: [master]
  # Deliberately unfiltered. `pull_request: branches:` filters on the *base*
  # branch, so filtering it to `master` meant a pull request stacked on another
  # pull request's branch triggered no workflow at all — not fmt, not clippy,
  # not a test, not one gate. A stack is how a large change is made reviewable
  # here, so the shape this repository actually uses was the one shape nothing
  # checked, and a gate added on a stacked branch could never run on the branch
  # that added it. Every pull request is gated, whatever it targets.
  pull_request:
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"
  workflow_dispatch:

# The whole scope this workflow needs, stated where it can be read. Every job
# below checks out, and `actions/checkout` wants `contents: read` and nothing
# more. No `run:` step in this file reads `GITHUB_TOKEN` and none reads a
# secret. Two actions read the token without being asked to — `oven-sh/setup-bun`
# and `taiki-e/install-action` each default an input to `github.token` — and
# both spend it on public GitHub API reads to dodge the anonymous rate limit,
# which a `contents: read` token already satisfies.
#
# `release.yml` states its scope as `permissions: {}` and re-grants per job,
# which is right for that file because its seven jobs are not alike — one of
# them holds `packages: write`, `id-token: write` and `attestations: write`, and
# a default-deny makes every grant a thing somebody had to write down. The jobs
# here are alike: not one of them needs a scope another does not. So one line
# says it for all of them, and a job that later needs more has to add a block
# and say why.
#
# The repository default is already `read`, so this does not close a write hole
# that was standing open. What it closes is the indirection: until now the only
# statement of what a pull request's token could do lived in a settings page,
# changeable without a commit, a review or a diff, and every job in this file
# ran on whatever that page happened to say that day.
#
# It does narrow one thing. An explicit block sets every scope it does not name
# to `none`, so the read access the repository default also handed out —
# `actions`, `checks`, `packages`, `pull-requests`, `statuses` — is gone. No job
# here used any of them.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Which of the jobs below this push can possibly affect. Only the three
  # Apple jobs consult it, because they are the only ones whose cost is worth
  # a filter: they run on a runner class that bills at 10x and is capped at
  # five concurrent jobs account-wide, and 13 of the 60 pull requests merged in
  # the fortnight before this job was added touched neither Rust nor Apple
  # sources and paid ~33 macOS-minutes each anyway.
  #
  # A job-level `if:` on the consumers, never a workflow-level `paths:` filter.
  # The two are not interchangeable here: a job skipped by a conditional
  # reports a check run GitHub counts as successful, whereas a workflow filtered
  # out by `paths:` reports nothing at all — and `macOS app (…)` and
  # `iOS app (…)` are required contexts in the `Protect master` ruleset, so
  # that second shape would leave every docs-only pull request permanently
  # unmergeable.
  #
  # `git diff` rather than `dorny/paths-filter` or `tj-actions/changed-files`.
  # Fifteen lines of shell do not justify a third-party action running in the
  # runner context at all. This used to carry a second reason — that the
  # repository pinned by floating major tag, which is the configuration that
  # let CVE-2025-30066 reach the repositories it reached, every tag of
  # `tj-actions/changed-files` having been retargeted to dump runner memory
  # into build logs. That reason is spent: every `uses:` here is a commit sha
  # now, and a sha cannot be retargeted. What survives is the first reason and
  # the blast radius behind it, which pinning reduces but does not remove — a
  # pinned action is still third-party code with the runner's token and
  # filesystem, and `dependabot` will move these pins forward on a schedule
  # nobody reads line by line.
  #
  # `gh api .../compare` was the other candidate and is wrong for a different
  # reason: its `files` array truncates at 300 entries with no error, so a
  # large pull request would silently report that it changed nothing relevant.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The diff below needs the merge base. The repository is ~43 MiB
          # packed, so full history costs seconds.
          fetch-depth: 0
      - id: filter
        name: Does this change reach the Apple apps?
        # Fails open in every direction, which is the only safe bias for a job
        # that decides whether a gate runs. Any event that is not a pull
        # request answers `true`; a `git diff` that cannot resolve its endpoints
        # — a force-pushed base on a stacked pull request is the realistic way —
        # answers `true` rather than failing the step, because a red X here
        # would be a worse signal than an Apple job that did not need to run.
        #
        # **Directory prefixes, not file extensions.** The tempting version of
        # this matches `\.rs$` and the manifests, and it is wrong: the slices
        # compile several things that are not Rust and not a manifest.
        # `crates/sunrise-crypto/src/bip39-english.txt` is `include_str!`d by
        # `bip39.rs`; `crates/sunrise-storage/src/migrations.rs` `include_str!`s
        # twelve `.sql` files; and `crates/sunrise-relay-client/build.rs` reads
        # `schemas/generated/openapi.v1.json` to generate the entire relay
        # client. Each of those changes the bytes of the xcframework while an
        # extension match says nothing happened. `crates/` is 348 tracked files
        # of which two are markdown, so the prefix costs almost nothing over the
        # extension it replaces and cannot miss an asset added later.
        #
        #   crates/**                the workspace, assets and fixtures included
        #   tools/**                 `uniffi-bindgen`, built `--locked` from its
        #                            own tracked lockfile to generate the Swift
        #   schemas/**               `build.rs` input for the relay client
        #   **/Cargo.{toml,lock}     the root and `fuzz/` manifests the two
        #                            prefixes above do not reach
        #   *.rs                     a Rust file added outside those trees
        #   rust-toolchain*          selects the compiler for all three slices
        #   .cargo/**                declares the three Apple target triples
        #   apps/apple/**            the Swift, project.yml and .swiftlint.yml
        #   mise.toml                defines every task the Apple jobs run
        #   tokens.swift             generated, committed, compiled into both apps
        #   Strings.swift,           the string catalog's Apple binding, likewise
        #     Localizable.xcstrings  (ADR-0054)
        #   .github/workflows/ci.yml a change to these jobs must run them
        #   .github/actions/**       likewise for anything they call
        #
        # Known and deliberate omission: `.github/scripts/xcresult-failures.py`
        # is called by both app tasks, but only on the failing path and under
        # `|| true`, so it cannot turn a green run red or a red run green.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request; running the Apple jobs"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          # `--no-renames` is load-bearing, not tidiness. `--name-only` prints
          # only a rename's *destination*, so `git mv apps/apple/Foo.swift
          # scratch/Foo.txt` would report one path that matches nothing here,
          # skip all three Apple jobs, report both required contexts green, and
          # break master on merge. With `--no-renames` the same commit reports a
          # delete and an add, and the delete matches.
          if ! changed=$(git diff --no-renames --name-only "$base...$head"); then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            echo "could not diff $base...$head; running the Apple jobs"
            exit 0
          fi
          echo "changed paths:"
          printf '%s\n' "$changed"
          # A here-string, not `printf '%s\n' "$changed" | grep -qE`. That
          # pipeline fails in the one direction the paragraph above says this
          # job must never fail in. `grep -q` exits on its first match without
          # draining stdin; `printf` then takes SIGPIPE; and `pipefail`
          # promotes that 141 to the status of the whole pipeline — so the
          # `else` branch runs, and a pull request that *did* touch `crates/`
          # reports `apple=false`, skips all three Apple jobs, reports both
          # required contexts green, and breaks master on merge. That is the
          # same failure `--no-renames` above exists to prevent, arriving by a
          # different route.
          #
          # It needs the payload to exceed the 64 KiB pipe buffer *and* a match
          # to sort early — and since `git diff --name-only` emits sorted
          # paths, `.github/`, `apps/apple/` and `crates/` are exactly the
          # entries that sort early, so the early match is the likely case
          # rather than the unlikely one. All 890 tracked files changing at
          # once is 34 KiB today, so this is headroom and not a live bug; the
          # point is that a job whose contract is "fail open in every
          # direction" should not be relying on the tree staying small. A
          # here-string redirects from a temporary file, so there is no reader
          # to close the pipe and nothing to take a signal.
          if grep -qE \
            '(^crates/|^tools/|^schemas/|(^|/)Cargo\.(toml|lock)$|\.rs$|^rust-toolchain|^\.cargo/|^apps/apple/|^mise\.toml$|^packages/sunrise-ui-tokens/generated/tokens\.swift$|^packages/sunrise-i18n/generated/(Strings\.swift|Localizable\.xcstrings)$|^\.github/workflows/ci\.yml$|^\.github/actions/)' \
            <<<"$changed"
          then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            echo "a path the Apple apps are built from changed; running them"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
            echo "nothing the Apple apps are built from changed; skipping them"
          fi

  # The Rust gate runs twice, as two jobs naming one composite action, rather
  # than as the two-leg matrix this used to be. The names below are
  # byte-identical to the legs they replace because both are required status
  # checks in the `Protect master` ruleset, and the mechanism that keeps the
  # macOS one off the pull-request path only works on a whole job. See the
  # header of .github/actions/rust-checks/action.yml for why.
  #
  # `timeout-minutes` is a literal per job, not `${{ matrix.timeout }}`: the
  # legs never cost the same — macOS minutes bill at 10x, so the expensive one
  # gets the *tighter* cap rather than inheriting a ceiling sized for the
  # slower-but-cheaper one — and two jobs can simply say so.
  rust:
    name: Rust (ubuntu-latest)
    runs-on: ubuntu-latest
    # ~2.4x the slowest cold observation (18m26s), plus the ten minutes the
    # `fuzz/` clippy and rustdoc steps added (#167): a second cargo workspace
    # with a target directory of its own, which on a cold cache rebuilds the
    # shared dependency graph once more. Warm, this job runs in about 5m20s.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/rust-checks

  rust-macos:
    name: Rust (macos-latest)
    runs-on: macos-latest
    # ~2.4x the slowest cold observation (14m46s), plus the same ten minutes.
    timeout-minutes: 45
    # Off the pull-request path, and this is the single largest thing in this
    # file that was blocking one. GitHub caps this account at five concurrent
    # macOS jobs; every run launched three of them and spent a median 41.5
    # macOS-minutes, so under two runs fit at once and the p90 wait for a macOS
    # job to *start* was 56 minutes against a p90 execution time of 25.6. The
    # worst observed waits — 118 to 137 minutes — all began with four or five
    # macOS jobs already running.
    #
    # This leg is the cheapest of the three to give up, because it duplicates
    # the ubuntu one almost exactly. `crates/` contains no `cfg(target_os)` at
    # all and nine `cfg(unix)` sites, and `cfg(unix)` is true on Linux too — so
    # there is no source path this leg compiles that the ubuntu leg does not.
    # What it still earns is the behaviour underneath the source: APFS
    # case-insensitivity and timestamp granularity, Keychain, SQLite locking,
    # and whatever a dependency does differently on Darwin. That is worth a run
    # a day and a run per merge, which is what this condition leaves.
    #
    # `skipped`, not absent: a job skipped by a job-level `if:` reports a check
    # run GitHub counts as successful, so the required context is still
    # satisfied on every pull request. The cost of that is honest and worth
    # writing down — this required check can now only go red after a merge.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/rust-checks

  apple-xcframework:
    name: Apple xcframework (3 slices + Swift bindings)
    # `macos-26` for the same reason the two app jobs pin it: the slices are
    # compiled with `MACOSX_DEPLOYMENT_TARGET` / `IPHONEOS_DEPLOYMENT_TARGET`
    # of 26.0 — mise.toml's `macos_target` / `ios_target`, which must equal
    # project.yml's `deploymentTarget` — and `xcodebuild -create-xcframework`
    # packages them. No earlier SDK can do either.
    runs-on: macos-26
    # 45, matching `rust-macos` above, rather than the 60 the app jobs carry.
    # The warm phase measures 5.8-6.3 min inside those jobs, but no cold run of
    # it has ever been observed on its own — the first run after this lands
    # will be one, because `shared-key: apple` is a new discriminator — and a
    # release build of sqlite, zstd and ring for three triples is the largest
    # thing this repository does. So the cap is set from what the file already
    # knows a macOS job can need, not from the warm number, and tightened once
    # a cold run has been measured.
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    env:
      # Deliberately clears the workflow-level `-D warnings`, and this is now
      # the only job that needs to: it compiles `tools/uniffi-bindgen`, a
      # separate manifest whose third-party dependency tree is not ours to keep
      # warning-free. Denying warnings there turns an upstream deprecation into
      # a red macOS build for a problem no one here can fix. The workspace's
      # own warning discipline is enforced by the `rust` job's clippy step.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # The toolchain file pins 1.91.1, which rustup installs on first use.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # `macos-app` and `ios-app` each used to keep their own copy of this
          # entry — two 496 MiB caches of one dependency graph — because
          # rust-cache discriminates by job id when nothing tells it otherwise,
          # and their keys differed in nothing else. One job builds now, so one
          # entry exists.
          #
          # This does *not* inherit either of those entries, and the first run
          # after it lands is fully cold. `shared-key` substitutes for the job
          # id in the key, so this is `v0-rust-apple-Darwin-arm64-…` where the
          # old ones were `v0-rust-macos-app-…`; the restore-key prefix differs
          # too, so there is no partial hit to fall back on. Naming it
          # `macos-app` would inherit, at the price of a key that lies about
          # which job owns it — one cold macOS build, once, is the better half
          # of that trade.
          shared-key: apple
          # As in the `rust` gate: writes only from `master`, so a pull request
          # cannot spend the repository's 10 GiB cache quota on an entry that
          # only that same pull request can read.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # aarch64-apple-darwin is the host triple on this runner, but the
      # xcframework carries three slices and the other two are not installed by
      # default — `mise run apple-xcframework` fails without them.
      #
      # This is a step rather than the action's `targets:` input, and the
      # difference is the whole bug it fixes: `targets:` is passed to
      # `rustup toolchain install stable`, so the slices land on *stable*, while
      # rust-toolchain.toml overrides the working directory to 1.91.1 — which
      # then has no iOS std and fails with `E0463: can't find crate for core`.
      # Run bare and in the repo, `rustup target add` obeys that same override,
      # so the slices land on the toolchain that actually does the build.
      - name: Add the iOS slices to the pinned toolchain
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      # mise only. XcodeGen and SwiftLint belong to the two jobs below; this
      # one compiles no Swift.
      - name: Install mise
        run: brew install --quiet mise
      # mise refuses to run tasks from a config it has not been told to trust,
      # and a fresh checkout is never trusted. Explicit rather than implicit:
      # the runner has no interactive prompt to answer.
      - name: Trust mise config
        run: mise trust --yes
      - name: mise run apple-xcframework
        run: mise run apple-xcframework
      # One artefact, not two. `out/swift/sunrise_core_bindings.swift` is
      # generated by the same build that produced the slices and is compiled
      # into both apps; splitting them would let a job download one half.
      #
      # The upload root is the least common ancestor of the matched paths,
      # which these two make `out/` — so the artefact holds
      # `SunriseCore.xcframework/` and `swift/` at its root and the jobs below
      # unpack it with `path: out`. The framework name is mise.toml's `ffi_fw`;
      # if that ever changes, this path and the two below change with it.
      #
      # `compression-level: 1` because both ends of this round trip are
      # 10x-billed macOS runners: 195 MB of static archives zip to 83 MB at
      # level 1, and the few MB level 6 would save are not worth the CPU. No
      # tar: this xcframework is three `.a` files, their headers and an
      # Info.plist, with no symlink and no executable bit, so a zip round trip
      # loses nothing.
      - name: Upload the framework and the bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: apple-xcframework
          path: |
            out/SunriseCore.xcframework
            out/swift
          if-no-files-found: error
          compression-level: 1
          # Nothing outside this run consumes it, but "Re-run failed jobs" on
          # `ios-app` the next morning is an ordinary thing to do and it
          # re-enters the *same* run, downloading rather than rebuilding. At 1
          # day that re-run fails on a expired artefact; a week covers it. The
          # repository is public, so Actions storage is not the constraint.
          retention-days: 7

  macos-app:
    name: macOS app (xcframework + SwiftLint + XCTest)
    # `macos-26` is the arm64 Tahoe image; `macos-latest` points at the same
    # one today, but this pin is load-bearing rather than cosmetic:
    # apps/apple/project.yml sets `deploymentTarget.macOS: "26.0"`, which no
    # earlier image can build. macOS 26 ships Xcode 26.6 by default (Xcode 26.0
    # through 26.6 are all present), matching the SDK the app is developed
    # against, so nothing here is approximated — the deployment target is met
    # exactly. If `macos-latest` ever advances past 26, revisit this together
    # with `macos_target` in mise.toml and `deploymentTarget` in project.yml,
    # which must all agree.
    #
    # This job no longer builds the xcframework — `apple-xcframework` above
    # does, once, and hands it here. It used to build its own, and so did
    # `ios-app`: the same three release slices and the same
    # `tools/uniffi-bindgen`, twice per run, measured at 6.3 and 5.8 minutes
    # on the runner class that bills at 10x.
    runs-on: macos-26
    timeout-minutes: 60
    needs: [changes, apple-xcframework]
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    env:
      # The framework and the bindings arrive from `apple-xcframework`. This is
      # what stops them being rebuilt here, and it is read in two places that
      # are both load-bearing: mise.toml's `apple-xcframework` task, which
      # `macos-app` `depends` on, and the `SunriseFFI` aggregate target in
      # apps/apple/project.yml, whose build script `xcodebuild` runs
      # *unconditionally* (`basedOnDependencyAnalysis: false`) and whose first
      # act would otherwise be an `rm -rf` over the artefact this job has just
      # downloaded. `mise run macos-app` passes the variable through to
      # `xcodebuild` as a build setting so Xcode exports it into that script's
      # environment.
      #
      # Nothing sets it on a developer's machine, so a local `mise run
      # macos-app` still builds the framework first, exactly as before.
      SUNRISE_FFI_PREBUILT: "1"
    steps:
      # First, and before the runner does anything else. `!cancelled()` in the
      # `if:` above replaces the implicit `success()` that `needs:` would
      # otherwise carry, so a *failed* `apple-xcframework` dispatches this job
      # rather than skipping it. That is deliberate: this job's name is a
      # required context and `apple-xcframework`'s is not, so skipping here
      # would report success and let a broken framework build merge. Running
      # and failing is the correct outcome — but without this step the failure
      # arrives minutes later as "Artifact not found", which names the symptom
      # and not the cause. This turns it into one line, in seconds, and gives
      # the macOS slot straight back.
      - name: The framework job must have succeeded
        if: needs.apple-xcframework.result != 'success'
        run: |
          echo "::error::apple-xcframework did not succeed (result: ${{ needs.apple-xcframework.result }}); there is no framework to download."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Download the framework and the bindings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: apple-xcframework
          path: out
      # None of the three are in the runner image. No Rust toolchain and no
      # `rustup target add`: with the framework prebuilt, nothing in this job
      # compiles a line of Rust.
      #
      # If `SUNRISE_FFI_PREBUILT` ever stops being honoured, this job goes red
      # rather than silently rebuilding — but not for the reason it looks like.
      # The `macos-26` image ships rustup and cargo, so the failure is not a
      # missing toolchain; it is `E0463: can't find crate for core`, from the
      # `rustup target add` that used to be here and now lives in
      # `apple-xcframework`. Red either way, and that is the direction that
      # matters, but the message names the slice rather than the guard.
      - name: Install mise, XcodeGen and SwiftLint
        run: brew install --quiet mise xcodegen swiftlint
      # mise refuses to run tasks from a config it has not been told to trust,
      # and a fresh checkout is never trusted. Explicit rather than implicit:
      # the runner has no interactive prompt to answer.
      - name: Trust mise config
        run: mise trust --yes
      - name: Toolchain versions
        # The versions are printed, not asserted: if the default Xcode ever
        # regresses below 26, the build fails on the deployment target with a
        # clearer message than any assertion here would produce. This is for
        # reading the log after.
        #
        # The `du` is the exception, and it is deliberately last. A `run:`
        # block runs under `bash -e`, so `du` on a path that is not there exits
        # non-zero and fails the step — which is the point: it turns "the
        # artefact did not unpack where project.yml expects it" into a one-line
        # failure naming the path, instead of a SwiftLint or linker error
        # thirty lines into `xcodebuild` that names something else.
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos
          swiftlint version
          xcodegen --version
          du -sh out/SunriseCore.xcframework out/swift
      # One task, deliberately. `mise run macos-app` runs `xcodegen generate`
      # (the .xcodeproj is gitignored and this is the only supported way to get
      # one), runs `swiftlint lint --strict`, and runs `xcodebuild test`.
      # Re-expressing those steps as YAML would create a second definition of
      # the macOS build that drifts from the one developers actually run — so
      # the prebuilt framework is signalled by the environment above rather
      # than by CI calling a different task.
      - name: mise run macos-app
        run: mise run macos-app

  ios-app:
    name: iOS app (xcframework + SwiftLint + XCTest + XCUITest)
    # Same image and same pin as `macos-app`, for the same reason:
    # apps/apple/project.yml sets `deploymentTarget.iOS: "26.0"`, and the iOS
    # 26 SDK and simulators ship with the Xcode on `macos-26`.
    #
    # A separate job rather than a step on `macos-app`. The two share only the
    # xcframework — which they now share as an artefact rather than by building
    # it twice — they fail for different reasons, and a red iOS test run should
    # not hide a green macOS one, nor cost the macOS build its result when the
    # simulator is the thing that broke.
    runs-on: macos-26
    timeout-minutes: 60
    needs: [changes, apple-xcframework]
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    env:
      # As in `macos-app`, and for the reason spelled out there.
      SUNRISE_FFI_PREBUILT: "1"
    steps:
      # First, and before the runner does anything else. `!cancelled()` in the
      # `if:` above replaces the implicit `success()` that `needs:` would
      # otherwise carry, so a *failed* `apple-xcframework` dispatches this job
      # rather than skipping it. That is deliberate: this job's name is a
      # required context and `apple-xcframework`'s is not, so skipping here
      # would report success and let a broken framework build merge. Running
      # and failing is the correct outcome — but without this step the failure
      # arrives minutes later as "Artifact not found", which names the symptom
      # and not the cause. This turns it into one line, in seconds, and gives
      # the macOS slot straight back.
      - name: The framework job must have succeeded
        if: needs.apple-xcframework.result != 'success'
        run: |
          echo "::error::apple-xcframework did not succeed (result: ${{ needs.apple-xcframework.result }}); there is no framework to download."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Download the framework and the bindings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: apple-xcframework
          path: out
      - name: Install mise, XcodeGen and SwiftLint
        run: brew install --quiet mise xcodegen swiftlint
      # mise refuses to run tasks from a config it has not been told to trust,
      # and a fresh checkout is never trusted. Explicit rather than implicit:
      # the runner has no interactive prompt to answer.
      - name: Trust mise config
        run: mise trust --yes
      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          xcrun simctl list devices available | grep -i iphone
          du -sh out/SunriseCore.xcframework out/swift
      # One task, as with macOS. `mise run ios-app` runs `xcodegen generate`,
      # `swiftlint --strict`, and `xcodebuild test` against the iPhone 17 Pro
      # simulator — which runs both the shared `SunriseTests` bundle and,
      # unlike the macOS job, the UI tests: a simulator runner needs no change
      # to the machine's security posture, so there is nothing to opt into.
      - name: mise run ios-app
        run: mise run ios-app
      # The bundle `mise run ios-app` leaves at `out/test-results/ios.xcresult`
      # is the one thing a red run of this job produces that is worth
      # anything, and until now it died with the runner. The task writes it
      # (`mise.toml:731-744`) and then hands it to
      # `.github/scripts/xcresult-failures.py`, which is why a failure here
      # names a file and a line rather than only a test method. What the log
      # cannot carry is the rest of the bundle: the automation activity
      # timeline, with a timestamp on every tap, query and wait, and the
      # screenshots taken at the moment of failure. Those are what separate
      # "the element was never in the hierarchy" from "it was there and the
      # poll missed it" — the question three of this job's last six failures
      # turned on and none of them could settle from the log alone (#277).
      #
      # `failure() || cancelled()` and not `always()`: a green run's bundle
      # answers nothing anyone asked and costs an upload on every build, and
      # neither of these two functions is ever true on a job that succeeded.
      #
      # The `cancelled()` half is load-bearing, not decoration. GitHub
      # documents `jobs.<job_id>.timeout-minutes` — `timeout-minutes: 60`
      # above — as "the maximum number of minutes to let a job run before
      # GitHub automatically cancels it", so a wedged simulator that eats the
      # hour ends this job *cancelled* rather than failed, and `if: failure()`
      # alone would skip this step on exactly the shape #277 calls its class E
      # and the hardest to read from a log. `cancelled()` is a job-status
      # check and not a workflow-status one, which is what makes it fire for a
      # job that timed out inside a workflow nobody cancelled: actions/runner
      # evaluates it as `JobContext.Status == ActionResult.Cancelled`
      # (`src/Runner.Worker/Expressions/CancelledFunction.cs`), and
      # `FailureFunction.cs` reads that same job status for a job-level step,
      # so on a cancelled job `failure()` is false and `cancelled()` is true.
      # GitHub's "Workflow cancellation reference" supplies the rest: on
      # cancellation the unfinished steps' `if:` conditions are re-evaluated
      # and a step whose condition evaluates true continues to run, bounded by
      # a five-minute cancellation timeout.
      #
      # What that costs, recorded rather than discovered later: `concurrency`
      # at `:19-21` sets `cancel-in-progress` for pull requests, so a run
      # superseded by a new push now uploads whatever bundle exists at the
      # moment it is killed. That is the price of covering the timeout, and it
      # is bounded — nothing is written until `mise run ios-app` reaches the
      # test phase, and `if-no-files-found: ignore` below absorbs the rest.
      #
      # That `if-no-files-found: ignore` setting covers the case where a
      # missing path is the expected outcome and not a second error to read.
      # Its commonest shape is not an earlier *step* failing — it is an
      # earlier phase inside this same step. `mise run ios-app` runs
      # `swiftlint lint --strict` (`mise.toml:685`) before it ever reaches
      # `xcodebuild`, and a strict-lint red is a frequent way for this job to
      # go down; at that point no bundle has been written at all. Uploading
      # nothing, silently, on a SwiftLint failure is the intended behaviour
      # here and not a gap in it. Pairing it with a condition that never fires
      # on success is the `fuzz` job's shape, at
      # `:1693-1703`. `retention-days: 7` is not inherited from there — that
      # step carries no such key — and is this step's own choice: a red run's
      # bundle has to outlive a weekend plus a maintainer's attention, and
      # seven days is what the framework artefact at `:320` already uses.
      #
      # `path:` is the directory holding the bundle rather than the bundle
      # itself. An `.xcresult` is a directory, and naming it directly makes
      # its loose contents the artifact root, which a maintainer then has to
      # rebuild the folder around. Naming the parent keeps `ios.xcresult` as a
      # name inside the zip, so the download unpacks into something Xcode
      # opens by double-click.
      #
      # Said plainly because it has not been established: nothing here has
      # verified that an `.xcresult` survives the zip round trip
      # `upload-artifact` performs. The framework step's own comment earns
      # that claim explicitly for its payload at `:304-305` — "no symlink and
      # no executable bit, so a zip round trip loses nothing" — and no
      # equivalent inspection has been made of a result bundle, a package
      # with its own internal structure. The "Xcode opens it by double-click"
      # sentence above rests on the directory-naming argument alone; the first
      # real failure this step catches is what will confirm or refute it.
      #
      # `compression-level: 1` for the reason recorded at `:300-305`, which
      # applies here unchanged: both ends of this round trip are 10x-billed
      # macOS runners, and a result bundle off the same runner class runs to
      # hundreds of megabytes. It was inherited by omission before, not
      # chosen.
      #
      # `name:` carries `github.run_attempt` because `upload-artifact@v4`
      # fails outright when an artifact of that name already exists in the run
      # and `overwrite:` is unset — and `:315-319` records this repository's
      # own finding that "Re-run failed jobs" re-enters the *same* run, so
      # attempt 1's artefact is still present when attempt 2 uploads. The
      # suffix rather than `overwrite: true`: comparing two red attempts side
      # by side is what diagnoses a flake, and overwriting destroys whichever
      # half of that evidence arrived first.
      - name: Keep the result bundle a failed or cancelled run leaves behind
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ios-xcresult-${{ github.run_attempt }}
          path: out/test-results
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 7

  rust-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    # Measured max 1m20s across those twelve runs. The spread is the advisory
    # database fetch, which is network and can stall; the rest is a downloaded
    # binary reading manifests.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check
          arguments: --all-features

  bun-lint:
    name: Bun lint & format
    runs-on: ubuntu-latest
    # Measured max 19s across those twelve runs, `bun install` included.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run ci

  bun-typecheck:
    name: Bun typecheck
    runs-on: ubuntu-latest
    # Measured max 21s across those twelve runs, `bun install` included.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  bun-test:
    name: Bun tests
    runs-on: ubuntu-latest
    # Measured max 17s across those twelve runs, `bun install` included.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: bun run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  bench-regression:
    name: Bench regression (informational)
    runs-on: ubuntu-latest
    # 2.5x the one nightly run with real steps, which took 12m00s on a cold
    # cache. Read that 12 minutes as compilation, not measurement: at
    # `--warm-up-time 2 --measurement-time 5` criterion's own window is a
    # small minority of it, and run 33491168956 spent 9m22s in `cargo bench`
    # and a further 2m19s compiling and running the `baseline` binary the
    # second step below uses. So this budget grows with `sunrise-bench`'s
    # dependency graph and with every target added to it -- if it starts
    # tripping, check what the crate now compiles before assuming a hang.
    timeout-minutes: 30
    # Nightly and on demand only, not on every push. It costs ~9 minutes and,
    # per the note below, produces a report rather than a verdict — paying that
    # on every commit for something nobody can act on is waste. testing.md
    # frames the auto-update as a nightly job anyway.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # NOT a merge gate, deliberately. docs/10-cross-cutting/testing.md specifies
    # a required check that blocks on a >5% regression, and that figure assumes
    # stable hardware. Measured on this runner, the same binary against its own
    # recorded baseline reports swings of +270% (ws_handshake) and -39%
    # (submit_create_task) purely from scheduling noise and a short measurement
    # window. A gate that red-lights on noise gets ignored within a week, and
    # then it protects nothing — the determinism and log-redaction gates in this
    # very file spent months green and unenforceable.
    #
    # So: run it, print the comparison, annotate the outliers, and let a human
    # read it. Promoting this to a blocking check needs dedicated hardware and
    # full-length measurement runs, at which point drop `continue-on-error` and
    # tighten the tolerance to the spec's 5%.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Reads the `rust` gate's entry rather than keeping one of its own.
          # Same runner image and the same workflow-level `RUSTFLAGS`, so the
          # same env hash — the segment these three and the `rust` job already
          # agreed on, and the job id that `shared-key` substitutes for is the
          # only one they differed in. Not a full key match: the `rust` gate
          # also declares `workspaces: . + fuzz`, which folds `fuzz/`'s manifests
          # into the trailing lock hash. rust-cache fixes its restore-key before
          # that hash, so this is a prefix hit — master's newest `rust` entry —
          # rather than an exact one, which is all this job needs.
          shared-key: rust
          # Reader, not writer. rust-cache skips saving whenever the restore
          # was an exact key hit, so under one shared key the first job to
          # finish decides the entry's contents until the next manifest change.
          # This job must not be that job. The `rust` gate's
          # `cargo test --workspace --all-targets` already compiles
          # `sunrise-bench`'s criterion dependency graph, so there is nothing
          # here to contribute — and this job is `continue-on-error`, so a
          # cache shaped by a run that was allowed to fail is not one the gate
          # should inherit.
          save-if: false
      - name: cargo bench
        # `--benches` alone still includes the lib's unittest harness, which
        # rejects criterion flags; the crate opts its lib and bin out via
        # `bench = false`.
        run: cargo bench -p sunrise-bench --benches -- --warm-up-time 2 --measurement-time 5
      - name: Compare against bench/baseline.json
        run: cargo run -q -p sunrise-bench --bin baseline -- --check target/criterion bench/baseline.json 60

  mutants:
    name: Mutation coverage
    runs-on: ubuntu-latest
    # Measured rather than derived, finally. The per-mutant cost was previously
    # assumed to transfer between crates from a `sunrise-sync` figure, with a
    # note saying that assumption wanted replacing. It does not transfer: it
    # spans a factor of eight. Full local passes at `--jobs 1` on an Apple
    # silicon laptop, 2026-09-16 at `1d4b484`:
    #
    #   sunrise-crypto    519 mutants   16m    ~1.9 s/mutant
    #   sunrise-sync      135 mutants    7m    ~3.1 s/mutant
    #   sunrise-domain   1356 mutants    2h    ~5.3 s/mutant
    #   sunrise-core     1259 mutants     -    ~15.4 s/mutant, over the first 76
    #
    # `sunrise-core` is the only one not run to completion; its rate is a
    # partial sample and projects to roughly 5.4 hours whole. That is what sets
    # this ceiling, not `sunrise-domain`: core's largest shard is 315 mutants at
    # ~15.4 s, about 81 minutes, where domain's 226 at ~5.3 s is about 20. A
    # hosted runner is slower than the laptop these came from, and 120 is set
    # to absorb that — but by how much is not derivable from what is written
    # here, because three terms under it are unmeasured. State all three.
    #
    # The first is the runner ratio. 81 minutes holds at the laptop's
    # per-mutant cost; `ubuntu-latest` is slower by a factor nobody has
    # written down. At 1.5x, core's largest shard is 121 minutes of mutants
    # alone and this job times out; every other shard survives a much worse
    # ratio. Nobody has timed a shard on a runner, because the matrix has
    # never completed one — so the ratio is unrecorded rather than measured
    # and generous.
    #
    # The second is what `315 x 15.4 s` leaves out, which is the job around
    # the run rather than the run: `actions/checkout`, the toolchain action,
    # a `Swatinem/rust-cache` that is cold on a nightly, and the cargo-mutants
    # install. Those are additive, none is timed here, and each pushes the
    # break-even ratio below 1.5x.
    #
    # What it does not leave out is the baseline build, and an earlier
    # revision of this comment claimed it did. `cargo mutants` does build and
    # test the tree unmutated once per invocation — in a fresh tree that
    # compiles SQLCipher from source through `rusqlite`'s `bundled-sqlcipher`,
    # as `.cargo/mutants.toml` records and `crates/sunrise-core/Cargo.toml`
    # pulls — but the per-mutant figures above are full-pass wall clock
    # divided by mutants, so every one of them already contains it.
    # `docs/10-cross-cutting/testing.md` defines the column that way and its
    # three completed rows divide out. Adding it here would count it twice,
    # and the correction is not cosmetic: the lever this comment
    # ends on is more shards, and more shards buys more baseline builds, not
    # fewer.
    #
    # The third term is `15.4` itself, and it is the one that decides which
    # way the bound points. `sunrise-core` has no completed pass and no
    # recorded wall clock, and nothing in this repository says whether 15.4
    # is that same full-pass average taken over its first 76 mutants or a
    # marginal rate off cargo-mutants' own output. If it is the average, it
    # carries 1/76th of a baseline build and `315 x 15.4` charges that build
    # 315/76 times — about four — so the arithmetic **over**-counts fixed
    # cost. If it is marginal, it carries none and the arithmetic
    # under-counts.
    #
    # So ~1.5x is not a measured break-even, and it is not established as a
    # bound in either direction: the second term pushes it down, the third
    # pushes it up if 15.4 is an average, and no shard has completed at any
    # revision to settle which dominates. No corrected figure is offered: a
    # second number derived from the same missing measurement is exactly what
    # this comment exists to stop. What would settle it is one completed
    # `sunrise-core` pass with its wall clock recorded — the same pass #246 is
    # waiting on for that crate's floor.
    #
    # The lever if it turns out to be wrong is `sunrise-core`'s shard count,
    # not this number: the longest shard is the only one near the ceiling, and
    # raising `timeout-minutes` only lets a bad ratio cost more. Splitting
    # core further does shorten the longest shard, but **sub**-proportionally
    # — each new shard pays another baseline build — and total runner minutes
    # rise with every split. And the failure is cheap while it lasts —
    # `sunrise-core` has no recorded floor, so a shard that times out spends
    # runner minutes and gates nothing.
    #
    # If core's shard count rises, this can come down with it.
    timeout-minutes: 120
    # Nightly and on demand, never on a pull request. The four scoped crates
    # generate 3,269 mutants — the sum of the four populations recorded on
    # the matrix below — and each one is an incremental rebuild plus a test
    # run; a full pass is hours, which is exactly why
    # docs/10-cross-cutting/testing.md scopes this to release candidates rather
    # than to every commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      # Not fail-fast: a regression in one crate should not hide the scores of
      # the other three, and the gate below needs every shard's outcomes to
      # compute a crate's rate correctly.
      fail-fast: false
      matrix:
        # Sharded by crate rather than one shard-space across the workspace,
        # because the gate scores per crate and a shard that straddles two
        # crates makes a partial denominator. Populations, re-counted at
        # `1d4b484` with `cargo mutants --list -p <crate> --all-features`:
        # sunrise-domain 1356, sunrise-core 1259, sunrise-crypto 519,
        # sunrise-sync 135. The figures here were 1352/740/296/94 and had
        # drifted with the crates.
        #
        # Shard counts are not proportional to those populations, and should
        # not be: per-mutant cost spans a factor of eight across the four, so
        # the population is not the cost. The table above is what they balance
        # against — sunrise-core at 4 shards is 315 mutants at ~15.4 s, the
        # longest shard at about 81 minutes, where sunrise-domain at 6 is 226
        # at ~5.3 s, about 20.
        #
        # `--shard k/n` is zero-based: cargo-mutants requires k < n and rejects
        # n/n outright ("shard k must be less than n"). So a crate split n ways
        # is 0/n through (n-1)/n, and a crate run whole is 0/1.
        include:
          - { crate: sunrise-domain, shard: 0/6 }
          - { crate: sunrise-domain, shard: 1/6 }
          - { crate: sunrise-domain, shard: 2/6 }
          - { crate: sunrise-domain, shard: 3/6 }
          - { crate: sunrise-domain, shard: 4/6 }
          - { crate: sunrise-domain, shard: 5/6 }
          - { crate: sunrise-core, shard: 0/4 }
          - { crate: sunrise-core, shard: 1/4 }
          - { crate: sunrise-core, shard: 2/4 }
          - { crate: sunrise-core, shard: 3/4 }
          - { crate: sunrise-crypto, shard: 0/2 }
          - { crate: sunrise-crypto, shard: 1/2 }
          - { crate: sunrise-sync, shard: 0/1 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Reads the `rust` gate's entry rather than keeping one of its own.
          # Same runner image and the same workflow-level `RUSTFLAGS`, so the
          # same env hash — the segment these three and the `rust` job already
          # agreed on, and the job id that `shared-key` substitutes for is the
          # only one they differed in. Not a full key match: the `rust` gate
          # also declares `workspaces: . + fuzz`, which folds `fuzz/`'s manifests
          # into the trailing lock hash. rust-cache fixes its restore-key before
          # that hash, so this is a prefix hit — master's newest `rust` entry —
          # rather than an exact one, which is all this job needs.
          shared-key: rust
          # Reader, not writer, and here that settles two questions at once.
          # rust-cache skips saving whenever the restore was an exact key hit,
          # so under one shared key the first job to finish decides the entry's
          # contents until the next manifest change — and cargo-mutants copies
          # the tree into temporary directories and builds there, so a leg's
          # `target/` at job end holds the baseline build and nothing else, the
          # least representative snapshot of the thirteen. The other question is
          # that there are thirteen legs: left saving, they would race for one
          # immutable key, and twelve would upload ~700 MiB apiece to lose it.
          save-if: false
      - name: Install cargo-mutants
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73  # v2.87.17
        with:
          tool: cargo-mutants
      - name: Mutate ${{ matrix.crate }} (shard ${{ matrix.shard }})
        # `--jobs 1` here for the same reason the mise task pins it: each job
        # is a full copy of the tree plus a resident rustc, and a hosted runner
        # has less headroom than the laptop the figure was measured on.
        #
        # cargo-mutants exits 2 when mutants survived and 3 when some timed
        # out. Both mean the run measured something, and on this workspace
        # both are the ordinary result — no scoped crate is near 100%. Whether
        # that measurement is good enough is the gate's question, not this
        # step's, so 0/2/3 are success here and every other code propagates.
        # Red on this step now means the shard could not be measured at all.
        run: |
          # cargo-mutants creates its own `mutants.out` but not the parent it
          # was told to put it in, and `out/` is gitignored, so a fresh
          # checkout has none. `mise.toml`'s `mutants` task has always created
          # it; this job never did, so every shard failed here with
          # `create output parent directory ... No such file or directory`
          # before it measured a single mutant.
          mkdir -p out/mutants
          # The revision this shard is measured at, captured before the
          # run and moved beside the outcomes after it. `--update` reads
          # it from there, so the floor a nightly's artifacts produce is
          # stamped with the revision the mutants actually ran against
          # rather than with whatever HEAD was when someone downloaded
          # them. Thirteen shards write thirteen stamps and the gate
          # refuses if they do not agree on a revision.
          .github/scripts/mutants-gate.py \
            --record-revision out/mutants/revision.json
          rc=0
          # `--all-features` for the reason mise.toml's `mutants` task spells
          # out at length: cargo-mutants mutates the source file, cargo decides
          # whether that file is compiled, and a module behind a non-default
          # feature is mutated, not built, and then scored MISSED. That reads
          # in outcomes.json exactly like a mutant the tests failed to kill.
          # Without this flag every one of `sunrise-sync`'s 94 `src/sse.rs`
          # mutants missed — 94 of 94 — and this job reported it as the crate's
          # coverage. The two must stay in step; a matrix that measures
          # something the local task does not is a floor nobody can reproduce.
          cargo mutants -p ${{ matrix.crate }} \
            --all-features \
            --jobs 1 --shard ${{ matrix.shard }} \
            --output out/mutants || rc=$?
          case "$rc" in
            0 | 2 | 3) ;;
            *) exit "$rc" ;;
          esac
          mv out/mutants/revision.json out/mutants/mutants.out/revision.json
      - name: Upload outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutants-${{ matrix.crate }}-${{ strategy.job-index }}
          # Both files, and they have to travel together: the gate looks
          # for the revision stamp beside the outcomes it is reading, and
          # an outcomes file that arrives alone is a measurement whose
          # revision nobody recorded. Two paths under one directory make
          # that directory the artifact root, so they land side by side
          # again on download.
          path: |
            out/mutants/mutants.out/outcomes.json
            out/mutants/mutants.out/revision.json

  mutants-gate:
    name: Mutation coverage gate
    runs-on: ubuntu-latest
    # Downloads thirteen small artefacts and runs one Python script over them.
    # Seconds of work; the artefact download is the only part that can stall.
    timeout-minutes: 10
    needs: mutants
    # `always()` so the gate still scores the shards that finished when one
    # fails to run. A missing shard lowers a crate's measured rate and the gate
    # will say so, which is the honest outcome — silence would not be.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: mutants-*
          path: outcomes
      - name: Compare against mutants/baseline.json
        # `--expect-shards` mirrors the matrix above, and has to be edited with
        # it. Without it a shard whose runner died is silently a crate that
        # scores low, and the gate blames the tests for a dead runner. With it,
        # a short crate is reported as a broken run and left unscored.
        run: |
          .github/scripts/mutants-gate.py outcomes/*/outcomes.json \
            --expect-shards sunrise-domain=6,sunrise-core=4,sunrise-crypto=2,sunrise-sync=1

  mutants-gate-contract:
    name: Mutation gate contract
    runs-on: ubuntu-latest
    # One Python script over fixtures it synthesises itself: no toolchain, no
    # cargo, no network past the checkout. Seconds of work.
    timeout-minutes: 5
    # Deliberately not inside the nightly `Mutation coverage gate` job above,
    # and deliberately without an `if:` — so it runs on every trigger this
    # workflow has, pull requests included. What it asserts is the gate's
    # exit-code contract, which is what ci.yml and the gate's own printed
    # remedies depend on, and it has drifted twice — both times in a pull
    # request that a 04:00 schedule would only have caught the morning after
    # it merged. Running it nightly as well costs a second and occasionally
    # catches a change to the runner rather than to the gate. It needs no
    # Rust, no cargo-mutants and no outcomes: it synthesises its fixtures.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code contract
        run: python3 .github/scripts/test_mutants_gate.py

  mutants-flags-gate:
    name: Mutation flag gate
    runs-on: ubuntu-latest
    # Reads mise.toml and every *.yml, *.yaml and *.sh under .github/ as
    # text — every line of them, lexed as shell — and asserts how many
    # cargo-mutants invocations it found and that the two that matter are
    # still in mise.toml and in this file. No toolchain, no cargo, no
    # network past the checkout.
    timeout-minutes: 5
    # Deliberately without an `if:`, like the contract job above and unlike
    # the `mutants` matrix. `--all-features` is written in three places —
    # the `mutants` task in mise.toml, the `mutants` matrix in this file,
    # and prose in docs/10-cross-cutting/testing.md §Features — and until
    # now nothing kept them in step. The divergence this guards against
    # gets introduced in a pull request, so it has to be caught in one:
    # the matrix that would notice it for real is `schedule ||
    # workflow_dispatch` and would not report until the next morning at
    # 04:00, by which time a floor has already been compared against a
    # population that was measured differently.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Every cargo-mutants invocation carries --all-features
        run: python3 .github/scripts/mutants-flags-gate.py

  mutants-flags-gate-contract:
    name: Mutation flag gate contract
    runs-on: ubuntu-latest
    # One Python script over two files it synthesises itself. Seconds.
    timeout-minutes: 5
    # The gate above reads this repository; this reads fixtures it
    # synthesises, with one deliberate exception. Both are needed and
    # neither substitutes for the other: the gate passing says the tree is
    # in step, and says nothing about whether the gate would notice if it
    # were not. The only way to watch it go red is to hand it two files
    # that disagree, and the two files it reads in anger are ones nobody
    # wants edited to find out.
    #
    # The exception is one case, which runs the gate against this
    # repository and asserts it holds the number of invocations the gate
    # states. That number is otherwise asserted nowhere blocking, because
    # `Mutation flag gate` above is not a required check. Its cost: an
    # untracked `.github/**/*.sh` holding a cargo-mutants line fails this
    # suite locally while the tracked tree is fine.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code contract
        run: python3 .github/scripts/test_mutants_flags_gate.py

  core-filesystem-gate-contract:
    name: Core filesystem gate contract
    runs-on: ubuntu-latest
    # One Python script over a crate it synthesises in a temp directory: no
    # toolchain, no cargo, no network past the checkout. Seconds of work.
    timeout-minutes: 5
    # Deliberately without an `if:`, like the mutation gate's contract above, so
    # it runs on every trigger this workflow has. What it asserts is that the
    # gate can still say no: the first version stopped reading a file at its
    # first `#[cfg(test)]` line, which left 97% of engine/oplog.rs and 95% of
    # keychain/mod.rs unscanned the moment those modules were split -- and
    # reported OK for both. The `Determinism gate` job below runs the gate; this
    # one asserts the gate is a check.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code and coverage contract
        run: python3 .github/scripts/test_core_filesystem_gate.py

  determinism:
    name: Determinism gate
    runs-on: ubuntu-latest
    # Checkout plus one grep. Measured max 7s across those twelve runs.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Reject ambient RNG in core crates
        run: |
          # docs/01-architecture/shared-core.md §determinism-rules — randomness
          # comes from the injected `CoreConfig::rng`, never an ambient source.
          #
          # This backstops clippy.toml's `disallowed-methods`, which binds only
          # inside crates that depend on `rand` directly (6 of 23). The grep
          # binds everywhere, and catches spellings a path-based lint would
          # also catch but a naive regex would miss: turbofish
          # (`rand::random::<u64>()`), the rand 0.9 rename (`rand::rng()`),
          # and a bare `thread_rng()` behind a `use`.
          .github/scripts/grep-gate.sh \
            "determinism" \
            '\brand::(thread_rng|random|rng)[[:space:]]*(::<[^>]*>)?[[:space:]]*\(|(^|[^.[:alnum:]_])thread_rng[[:space:]]*\(' \
            crates/*/src crates/*/tests crates/*/benches
      - name: Reject filesystem access outside the core's storage seam
        # docs/01-architecture/shared-core.md §determinism-rules rule 2 — the
        # core reads and writes through `CoreConfig::storage`, so a test can
        # supply one and a vault is the only thing on disk.
        #
        # Not a `clippy.toml` entry, and it cannot be: that file is
        # workspace-wide, and nine of twenty crates touch the filesystem on
        # purpose. A `std::fs` deny there fires in eight crates the rule was
        # never about. This is scoped the way the rule is scoped -- one crate --
        # and carries a visible allowlist of the two documented exceptions.
        run: python3 .github/scripts/core-filesystem-gate.py

  file-size:
    name: File size gate
    runs-on: ubuntu-latest
    # Checkout plus one pass over the Rust files in three packages.
    timeout-minutes: 5
    # Its own job rather than a step inside `Determinism gate`, which is where
    # it first landed. File length has nothing to do with determinism: the four
    # rules that job enforces are about clocks, the filesystem, randomness and
    # threads, and a red "Determinism gate" for a file that got long sends the
    # reader to shared-core.md to look for a rule that is not there. Every other
    # gate here is its own check for the same reason -- orphan-crate-gate,
    # proptest-persistence, doc-comment, docs-link.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Reject a file that grew past its package's threshold
        # No file in this repository had a bound until engine.rs reached 18,568
        # lines -- six impl blocks, ninety free functions and a ten-thousand-line
        # test module in one file. It got there one reasonable commit at a time.
        #
        # Thresholds are each package's own p90, not a number from a style
        # guide, and the baseline in the script names every file over one today
        # with what it is. That list may shrink and may not grow.
        #
        # Exit 1 is "a file grew"; exit 2 is "the baseline needs a line
        # deleted". Both are red, and the output says which it is.
        run: python3 .github/scripts/file-size-gate.py

  file-size-gate-contract:
    name: File size gate contract
    runs-on: ubuntu-latest
    # One Python script over packages it synthesises in a temp directory: no
    # toolchain, no cargo, no network past the checkout. Seconds of work.
    timeout-minutes: 5
    # No `if:`, like the other gate contracts, so it runs on pull requests. The
    # gate shipped with three failure modes and nothing asserting any of them --
    # they were checked by hand once, against whatever tree was on disk.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code contract
        run: python3 .github/scripts/test_file_size_gate.py

  appcast-contract:
    name: Appcast generator contract
    runs-on: ubuntu-latest
    # One Python script over JSON it synthesises in a temp directory: no
    # toolchain, no cargo, no network past the checkout. Seconds of work.
    timeout-minutes: 5
    # No `if:`, like the other gate contracts, so it runs on pull requests.
    # What it asserts is not visible to `actionlint` and has no other check:
    # which release lands on which Sparkle channel, and whether a signature
    # in hand describes the bytes being advertised. The only other way to
    # find out is to publish a release and watch every installed copy either
    # update or stop updating. See ADR-0038.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Appcast rules
        run: python3 .github/scripts/test_appcast.py

  log-redaction:
    name: Log redaction gate
    runs-on: ubuntu-latest
    # Checkout plus one grep. Measured max 8s across those twelve runs.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Reject .expose() in logging/telemetry/observability surfaces
        run: |
          # docs/10-cross-cutting/logging.md §6.3 — no Plain<T>::expose() inside
          # code that emits log records.
          #
          # The list below is every crate that emits a log record today
          # (`sunrise-log`, `-server`, `-cli`, `-storage`, `-core`) plus the
          # client-seam crates that are next in line to (`-sync`,
          # `-client-core`, `-core-bindings`, `-relay-client`, `-http-sig`).
          # It used to be
          # `crates/sunrise-log/src` plus three glob patterns that matched
          # nothing and a `packages/sunrise-log/src` that never existed — a
          # gate over one orphan crate that no other code could reach. It also
          # named `crates/sunrise-tui/src` until ADR-0019 deleted that crate:
          # `grep-gate.sh` drops paths that do not exist, so a stale entry
          # costs coverage without ever costing a red build, which is exactly
          # how a gate rots unnoticed.
          #
          # **When a crate starts logging, add it here.** Listing one before it
          # logs is free — grep over a tree with no `.expose()` is a no-op —
          # and it is the only way the gate is already in place on the commit
          # that introduces the first `tracing::info!`. The glob patterns are
          # kept so a future `telemetry/` or `observability/` module in any
          # crate is covered the moment it appears; `grep-gate.sh` skips paths
          # that do not exist and fails if *none* do, so this cannot silently
          # degrade to a no-op.
          .github/scripts/grep-gate.sh \
            "log-redaction" \
            '\bplain[a-z_]*\.expose[[:space:]]*\(' \
            crates/sunrise-log/src \
            crates/sunrise-server/src \
            crates/sunrise-cli/src \
            crates/sunrise-storage/src \
            crates/sunrise-core/src \
            crates/sunrise-sync/src \
            crates/sunrise-client-core/src \
            crates/sunrise-core-bindings/src \
            crates/sunrise-http-sig/src \
            crates/sunrise-relay-client/src \
            crates/*/src/telemetry crates/*/src/logging crates/*/src/observability

  kynos-waiver:
    name: Kynos waiver gate
    runs-on: ubuntu-latest
    # Measured max 30s across those twelve runs: a toolchain install and a
    # `cargo metadata`, which resolves features without compiling.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # `cargo metadata` resolves features without compiling anything, so this
      # job needs a cargo on PATH and takes seconds.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - name: Reject any escape hatch that would make the description opaque
        # ADR-0021 adopts kynos on the premise that a handler which cannot be
        # described does not compile. Every documented way around that sits
        # behind one feature, and each item behind it stamps an operation with
        # an `OpaqueReason`. Asserting the feature is off is therefore stronger
        # than inspecting the reasons at runtime -- and it is the strict gate
        # the ADR called unholdable, which ADR-0023 made holdable by removing
        # the one legitimate upgrade route.
        run: .github/scripts/kynos-waiver-gate.py

  kynos-waiver-gate-contract:
    name: Kynos waiver gate contract
    runs-on: ubuntu-latest
    # One Python script over two-crate workspaces it synthesises in a temp
    # directory. It needs a cargo, because what the gate reads is a resolved
    # feature set and nothing else can produce one — but only
    # `cargo metadata --all-features` over path dependencies, which resolves
    # without touching the registry or compiling anything. Seconds of work.
    timeout-minutes: 10
    # Deliberately without an `if:`, like the other gate contracts, so it runs
    # on pull requests. The gate asserts something about the published API
    # surface — that no operation in the description can be flagged opaque —
    # on the strength of one feature lookup, and the shape it looks that up in
    # has already moved once: package ids became opaque in newer Cargo, and
    # kynos moved to a git pin. A lookup that silently stopped finding the
    # package would print OK over a workspace with the hatch wide open.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - name: Exit-code contract
        run: python3 .github/scripts/test_kynos_waiver_gate.py

  openapi-current:
    name: OpenAPI description gate
    runs-on: ubuntu-latest
    # Measured 36-53s on a warm `rust-cache` and 4m17s on a cold one across
    # those twelve runs; the spread is one `cargo build` of `sunrise-server`.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Reads the `rust` gate's entry rather than keeping one of its own.
          # Same runner image and the same workflow-level `RUSTFLAGS`, so the
          # same env hash — the segment these three and the `rust` job already
          # agreed on, and the job id that `shared-key` substitutes for is the
          # only one they differed in. Not a full key match: the `rust` gate
          # also declares `workspaces: . + fuzz`, which folds `fuzz/`'s manifests
          # into the trailing lock hash. rust-cache fixes its restore-key before
          # that hash, so this is a prefix hit — master's newest `rust` entry —
          # rather than an exact one, which is all this job needs.
          shared-key: rust
          # Reader, not writer. rust-cache skips saving whenever the restore
          # was an exact key hit, so under one shared key the first job to
          # finish decides the entry's contents until the next manifest change.
          # This job must not be that job: it builds only `sunrise-server` and
          # finishes in under a minute warm, so an entry shaped by it would be
          # a poor inheritance for the `--workspace --all-targets` build that
          # fills it — that is the 36-53s-versus-4m17s spread noted above,
          # seen from the other side.
          save-if: false
      - name: Reject a description that has drifted from its handlers
        # `schemas/generated/openapi.v1.json` is an *input*: `spargen` generates the relay
        # client from it. A stale one yields a client that disagrees with the
        # server and compiles perfectly while doing so, so regenerating it is
        # not optional and cannot be left to a reviewer noticing.
        run: |
          cargo run -q -p sunrise-server --bin openapi -- schemas/generated/openapi.v1.json
          git diff --exit-code -- schemas/generated/openapi.v1.json \
            || { echo "::error::openapi: the description is stale; run \`mise run openapi\` and commit the result."; exit 1; }

  tokens-current:
    name: Design token gate
    runs-on: ubuntu-latest
    # Newer than the last run that had real steps, so sized from what it does
    # rather than measured: a `bun install`, the TypeScript token build, and
    # one `rustc --emit=metadata` over a single generated file. That is
    # `bun-typecheck` (21s measured) plus a toolchain install.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Reject generated tokens that have drifted from their TOML
        # The four files under `packages/sunrise-ui-tokens/generated/` are
        # *inputs*: Xcode compiles `tokens.swift` and Vite bundles `tokens.css`,
        # and neither build environment can run the generator. A stale one
        # compiles perfectly while being wrong, which is exactly the failure the
        # OpenAPI gate above exists to stop. `tokens.rs` has no consumer yet, so
        # the same task also compiles and rustfmts it — nothing else would
        # notice it rotting.
        run: |
          bun run packages/sunrise-ui-tokens/build.ts
          git diff --exit-code -- packages/sunrise-ui-tokens/generated \
            || { echo "::error::tokens: the generated files are stale; run \`mise run tokens\` and commit the result."; exit 1; }
          meta="$(mktemp -d)"
          rustc --edition 2021 --crate-type rlib --emit=metadata \
            --out-dir "$meta" packages/sunrise-ui-tokens/generated/tokens.rs
          rustfmt --check --edition 2021 packages/sunrise-ui-tokens/generated/tokens.rs

  # The string catalog's drift gate, in the design tokens' shape (ADR-0054,
  # after ADR-0029): the four files under `packages/sunrise-i18n/generated/`
  # are inputs to Xcode and to the CLI's `cargo build`, neither of which can
  # run the generator. `strings.rs` needs no compile step here: the CLI
  # `include!`s it, so the `rust` job compiles and lints it.
  i18n-current:
    name: String catalog gate
    runs-on: ubuntu-latest
    # Sized from what it does: a `bun install` and one TypeScript build over
    # one TOML file — `bun-typecheck`'s 21s, measured, with room.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Reject generated string bindings that have drifted from i18n/*.toml
        # `git status --porcelain`, not `git diff --exit-code`: a binding the
        # generator newly emits is untracked, and `git diff` is silent about it.
        run: |
          bun run packages/sunrise-i18n/build.ts
          stale="$(git status --porcelain -- packages/sunrise-i18n/generated)"
          if [ -n "$stale" ]; then
            printf '%s\n' "$stale"
            echo "::error::i18n: the generated bindings are stale; run \`mise run i18n\` and commit the result."
            exit 1
          fi

  # docs/10-cross-cutting/i18n.md §Plural-rule test coverage: one entry per
  # locale, the three between them holding every CLDR plural category. A
  # locale with a catalog is checked against its own messages; one without is
  # checked against the template a translator into it would start from. A
  # missing or dead plural arm fails. Adding a translated locale adds an entry.
  i18n-plurals:
    name: Plural coverage (${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every locale reports, so one failure does not hide another's.
      fail-fast: false
      matrix:
        locale: [en, pl, ar]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Every message compiles and renders under the CLDR rules of this locale
        env:
          LOCALE: ${{ matrix.locale }}
        run: bun run packages/sunrise-i18n/plurals.ts "$LOCALE"

  # `apps/docs` is VitePress over `docs/`. Its build is the only thing that
  # notices a doc VitePress cannot render — a dead page link, or prose Vue
  # would read as a template — so it runs on every change.
  docs-site:
    name: Docs site build
    runs-on: ubuntu-latest
    # Measured at 5s locally for 166 pages, plus `bun install`.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @sunrise/docs build

  orphan-crates:
    name: Orphan crate gate
    runs-on: ubuntu-latest
    # Measured max 27s across those twelve runs: a toolchain install and a
    # `cargo metadata --no-deps`, which reads manifests and nothing else.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # `cargo metadata --no-deps` reads the workspace manifests and nothing
      # else — no resolution, no registry, no compilation — so this job needs a
      # cargo on PATH and takes seconds. Nothing to cache.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - name: Reject crates unreachable from every shipping binary
        # The recurring v1 defect was a library seam that is correct, tested
        # and linked by nobody: `cargo test --workspace` green, and the feature
        # nonexistent for a user. That shape is plainly visible in the
        # dependency graph, so the graph is where it gets caught. The script
        # carries its own exemption and quarantine lists, each entry with a
        # reason, and fails when one of them goes stale.
        run: .github/scripts/orphan-crate-gate.py

  orphan-crate-gate-contract:
    name: Orphan crate gate contract
    runs-on: ubuntu-latest
    # One Python script over workspaces of two to four one-line crates,
    # synthesised in a temp directory. It needs a cargo for the same reason the
    # job above does — `cargo metadata --no-deps` reads manifests and nothing
    # else — and nothing to cache. Seconds of work.
    timeout-minutes: 10
    # Deliberately without an `if:`, like the other gate contracts, so it runs
    # on pull requests. The number this gate prints is cited by
    # `docs/implementation/overview.md`, and nothing checked the walk that
    # produces it: an edge that stopped being followed, or a root that stopped
    # being a root, changes the count without changing the verdict. Every pass
    # case in the contract asserts the count for that reason.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - name: Exit-code contract
        run: python3 .github/scripts/test_orphan_crate_gate.py


  proptest-persistence:
    name: Proptest persistence gate
    runs-on: ubuntu-latest
    # `actions/checkout` and one standard-library Python script over the 40
    # tracked integration-test files. No toolchain, nothing to cache, no
    # network call. It shells out to `git ls-files` and `git check-ignore`,
    # which is why it needs the checkout and nothing else.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Reject a tests/ proptest that does not set failure_persistence
        # A shrunken counterexample is the one output of a property test that
        # cannot be regenerated on demand, so #118 made these files tracked and
        # gave every `tests/` proptest an explicit
        # `FileFailurePersistence::Direct`. Without it proptest writes a flat
        # `<name>.proptest-regressions` beside the test, which `.gitignore`
        # deliberately does not hide — and "somebody will notice it in
        # `git status`" is the enforcement this repository has replaced with a
        # gate everywhere else.
        run: .github/scripts/proptest-persistence-gate.py

  observability-catalog:
    name: Observability catalogue gate
    runs-on: ubuntu-latest
    # `actions/checkout` and one standard-library Python script that walks
    # `crates/sunrise-server/src` and one markdown file. No toolchain, nothing
    # to cache, no network call.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history, because the gate resolves each block's
          # `Last extracted:` marker to a commit. Under the default shallow
          # checkout that object is absent and the script skips the check,
          # which would quietly retire half of what this job is for.
          fetch-depth: 0
      - name: Reject an extracted block that has drifted from the tree
        # The two blocks in observability.md are what an operator reads to know
        # what this server emits, and a missing entry is invisible in a way a
        # stale document usually is not: it still parses, still reads
        # coherently, and its own marker says it was checked. It had drifted
        # twice in one cycle before anything ran the extraction.
        run: .github/scripts/observability-catalog-gate.py

  doc-comments:
    name: Doc comment gate
    runs-on: ubuntu-latest
    # The same shape and the same cost as `docs-links` below: `actions/checkout`
    # plus one standard-library Python script over the 234 tracked `.rs` files,
    # no network call, no toolchain to install and nothing to cache. Well under
    # a second locally.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Reject a doc comment mangled into a shape rustdoc misreads
        # `cargo fmt` does not reflow comments — rustfmt says so deliberately —
        # and clippy has no rule for comment shape, so a doc comment folded onto
        # one physical line, split in two by a stray blank line, stranded below
        # an attribute, or indented until rustdoc reads it as code passes
        # everything else in this file. PR #77 created the folded shape twice,
        # the second time while fixing the first. The script carries its own
        # self-test and runs it as a precondition of the check.
        run: .github/scripts/doc-comment-gate.py

  docs-links:
    name: Docs link gate
    runs-on: ubuntu-latest
    # Newer than the last run that had real steps, so sized from what it does
    # rather than measured: `actions/checkout` plus one standard-library Python
    # script that reads 130 files and makes no network call. No toolchain to
    # install and nothing to cache — it is the cheapest job in this workflow,
    # and it runs in well under a second locally.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # `python3` is preinstalled on ubuntu-latest and the script imports only
      # the standard library, so there is no setup step and no dependency to
      # pin. The script shells out to `git ls-files`, which is why it needs the
      # checkout and nothing else.
      - name: Reject a markdown link or anchor that resolves to nothing
        # Nothing checked that a relative link or a heading anchor pointed at
        # anything real, so a mis-transcribed anchor was invisible: GitHub finds
        # no such fragment and silently leaves the reader at the top of the
        # file. The live instance was an ADR cross-reference whose slug doubled
        # a hyphen the heading does not double, because GitHub *removes* a
        # character like `→` rather than replacing it and the spaces that
        # surrounded it survive. External URLs are deliberately out of scope —
        # the docs cite many third-party URLs and a gate that goes red on
        # someone else's outage is one people learn to ignore.
        run: .github/scripts/docs-link-gate.py

  citations:
    name: Citation gate
    runs-on: ubuntu-latest
    # The same shape and the same cost as `docs-links` above: `actions/checkout`
    # plus one standard-library Python script over the tracked markdown and
    # `.rs` files, no network call, no toolchain to install and nothing to
    # cache. Well under a second locally.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Reject a backticked path:line#symbol citation that points at nothing
        # This repository cites its own source in inline code spans —
        # `crates/sunrise-sync/src/backoff.rs:31-63` — close to a thousand of
        # them, and until this gate not one was checked. That is not an
        # oversight in `docs-links` or `doc-comments`: both blank inline code
        # before they read a line, deliberately, so a document about markdown is
        # not read as containing it. A code span is therefore exactly the shape
        # those two agree to ignore and exactly the shape a path is cited in, so
        # a moved file or a shifted line number rots in silence — and a `:199`
        # rots without the file moving at all.
        #
        # Three anchors: the repository root, the citing file's own directory
        # (the resolution imported from `docs-link-gate.py`, so the two gates
        # cannot disagree about where `../x.md` points), and the crate root for
        # a file under `crates/<name>/`, because Cargo fixes that layout. A
        # `../` path has one reading and a dangling one fails; a bare filename
        # has as many readings as there are directories, so it is declined,
        # counted and listable rather than guessed at. The extension set is
        # closed, or `task.update` and `Task.blocks` read as paths. The script
        # carries its own self-test and runs it as a precondition.
        #
        # A citation may also name the item it means —
        # `crates/sunrise-core/src/engine/sync.rs:702#is_revoked` — and that
        # form, `path:line#symbol`, is this repository's citation convention.
        # The cited line must then fall inside that item's span, so a line that
        # drifts onto unrelated code fails here instead of passing because the
        # line still exists; that drift is what this gate was extended to
        # catch, measured on ADR-0034, where eight of nine citations had rotted
        # while the gate stayed green. `path#symbol` with no line checks only
        # that the item is still declared.
        #
        # Three behaviours to know before writing one. A suffix that is not a
        # bare Rust item name (`#Engine::f`, `#f()`) is a FAILURE, reported
        # after the path and line checks have run on the same span, so it can
        # never subtract a check the citation already had. A github.com
        # permalink fragment — `#L702`, `#L702-L710` and the column forms —
        # and any `#symbol` on a non-`.rs` target are DECLINED rather than
        # failed, and what is declined is the SYMBOL check alone: the span
        # keeps every other check and stays in the checked count. The
        # DIRECTORY check is one of those others and is declined for
        # nothing, so a path resolving to a directory fails with ANY suffix,
        # whatever the extension and whatever the suffix spells — a directory
        # declares no items and has no lines, which is what `dir:702` has
        # always failed on. Neither an
        # `impl` block nor a `mod` is a legal target, because `#Engine`
        # spanned 97.7% of `sync.rs` and `mod tests` in `api/sync/suite.rs`
        # spans 99.5% of it, so neither checked anything.
        #
        # The full rule lives in the script's own module docstring, and
        # `mise.toml`'s `citations` task carries the same summary. All three
        # move together or the records lag the code, which is the defect this
        # gate exists to catch.
        run: .github/scripts/citation-gate.py

  citation-gate-contract:
    name: Citation gate contract
    runs-on: ubuntu-latest
    # One Python script over git repositories it synthesises in a temp
    # directory: no toolchain, no cargo, no network past the checkout. Seconds
    # of work.
    timeout-minutes: 5
    # Deliberately without an `if:`, like the other gate contracts, so it runs
    # on pull requests. What it asserts is the gate's *discrimination*: it has
    # to fire on a dangling `crates/.../nonexistent.rs:1` and stay silent on
    # `Vec<u8>`, `cargo test --workspace`, `task.update` and the 600 bare
    # filenames in this repository that are shorthand rather than citations.
    # Those two halves fail in opposite directions from the same edit, and a
    # gate that fires on everything is as useless as one that fires on nothing.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code and discrimination contract
        run: python3 .github/scripts/test_citation_gate.py

  doc-comment-gate-contract:
    name: Doc comment gate contract
    runs-on: ubuntu-latest
    # One Python script over crates it synthesises in a temp directory: no
    # toolchain, no cargo, no network past the checkout. Seconds of work.
    timeout-minutes: 5
    # Deliberately without an `if:`, like the other gate contracts, so it runs
    # on pull requests. The gate's own `--self-test` runs `scan_text` over six
    # string literals and reaches nothing else: not the `git ls-files` listing,
    # not the 50-file floor that says "the scan is broken" rather than "the tree
    # is clean", not the exit codes those produce. It also pins the
    # inline-code-blanking this gate shares with `docs-links` — the behaviour
    # that leaves backticked citations to `citation-gate.py` — so the three do
    # not start fighting over the same span.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code contract
        run: python3 .github/scripts/test_doc_comment_gate.py

  docs-link-gate-contract:
    name: Docs link gate contract
    runs-on: ubuntu-latest
    # One Python script over repositories it synthesises in a temp directory: no
    # toolchain, no cargo, no network past the checkout. Seconds of work.
    timeout-minutes: 5
    # Deliberately without an `if:`, like the other gate contracts, so it runs
    # on pull requests. The gate's own `--self-test` is a very good test of
    # `slugify` and no test at all of `check()` — the listing, the resolution of
    # a relative destination, the file/directory distinction, the two exit codes.
    # Those were exercised only by this repository's own 1,239 links, a fixture
    # that changes every week and can only ever prove the gate is green.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code contract
        run: python3 .github/scripts/test_docs_link_gate.py

  observability-catalog-gate-contract:
    name: Observability catalogue gate contract
    runs-on: ubuntu-latest
    # One Python script over documents it synthesises in a temp git repository:
    # no toolchain, no cargo, no network past the checkout. Seconds of work. It
    # commits once, because the gate resolves each block's `Last extracted` ref
    # against git and a fixture that could not answer would retire that check.
    timeout-minutes: 5
    # Deliberately without an `if:`, like the other gate contracts, so it runs
    # on pull requests. This gate reads its extraction command out of the
    # document and runs it, which is what keeps the two from disagreeing and is
    # also a second surface that can rot: a marker that loses its `grep` line, a
    # path that stops being a directory, a provenance ref that names no commit.
    # The gate's own self-test reaches none of those routes.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code contract
        run: python3 .github/scripts/test_observability_catalog_gate.py

  proptest-persistence-gate-contract:
    name: Proptest persistence gate contract
    runs-on: ubuntu-latest
    # One Python script over crates it synthesises in a temp git repository: no
    # toolchain, no cargo, no network past the checkout. Seconds of work.
    timeout-minutes: 5
    # Deliberately without an `if:`, like the other gate contracts, so it runs
    # on pull requests. Three of the five codes this gate emits — `ignored`,
    # `untracked` and `flat` — are decided by the filesystem and the index
    # rather than by the source text, so the gate's own self-test cannot reach
    # them from a string literal and nothing exercised them at all.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code contract
        run: python3 .github/scripts/test_proptest_persistence_gate.py

  workflow-hardening:
    name: Workflow hardening gate
    runs-on: ubuntu-latest
    # One Python script over three YAML files, stdlib only. Under a second.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Reject an unpinned action or an unscoped workflow
        # Two rules that rot the same way if nothing holds them. Every `uses:`
        # ref must be a commit sha, because a tag or a branch is a name its
        # owner can move after the review that approved it — which is what
        # CVE-2025-30066 was, and this repository had ninety-six such refs. And
        # every workflow must state its own `permissions:`, because otherwise
        # the token's scope lives in a settings page that changes with no
        # commit and no diff.
        #
        # Neither rule is enforceable by review alone: both are one deleted
        # line away from gone, and a reviewer reading a 1700-line workflow will
        # not notice the line that is missing.
        run: .github/scripts/workflow-hardening-gate.py

  workflow-hardening-gate-contract:
    name: Workflow hardening gate contract
    runs-on: ubuntu-latest
    # Thirty-two cases over `.github/` trees it synthesises in a temp
    # directory: no toolchain, no cargo, no network past the checkout. About a
    # second.
    timeout-minutes: 5
    # Deliberately without an `if:`, like the other gate contracts, so it runs
    # on pull requests. The gate is a regex over YAML rather than a parser —
    # nothing in CPython parses YAML and the runners install nothing extra —
    # so the cases that matter are the ones where a regex is wrong. Two kinds.
    #
    # Wrong and red on a green tree: a `uses:` inside a `run: |` block, of
    # which this file has hundreds of lines.
    #
    # Wrong and green on a bad tree, which is the larger set, because `uses:`
    # is a mapping key and YAML spells a key more ways than one: in a flow
    # mapping, under a quoted key, with the value on the next line, or as a
    # block scalar. Actions accepts all four and `actionlint` passes all four.
    # A job-level `permissions:` read as a top-level one belongs to the same
    # set — it would pass a workflow scoped for one job out of seven.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Exit-code contract
        run: python3 .github/scripts/test_workflow_hardening_gate.py


  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Derived, not measured: no run of this job has ever executed a step, and
    # neither has any other job in this file since the billing block. 30
    # minutes of fuzzing per the step below, plus a `cargo install cargo-fuzz`
    # and a cold `-Zbuild-std` build of the standard library and this
    # workspace under Address Sanitizer, which took 4m10s on an M-series
    # laptop from a warm registry. Sixty is double the sum on that machine and
    # wants replacing with a real figure the first time a nightly completes.
    timeout-minutes: 60
    # Nightly and on demand, never on a pull request — the same gate the
    # `mutants` job carries, for two reasons rather than one:
    #
    # 1. Cost. Half an hour a target and six targets is three hours of runner
    #    time, and every one of those hours is spent re-deriving what the
    #    committed corpus in `fuzz/seeds/` already covers unless the run is
    #    long enough to explore past it. That is a nightly's shape, not a pull
    #    request's.
    # 2. Toolchain. `cargo-fuzz` needs a nightly rustc for
    #    `-Zsanitizer=address`, and this repository pins 1.91.1 in four places
    #    with the `rust` job asserting they agree. Putting a nightly on the
    #    critical path of every pull request would mean a pull request can go
    #    red because a nightly rustc regressed, which is not a fact about the
    #    change under review.
    #
    # `docs/10-cross-cutting/testing.md` §Continuous fuzz targets records that
    # the short per-commit budget the original specification asked for is
    # deliberately not wired, and why.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      # Not fail-fast: a finding in one parser must not hide whether the other
      # five ran clean. Each target is an independent search.
      fail-fast: false
      matrix:
        target:
          - op_envelope
          - wire_frame
          - rrule
          - ical
          - oauth_state
          - recovery_blob
    env:
      # This workflow sets `RUSTFLAGS: -D warnings` globally. `cargo-fuzz`
      # composes its own `RUSTFLAGS` (the sanitizer and `sancov` passes) on top
      # of whatever it inherits, and `-Zbuild-std` then recompiles the standard
      # library with the result. Denying warnings in code this repository does
      # not own turns an upstream lint change into a red gate here, so the
      # inherited value is cleared for this job only. Warnings in `fuzz/`'s own
      # sources are not this job's concern either way: the `rust` job lints that
      # manifest with clippy and builds its rustdoc on the pinned stable, on every
      # trigger, which is where a warning there goes red (#167).
      RUSTFLAGS: ""
      # `rust-toolchain.toml` overrides the toolchain for the whole checkout,
      # and it names 1.91.1. `RUSTUP_TOOLCHAIN` takes precedence over a
      # directory override, which is what makes the nightly installed below the
      # one `cargo fuzz` actually uses.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: nightly
          # `-Zbuild-std` compiles the standard library from source, which is
          # what makes the sanitizer see inside it.
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: fuzz
          # `fuzz` is the literal job id, which is what rust-cache uses when no
          # `shared-key` is given — so naming it preserves the existing entry
          # rather than orphaning it. It is its own family and shares with
          # nothing: a nightly toolchain and `RUSTFLAGS: ""` put it at a
          # different env hash from every other cache in this file.
          shared-key: fuzz
          # This job runs only on `schedule` and `workflow_dispatch`, so the
          # ref is the default branch in practice. The exception this guards is
          # a manual dispatch on a feature branch, which would otherwise write
          # a ~260 MiB entry nothing else can ever read.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install cargo-fuzz
        # From source rather than through an install action: `cargo-fuzz` is
        # not a tool this repository has ever seen an action resolve, and a
        # nightly job can afford the two minutes. Locked, so a resolver move in
        # a transitive dependency cannot change what a nightly ran.
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        # The committed seeds are passed as a second, read-only corpus. The
        # first directory is the one libFuzzer writes newly interesting inputs
        # into; nothing carries it between runs yet, so each nightly starts
        # from the seeds. Persisting a growing corpus across nightlies is the
        # obvious next step and is deliberately not in this commit — it needs a
        # cache key policy nobody has watched behave.
        run: |
          set -euo pipefail
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cargo fuzz run --fuzz-dir fuzz "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" "fuzz/seeds/${{ matrix.target }}" \
            -- -max_total_time=1800
      - name: Upload the input a finding left behind
        # `fuzz/artifacts/<target>/crash-<sha1>` is the reproducer, and it is
        # the only thing a red run produces that is worth anything. Without
        # this step the finding is a stack trace in a log and the input that
        # caused it is gone with the runner.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
