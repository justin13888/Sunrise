name: CI

on:
  push:
    branches: [master, v1-rewrite]
  pull_request:
    branches: [master, v1-rewrite]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo doc-test
        run: cargo test --workspace --doc

  rust-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  bun-lint:
    name: Bun lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run ci

  bun-typecheck:
    name: Bun typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  bun-test:
    name: Bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  determinism:
    name: Determinism gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject ambient RNG in core crates
        run: |
          # docs/01-architecture/shared-core.md §determinism-rules — randomness
          # comes from the injected `CoreConfig::rng`, never an ambient source.
          #
          # This backstops clippy.toml's `disallowed-methods`, which binds only
          # inside crates that depend on `rand` directly (6 of 20). The grep
          # binds everywhere, and catches spellings a path-based lint would
          # also catch but a naive regex would miss: turbofish
          # (`rand::random::<u64>()`), the rand 0.9 rename (`rand::rng()`),
          # and a bare `thread_rng()` behind a `use`.
          .github/scripts/grep-gate.sh \
            "determinism" \
            '\brand::(thread_rng|random|rng)[[:space:]]*(::<[^>]*>)?[[:space:]]*\(|(^|[^.[:alnum:]_])thread_rng[[:space:]]*\(' \
            crates/*/src crates/*/tests crates/*/benches

  log-redaction:
    name: Log redaction gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject .expose() in logging/telemetry/observability surfaces
        run: |
          # docs/10-cross-cutting/logging.md §6.3 — no Plain<T>::expose() inside
          # logging, telemetry, or observability code paths.
          #
          # Of the paths below only crates/sunrise-log/src exists today; the
          # rest are listed so the gate widens automatically as those surfaces
          # appear. The runner fails if *none* of them exist, so this cannot
          # silently degrade to a no-op the way the previous `rg`-based
          # version did.
          .github/scripts/grep-gate.sh \
            "log-redaction" \
            '\bplain[a-z_]*\.expose[[:space:]]*\(' \
            crates/sunrise-log/src \
            crates/*/src/telemetry crates/*/src/logging crates/*/src/observability
