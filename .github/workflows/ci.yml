name: CI

on:
  push:
    branches: [master, v1-rewrite]
  pull_request:
    branches: [master, v1-rewrite]
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo doc-test
        run: cargo test --workspace --doc

  msrv:
    name: MSRV pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs stable, which is deliberately *not* what this job asserts on.
      # Every `rustc` below runs inside the checkout, where rust-toolchain.toml
      # overrides the directory and rustup installs the pinned toolchain on
      # first use — the same mechanism the `rust`, `macos-app` and `ios-app`
      # jobs rely on. Asserting it here is what makes those three trustworthy.
      - uses: dtolnay/rust-toolchain@stable
      - name: rust-toolchain.toml, rust-version and rustc all agree
        # Three numbers with no mechanism forcing them together.
        # `rust-toolchain.toml` decides what everyone compiles with;
        # `rust-version` decides which lints clippy gates and what a consumer
        # reads as the floor. Drift is silent in both directions — clippy
        # linting for a compiler nobody runs, or a floor the build already left
        # behind — and it is exactly the state this repository was in before
        # ADR-0026, where four files disagreed about why 1.88 was pinned.
        # ADR-0026 requires the two literals byte-identical, so equality is the
        # whole check; there is nothing to parse loosely.
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          rust_version=$(sed -n 's/^rust-version *= *"\(.*\)"$/\1/p' Cargo.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml channel : ${channel:-<none>}"
          echo "Cargo.toml rust-version     : ${rust_version:-<none>}"
          echo "rustc in the checkout       : ${actual:-<none>}"
          if [ -z "$channel" ] || [ -z "$rust_version" ]; then
            echo "::error::msrv: could not read the pin from rust-toolchain.toml and/or Cargo.toml"
            exit 1
          fi
          if [ "$channel" != "$rust_version" ]; then
            echo "::error::msrv: rust-toolchain.toml pins ${channel} but Cargo.toml rust-version is ${rust_version}; ADR-0026 requires them identical"
            exit 1
          fi
          if [ "$actual" != "$channel" ]; then
            echo "::error::msrv: rust-toolchain.toml pins ${channel} but rustc in the checkout is ${actual}"
            exit 1
          fi

  macos-app:
    name: macOS app (xcframework + SwiftLint + XCTest)
    # `macos-26` is the arm64 Tahoe image; `macos-latest` points at the same
    # one today, but this pin is load-bearing rather than cosmetic:
    # apps/apple/project.yml sets `deploymentTarget.macOS: "26.0"`, which no
    # earlier image can build. macOS 26 ships Xcode 26.6 by default (Xcode 26.0
    # through 26.6 are all present), matching the SDK the app is developed
    # against, so nothing here is approximated — the deployment target is met
    # exactly. If `macos-latest` ever advances past 26, revisit this together
    # with `macos_target` in mise.toml and `deploymentTarget` in project.yml,
    # which must all agree.
    #
    # Cost note: macOS minutes bill at 10x Linux, and this job builds a release
    # xcframework and runs XCTest. If minutes become the constraint, the lever
    # is a path filter on `apps/apple/**` + `crates/sunrise-core-bindings/**`,
    # not deleting the job — nothing else in CI compiles a line of Swift.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Deliberately clears the workflow-level `-D warnings`. This job compiles
      # `tools/uniffi-bindgen`, a separate manifest whose third-party
      # dependency tree is not ours to keep warning-free; denying warnings
      # there turns an upstream deprecation into a red macOS build for a
      # problem no one here can fix. The workspace's own warning discipline is
      # enforced by the `rust` job's clippy step on both platforms.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # The toolchain file pins 1.91.1, which rustup installs on first use.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # aarch64-apple-darwin is the host triple on this runner, but the
      # xcframework carries three slices and the other two are not installed by
      # default — `mise run apple-xcframework` fails without them.
      #
      # This is a step rather than the action's `targets:` input, and the
      # difference is the whole bug it fixes: `targets:` is passed to
      # `rustup toolchain install stable`, so the slices land on *stable*, while
      # rust-toolchain.toml overrides the working directory to 1.91.1 — which
      # then has no iOS std and fails with `E0463: can't find crate for core`.
      # Run bare and in the repo, `rustup target add` obeys that same override,
      # so the slices land on the toolchain that actually does the build.
      - name: Add the iOS slices to the pinned toolchain
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      # None of the three are in the runner image.
      - name: Install mise, XcodeGen and SwiftLint
        run: brew install --quiet mise xcodegen swiftlint
      # mise refuses to run tasks from a config it has not been told to trust,
      # and a fresh checkout is never trusted. Explicit rather than implicit:
      # the runner has no interactive prompt to answer.
      - name: Trust mise config
        run: mise trust --yes
      - name: Toolchain versions
        # Printed, not asserted: if the default Xcode ever regresses below 26,
        # the build fails on the deployment target with a clearer message than
        # any assertion here would produce. This is for reading the log after.
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i macos
          swiftlint version
          xcodegen --version
      # One task, deliberately. `mise run macos-app` builds the xcframework,
      # runs `xcodegen generate` (the .xcodeproj is gitignored and this is the
      # only supported way to get one), runs `swiftlint lint --strict`, and
      # runs `xcodebuild test`. Re-expressing those four steps as YAML would
      # create a second definition of the macOS build that drifts from the one
      # developers actually run.
      - name: mise run macos-app
        run: mise run macos-app

  ios-app:
    name: iOS app (xcframework + SwiftLint + XCTest + XCUITest)
    # Same image and same pin as `macos-app`, for the same reason:
    # apps/apple/project.yml sets `deploymentTarget.iOS: "26.0"`, and the iOS
    # 26 SDK and simulators ship with the Xcode on `macos-26`.
    #
    # A separate job rather than a step on `macos-app`. The two share only the
    # xcframework, they fail for different reasons, and a red iOS test run
    # should not hide a green macOS one — nor cost the macOS build its result
    # when the simulator is the thing that broke.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # As in `macos-app`: this job builds `tools/uniffi-bindgen`, whose
      # third-party tree is not ours to keep warning-free.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # As in `macos-app`, and for the reason spelled out there: a step rather
      # than the action's `targets:` input, so the slices land on the pinned
      # 1.91.1 that rust-toolchain.toml selects rather than on stable.
      - name: Add the iOS slices to the pinned toolchain
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Install mise, XcodeGen and SwiftLint
        run: brew install --quiet mise xcodegen swiftlint
      # mise refuses to run tasks from a config it has not been told to trust,
      # and a fresh checkout is never trusted. Explicit rather than implicit:
      # the runner has no interactive prompt to answer.
      - name: Trust mise config
        run: mise trust --yes
      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          xcrun simctl list devices available | grep -i iphone
      # One task, as with macOS. `mise run ios-app` builds the three-slice
      # xcframework, runs `xcodegen generate`, `swiftlint --strict`, and
      # `xcodebuild test` against the iPhone 17 Pro simulator — which runs both
      # the shared `SunriseTests` bundle and, unlike the macOS job, the UI
      # tests: a simulator runner needs no change to the machine's security
      # posture, so there is nothing to opt into.
      - name: mise run ios-app
        run: mise run ios-app

  rust-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  bun-lint:
    name: Bun lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run ci

  bun-typecheck:
    name: Bun typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  bun-test:
    name: Bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  bench-regression:
    name: Bench regression (informational)
    runs-on: ubuntu-latest
    # Nightly and on demand only, not on every push. It costs ~9 minutes and,
    # per the note below, produces a report rather than a verdict — paying that
    # on every commit for something nobody can act on is waste. testing.md
    # frames the auto-update as a nightly job anyway.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # NOT a merge gate, deliberately. docs/10-cross-cutting/testing.md specifies
    # a required check that blocks on a >5% regression, and that figure assumes
    # stable hardware. Measured on this runner, the same binary against its own
    # recorded baseline reports swings of +270% (ws_handshake) and -39%
    # (submit_create_task) purely from scheduling noise and a short measurement
    # window. A gate that red-lights on noise gets ignored within a week, and
    # then it protects nothing — the determinism and log-redaction gates in this
    # very file spent months green and unenforceable.
    #
    # So: run it, print the comparison, annotate the outliers, and let a human
    # read it. Promoting this to a blocking check needs dedicated hardware and
    # full-length measurement runs, at which point drop `continue-on-error` and
    # tighten the tolerance to the spec's 5%.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench
        # `--benches` alone still includes the lib's unittest harness, which
        # rejects criterion flags; the crate opts its lib and bin out via
        # `bench = false`.
        run: cargo bench -p sunrise-bench --benches -- --warm-up-time 2 --measurement-time 5
      - name: Compare against bench/baseline.json
        run: cargo run -q -p sunrise-bench --bin baseline -- --check target/criterion bench/baseline.json 60

  determinism:
    name: Determinism gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject ambient RNG in core crates
        run: |
          # docs/01-architecture/shared-core.md §determinism-rules — randomness
          # comes from the injected `CoreConfig::rng`, never an ambient source.
          #
          # This backstops clippy.toml's `disallowed-methods`, which binds only
          # inside crates that depend on `rand` directly (6 of 20). The grep
          # binds everywhere, and catches spellings a path-based lint would
          # also catch but a naive regex would miss: turbofish
          # (`rand::random::<u64>()`), the rand 0.9 rename (`rand::rng()`),
          # and a bare `thread_rng()` behind a `use`.
          .github/scripts/grep-gate.sh \
            "determinism" \
            '\brand::(thread_rng|random|rng)[[:space:]]*(::<[^>]*>)?[[:space:]]*\(|(^|[^.[:alnum:]_])thread_rng[[:space:]]*\(' \
            crates/*/src crates/*/tests crates/*/benches

  log-redaction:
    name: Log redaction gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject .expose() in logging/telemetry/observability surfaces
        run: |
          # docs/10-cross-cutting/logging.md §6.3 — no Plain<T>::expose() inside
          # code that emits log records.
          #
          # The list below is every crate that emits a log record today
          # (`sunrise-log`, `-server`, `-cli`, `-storage`, `-core`) plus the
          # client-seam crates that are next in line to (`-sync`,
          # `-client-core`, `-core-bindings`, `-relay-client`, `-http-sig`).
          # It used to be
          # `crates/sunrise-log/src` plus three glob patterns that matched
          # nothing and a `packages/sunrise-log/src` that never existed — a
          # gate over one orphan crate that no other code could reach. It also
          # named `crates/sunrise-tui/src` until ADR-0019 deleted that crate:
          # `grep-gate.sh` drops paths that do not exist, so a stale entry
          # costs coverage without ever costing a red build, which is exactly
          # how a gate rots unnoticed.
          #
          # **When a crate starts logging, add it here.** Listing one before it
          # logs is free — grep over a tree with no `.expose()` is a no-op —
          # and it is the only way the gate is already in place on the commit
          # that introduces the first `tracing::info!`. The glob patterns are
          # kept so a future `telemetry/` or `observability/` module in any
          # crate is covered the moment it appears; `grep-gate.sh` skips paths
          # that do not exist and fails if *none* do, so this cannot silently
          # degrade to a no-op.
          .github/scripts/grep-gate.sh \
            "log-redaction" \
            '\bplain[a-z_]*\.expose[[:space:]]*\(' \
            crates/sunrise-log/src \
            crates/sunrise-server/src \
            crates/sunrise-cli/src \
            crates/sunrise-storage/src \
            crates/sunrise-core/src \
            crates/sunrise-sync/src \
            crates/sunrise-client-core/src \
            crates/sunrise-core-bindings/src \
            crates/sunrise-http-sig/src \
            crates/sunrise-relay-client/src \
            crates/*/src/telemetry crates/*/src/logging crates/*/src/observability

  kynos-waiver:
    name: Kynos waiver gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `cargo metadata` resolves features without compiling anything, so this
      # job needs a cargo on PATH and takes seconds.
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject any escape hatch that would make the description opaque
        # ADR-0021 adopts kynos on the premise that a handler which cannot be
        # described does not compile. Every documented way around that sits
        # behind one feature, and each item behind it stamps an operation with
        # an `OpaqueReason`. Asserting the feature is off is therefore stronger
        # than inspecting the reasons at runtime -- and it is the strict gate
        # the ADR called unholdable, which ADR-0023 made holdable by removing
        # the one legitimate upgrade route.
        run: .github/scripts/kynos-waiver-gate.py

  openapi-current:
    name: OpenAPI description gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Reject a description that has drifted from its handlers
        # `schemas/openapi.v1.json` is an *input*: `spargen` generates the relay
        # client from it. A stale one yields a client that disagrees with the
        # server and compiles perfectly while doing so, so regenerating it is
        # not optional and cannot be left to a reviewer noticing.
        run: |
          cargo run -q -p sunrise-server --bin openapi -- schemas/openapi.v1.json
          git diff --exit-code -- schemas/openapi.v1.json \
            || { echo "::error::openapi: the description is stale; run \`mise run openapi\` and commit the result."; exit 1; }

  orphan-crates:
    name: Orphan crate gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `cargo metadata --no-deps` reads the workspace manifests and nothing
      # else — no resolution, no registry, no compilation — so this job needs a
      # cargo on PATH and takes seconds. Nothing to cache.
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject crates unreachable from every shipping binary
        # The recurring v1 defect was a library seam that is correct, tested
        # and linked by nobody: `cargo test --workspace` green, and the feature
        # nonexistent for a user. That shape is plainly visible in the
        # dependency graph, so the graph is where it gets caught. The script
        # carries its own exemption and quarantine lists, each entry with a
        # reason, and fails when one of them goes stale.
        run: .github/scripts/orphan-crate-gate.py

