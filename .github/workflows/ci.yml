name: CI

on:
  push:
    branches: [master, v1-rewrite]
  pull_request:
    branches: [master, v1-rewrite]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo doc-test
        run: cargo test --workspace --doc

  rust-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  bun-lint:
    name: Bun lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run ci

  bun-typecheck:
    name: Bun typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  bun-test:
    name: Bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  determinism:
    name: Determinism gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject ambient RNG in core crates
        run: |
          set -euo pipefail
          # docs/01-architecture/shared-core.md §determinism-rules — randomness
          # comes from the injected `CoreConfig::rng`, never from an ambient
          # thread-local source.
          #
          # This lives here rather than in clippy.toml's `disallowed-methods`
          # because clippy resolves those paths only inside crates that depend
          # on `rand` directly. Everywhere else the entry degraded to a clippy
          # *config* warning, which `-D warnings` does not catch — so the rule
          # was unenforced across most of the workspace. A grep binds in every
          # crate regardless of its dependency graph.
          if rg -nP '\brand::(thread_rng|random)\s*\(|\bthread_rng\s*\(\)' \
              crates/*/src crates/*/tests crates/*/benches 2>/dev/null; then
            echo "::error::Ambient RNG used; take randomness from CoreConfig::rng."
            exit 1
          fi
          echo "OK: no ambient RNG in core crates."

  log-redaction:
    name: Log redaction gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject .expose() in logging/telemetry/observability surfaces
        run: |
          set -euo pipefail
          # spec/10-cross-cutting/logging.md §6.3 — no Plain<T>::expose() inside
          # logging, telemetry, or observability code paths.
          if rg -nP '\bplain[a-z_]*\.expose\(' \
              crates/sunrise-log/src \
              crates/*/src/telemetry \
              crates/*/src/logging \
              crates/*/src/observability \
              packages/sunrise-log/src 2>/dev/null; then
            echo "::error::Plain<T>::expose() called inside redaction-protected surface."
            exit 1
          fi
          echo "OK: no .expose() calls in protected surfaces."
