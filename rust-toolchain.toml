[toolchain]
# Pinned for reproducible builds. Bumped from 1.84.0 to 1.87.0 because
# transitive deps (block-buffer 0.12+) require edition2024 (stabilized in
# 1.85). Any further bump requires an ADR and CI matrix update.
channel = "1.87.0"
components = ["rustfmt", "clippy", "rust-src"]
profile = "default"
