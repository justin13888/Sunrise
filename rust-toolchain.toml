[toolchain]
# Floats on the latest stable release (ADR-0077, which amends ADR-0026's exact
# pin). Rust 1.x is forward-compatible, so a new release costs at most a few new
# lints, and those are fixed in-repo when they land rather than held off by a
# pin nobody moves. Holding the pin back blocks new syntax, new std APIs, new
# lints and compiler-performance work for no compatibility gain.
#
# The floor is `rust-version` in the root `Cargo.toml` (1.91.1, ADR-0026's
# reasons still hold); it decides which MSRV-gated clippy lints apply and is
# not raised by a new stable. The `Dockerfile` builds on `rust:1-…`, the same
# floating stable. The first step of the Rust gate
# (`.github/actions/rust-checks/action.yml`) asserts all three: `channel` here
# is `stable`, the Dockerfile's `ARG RUST_VERSION` is `1`, and the `rustc` a
# checkout resolves to is not below `rust-version`.
channel = "stable"
components = ["rustfmt", "clippy", "rust-src"]
profile = "default"
