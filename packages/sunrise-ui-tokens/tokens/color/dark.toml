# Dark-theme colour. Symmetrical with light.toml — same two tables, same keys,
# brightness inverted. See light.toml for what each table is for.
#
# The stream tints are the light set lifted two steps: a 600-weight tint that
# reads as a colour on #fbfbfa reads as a smudge on #0f0f10.

[surface]
bg = "#0f0f10"
fg = "#fafafa"
muted = "#9ca3af"
accent = "#60a5fa"
accent_text = "#0f0f10"
border = "#27272a"
danger = "#f87171"
warning = "#fbbf24"
success = "#34d399"
info = "#22d3ee"

[stream]
slate = "#94a3b8"
rose = "#fb7185"
amber = "#fbbf24"
emerald = "#34d399"
sky = "#38bdf8"
indigo = "#818cf8"
violet = "#a78bfa"
pink = "#f472b6"
