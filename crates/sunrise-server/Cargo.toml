[package]
name = "sunrise-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Sunrise sync relay server (REST + WebSocket, OIDC, self-host SQLite)"

[lib]
path = "src/lib.rs"
# Upstream workaround, not a policy change. kynos 0.1.0's route macros build
# the generated `relative_uri` doc from one `#[doc = "..."]` string literal
# (kynos-macros-0.1.0/src/route/uri.rs:47) whose first line sits at column zero
# and whose second paragraph is indented eight spaces. Rustdoc unindents a doc
# fragment by its *minimum* line indent, so the column-zero first line pins
# that minimum at zero, the eight-space paragraph survives as a four-plus-space
# indent, and Markdown reads it as an indented CODE block -- which rustdoc then
# compiles as Rust. Every handler carrying a `#[kynos::get]`/`post`/`delete`
# attribute therefore yields one doc test made of English prose: 18 of them
# here, identical on 1.88.0, 1.91.1 and stable.
#
# The fix belongs upstream and is one line -- fence that paragraph, or indent
# the literal's first line to match it so the unindent pass strips both. Until
# kynos ships it there is no cure on this side: the failing item is generated,
# not written here, and rustdoc scrapes doc tests out of `#[doc(hidden)]`
# items, private items and private modules alike (all three verified), so no
# annotation on our handlers can suppress it. The route attributes take only
# `operation_id`, `tag` and `catch_panics`, so the macro offers no opt-out
# either, and no kynos feature changes what it emits.
#
# Nothing is lost by opting out: all 18 are macro-generated and this crate has
# no doc test of its own. Note that this key covers `cargo test` and `cargo
# test -p sunrise-server` but NOT `cargo test --doc`, which selects the doc
# target no matter what the manifest says -- CI's doc-test step carries a
# matching `--exclude sunrise-server` for exactly that reason. Retire both
# halves together when the macro is fixed.
doctest = false

[[bin]]
name = "sunrise-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
ciborium = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
# `client-legacy` is the pooled hyper 1.x client the JWKS fetcher drives.
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
jiff = { workspace = true }
kynos = { workspace = true }
jsonwebtoken = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Already in the lock via `uniffi_macros`, so wiring it in here adds no new
# dependency to the tree — see docs/01-architecture/dependencies.md.
toml = { workspace = true }
tracing = { workspace = true }
sunrise-cbor = { workspace = true }
sunrise-error = { workspace = true }
sunrise-http-sig = { workspace = true }
sunrise-id = { workspace = true }
sunrise-log = { workspace = true }
sunrise-onboarding = { workspace = true }
sunrise-storage = { workspace = true }
sunrise-wire-protocol = { workspace = true }

[dev-dependencies]
ciborium = { workspace = true }
futures-util = { workspace = true }
# Collects a `kynos::http::Body` in tests that drive `Service::call` directly.
#
# kynos ships a richer `TestClient` behind its `test-util` feature and this is
# deliberately not that: `test-util` pulls `jsonschema`, which needs a newer
# `regex-automata` than criterion pins and brings `MIT-0` into a licence
# allowlist `deny.toml` curates by hand. `Service::call` is documented as the
# embedding seam, so the thirty lines below cost less than the policy change.
http-body-util = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
