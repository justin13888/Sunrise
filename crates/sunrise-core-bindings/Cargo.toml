[package]
name = "sunrise-core-bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "UniFFI seam over sunrise-core; consumed by the macOS app (Swift) and, later, Android (Kotlin)."

[lib]
# `staticlib` is what the xcframework links; `cdylib` is what
# `uniffi-bindgen generate --library` reads the metadata out of; `rlib` is what
# this crate's own tests link. All three are load-bearing.
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
# `default-features = false` because uniffi 0.32's sole default feature is
# `cargo-metadata`, and this crate has no use for it. That feature exists so the
# UDL/build-script path can resolve a crate name out of `cargo metadata`; the
# bindings here are generated in `--library` mode from the compiled dylib, with
# no `.udl` file and no `build.rs`, so nothing would ever call it. Turning it
# off keeps `cargo_metadata`, `cargo-platform` and their tree out of the seam
# crate's build.
#
# It was also, until ADR-0026, an MSRV workaround — `cargo-platform` 0.3.3
# requires rustc 1.91 and the workspace pinned 1.88. That is no longer a reason;
# the one above always was, and it stands on its own.
uniffi = { version = "0.32.0", default-features = false, features = ["tokio"] }
base64 = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }
sunrise-auth = { workspace = true }
sunrise-client-core = { workspace = true }
sunrise-core = { workspace = true }
sunrise-crypto = { workspace = true }
sunrise-domain = { workspace = true }
sunrise-id = { workspace = true }
sunrise-integrations = { workspace = true }
sunrise-pairing = { workspace = true }
sunrise-sync = { workspace = true, features = ["sse"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
