[package]
name = "sunrise-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Criterion benchmarks + deterministic synthetic-vault generator + baseline-populate tooling."

[lints]
workspace = true

# `cargo bench -- <criterion flags>` passes those flags to *every* bench target,
# including the lib's own unittest harness, which rejects them ("Unrecognized
# option: 'warm-up-time'") and fails the run. The lib has no benchmarks, so opt
# it out. Same for the baseline bin, which is a CLI, not a benchmark.
[lib]
bench = false

[[bin]]
name = "baseline"
bench = false

[dependencies]
sunrise-core = { workspace = true }
sunrise-domain = { workspace = true }
sunrise-storage = { workspace = true }
sunrise-crypto = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
rand_core = { workspace = true }
rand_chacha = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
futures-util = { workspace = true }
ciborium = { workspace = true }
sunrise-server = { workspace = true }
sunrise-sync = { workspace = true, features = ["sse"] }
sunrise-wire-protocol = { workspace = true }
sunrise-cbor = { workspace = true }

[[bench]]
name = "submit"
harness = false

[[bench]]
name = "query_today"
harness = false

[[bench]]
name = "fts"
harness = false

[[bench]]
name = "sync_session"
harness = false

[[bench]]
name = "vault_open"
harness = false
