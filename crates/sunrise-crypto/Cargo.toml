[package]
name = "sunrise-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Frozen v1 crypto suite: keys, OpEnvelope, share grants, recovery, pairing primitives"

[lints]
workspace = true

[features]
# Seal and open recovery blobs under a cheap Argon2id set (8 KiB, t=1, p=1)
# instead of the spec's 64 MiB, t=3, p=1, for the tests of other crates that
# create or recover an account without being about the KDF. The set is
# compiled only where `debug_assertions` is on too, so a release build has the
# spec's parameters whatever features reach it; `tests/test_cheap_kdf.rs`
# fails the test suite if a shipped package's normal dependency graph enables
# this. This crate's own unit tests keep the spec's set with it on
# (`src/recovery.rs`).
test-cheap-kdf = []

[dependencies]
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hpke = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
argon2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
rand_core = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
thiserror = { workspace = true }
sunrise-cbor = { workspace = true }
sunrise-error = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
proptest = { workspace = true }
rand_chacha = { workspace = true }
sunrise-crypto-test-vectors = { workspace = true }
sunrise-test-seed = { workspace = true }
