[package]
name = "sunrise-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Sunrise core API: single-writer vault, command/query, sync state"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
ciborium = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
thiserror = { workspace = true }
# `rt`, not `rt-multi-thread`: `Core` spawns onto whatever runtime its caller
# runs, and `rt-multi-thread` pulls `mio`, which refuses the wasm target
# `crates/sunrise-core-wasm` builds this crate for (ADR-0055).
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tracing = { workspace = true }
sunrise-cbor = { workspace = true }
sunrise-crypto = { workspace = true }
sunrise-domain = { workspace = true }
sunrise-error = { workspace = true }
sunrise-id = { workspace = true }
sunrise-pairing = { workspace = true }
sunrise-storage = { workspace = true }
sunrise-sync = { workspace = true }
sunrise-wire-protocol = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
sunrise-crypto-test-vectors = { workspace = true }
# `test_util::events_emitted_by`, so an engine test that asserts an `ev` fired
# shares the one tracing interest-cache pin instead of carrying its own.
sunrise-log = { workspace = true }
sunrise-test-seed = { workspace = true }
# `test-util` gives paused-clock tests (`start_paused`, `time::advance`) so the
# routine timer can be driven deterministically instead of slept through.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
# `sync.credential.marked_at_connect` is this crate's only user-visible log
# surface with a branch in its trigger, and both branches are asserted against
# a real subscriber rather than argued. Capture pattern per
# `crates/sunrise-log/tests/redaction.rs`.
tracing-subscriber = { workspace = true }
