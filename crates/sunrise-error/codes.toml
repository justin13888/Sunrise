# Sunrise error code registry — single source of truth.
#
# Per docs/10-cross-cutting/error-handling.md §registry, this manifest is
# authoritative; the Rust enum at crates/sunrise-error/src/codes.rs and the
# TypeScript enum at packages/sunrise-error-ts/src/codes.ts are GENERATED
# mirrors of this file. Hand-editing the generated files is a CI failure.
#
# Until the codegen build script lands (target: Phase 17), the Rust enum is
# kept in sync manually; the keep-in-sync test in tests/ catches drift.
#
# Rules:
#  - Codes are stable across versions.
#  - Codes can be ADDED (at minor-version boundaries); never repurposed,
#    never renamed.
#  - Numeric ids are monotonically increasing and never re-used.

[[code]]
id = 1
name = "INTERNAL_UNKNOWN_CODE"
kind = "internal"
retryable = false
since = "v1"
docs = "Reserved for older clients receiving a code they don't recognize."

