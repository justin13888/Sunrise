[package]
name = "sunrise-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "SQLite + SQLCipher storage layer (op log, materialized state, blob store, FTS5)"

[lints]
workspace = true

[dependencies]
# `backup` for `Db::open_memory_copy`: it adds rusqlite's wrapper over
# SQLite's backup API, which the bundled SQLCipher already compiles in.
rusqlite = { workspace = true, features = ["backup"] }
thiserror = { workspace = true }
tracing = { workspace = true }
sunrise-cbor = { workspace = true }
sunrise-crypto = { workspace = true }
sunrise-error = { workspace = true }
sunrise-id = { workspace = true }
sunrise-private-file = { workspace = true }
# Also what carries the Windows build's vendored OpenSSL feature of `rusqlite`
# to this crate: see that crate's manifest.
sunrise-sqlcipher = { workspace = true }

[dev-dependencies]
tempfile = "3"
