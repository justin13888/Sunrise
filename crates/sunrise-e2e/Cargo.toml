[package]
name = "sunrise-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Sunrise end-to-end gating: cross-crate scenarios + chaos harness."

[lints]
workspace = true

[dependencies]
sunrise-core = { workspace = true }
sunrise-pairing = { workspace = true }
sunrise-domain = { workspace = true }
sunrise-server = { workspace = true }
sunrise-crypto = { workspace = true }
sunrise-sync = { workspace = true, features = ["sse"] }
sunrise-id = { workspace = true }
sunrise-cbor = { workspace = true }
sunrise-wire-protocol = { workspace = true }
ciborium = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
async-trait = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
# The `SUNRISE_FUZZ_SEED` reader. In `[dependencies]` rather than
# `[dev-dependencies]` because `src/chaos/toxic.rs` is the consumer, and the
# whole point of #119 is that this harness and the property tests read one
# parser rather than two.
sunrise-test-seed = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
# The device-bound scenario registers a real `D_S_pub` and reads the scheme's
# own clock tolerance; both belong to the crate that defines `header_sig_v2`
# rather than being restated here.
sunrise-http-sig = { workspace = true }
# The recovery round trip drives the generated REST client and the account
# shapes it sends, rather than hand-rolling requests: the point of that test is
# that the bytes a real client produces survive a real relay.
sunrise-relay-client = { workspace = true }
sunrise-onboarding = { workspace = true }
# The Apple clients reach the relay through this crate and nothing else, so it
# is where "a vault created by the app now has a recovery blob" can be asserted
# against a real server rather than against a mock of one (#181).
sunrise-core-bindings = { workspace = true }
proptest = { workspace = true }
tempfile = "3"
