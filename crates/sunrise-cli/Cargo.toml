[package]
name = "sunrise-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Sunrise command-line client — headless capture, triage, focus, review, export, and sync"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sunrise"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
jiff = { workspace = true }
# The runtime `src/i18n.rs` gives the generated string binding: CLDR plural
# categories and locale digits for `#` and `{n, number}` (ADR-0054).
icu_decimal = { workspace = true }
icu_locale_core = { workspace = true }
icu_plurals = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = { workspace = true }
# `sunrise recover` has one error arm per thing the user can do about it, and a
# recovery is run by someone who has already lost every device — "it failed" is
# not an acceptable message there.
thiserror = { workspace = true }
sunrise-auth = { workspace = true }
sunrise-cbor = { workspace = true }
sunrise-core = { workspace = true }
sunrise-pairing = { workspace = true }
# Every secret this binary writes: the vault key, the parked pairing secret,
# the exported grant and the sealed undo history.
sunrise-private-file = { workspace = true }
sunrise-crypto = { workspace = true }
sunrise-domain = { workspace = true }
sunrise-id = { workspace = true }
sunrise-integrations = { workspace = true }
sunrise-log = { workspace = true }
sunrise-client-core = { workspace = true, features = ["relay"] }
sunrise-relay-client = { workspace = true }
sunrise-sync = { workspace = true, features = ["sse"] }
# The `--json` output (`src/json.rs`).
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
# Live-sync integration test (tests/live_sync.rs) boots the real relay in-proc.
sunrise-server = { workspace = true }
# `tests/rebuild_command.rs` damages a vault the binary wrote, through the
# keyed connection only the storage crate opens.
sunrise-storage = { workspace = true }
tempfile = "3"
