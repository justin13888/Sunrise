[package]
name = "sunrise-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Sunrise terminal UI (Ratatui)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sunrise-tui"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Inline image previews (Kitty/iTerm2/Sixel with halfblocks fallback).
# Default-on for the shipped binary; the crate must also build without it.
default = ["images"]
images = ["dep:ratatui-image", "dep:image"]

[dependencies]
jiff = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
ratatui-image = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
sunrise-core = { workspace = true }
sunrise-crypto = { workspace = true }
sunrise-domain = { workspace = true }
sunrise-id = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
