# Git hooks via lefthook. All command logic lives in mise.toml;
# these hooks only call `mise run <task>`. Run `mise tasks` to see them.
pre-commit:
  parallel: true
  commands:
    biome-check:
      run: mise run fix
    bun-typecheck:
      run: mise run typecheck
    rust-fmt:
      glob: "*.rs"
      run: mise run rust-fmt-check
    rust-clippy:
      glob: "*.rs"
      run: mise run rust-clippy

pre-push:
  parallel: true
  commands:
    biome-ci:
      run: mise run ci
    bun-typecheck:
      run: mise run typecheck
    bun-test:
      run: mise run test
    rust-test:
      run: mise run rust-test
