pre-commit:
  parallel: true
  commands:
    check:
      run: bun run check:fix
      stage_fixed: true
    typecheck:
      # Codegen first: typecheck needs the generated GraphQL types
      run: bun run codegen && bun run typecheck

pre-push:
  parallel: true
  commands:
    biome-ci:
      run: bun run ci
    typecheck:
      run: bun run codegen && bun run typecheck
    test:
      run: bun run test:run
