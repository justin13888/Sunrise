# Git hooks via lefthook. All command logic lives in mise.toml;
# these hooks only call `mise run <task>`. Run `mise tasks` to see them.
pre-commit:
  parallel: true
  commands:
    # The Biome fix and the typecheck run only when the commit stages a file
    # each tool reads, so a commit staging only Rust, Swift or Markdown skips
    # them; pre-push and pull-request CI still run both on every change. Biome's glob
    # follows what `biome.jsonc` handles (its defaults, which include GraphQL
    # and leave HTML off): a language enabled there joins it in the same
    # change.
    biome-check:
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc,css,graphql,gql}"
      run: mise run fix
    # No glob: lefthook's staged list leaves deletions out, and deleting a
    # module another one imports must still run `tsc`. The task decides.
    bun-typecheck:
      run: mise run typecheck-staged
    rust-fmt:
      glob: "*.rs"
      run: mise run rust-fmt-check
    rust-clippy:
      glob: "*.rs"
      run: mise run rust-clippy-workspace
    # No glob: a crate's manifest, `Cargo.lock` or the toolchain pin reach
    # fuzz/ too, and the task's script decides from the staged files.
    rust-clippy-fuzz:
      run: mise run rust-clippy-fuzz-staged

# As light as pre-commit, over the whole tree rather than the staged files:
# format, lint and typecheck, and no test suite (#1117). A push that took
# 15-22 minutes timed out over SSH. The test suites run in CI on every push to
# `master`, nightly and on dispatch; `mise run pre-push` runs them locally as
# an explicit opt-in, and `mise run rust-test-changed` / `mise run
# test-changed` run only what a push can affect.
pre-push:
  parallel: true
  commands:
    biome-ci:
      run: mise run ci
    bun-typecheck:
      run: mise run typecheck
    rust-fmt:
      run: mise run rust-fmt-check
    rust-clippy:
      run: mise run rust-clippy-workspace
