[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["legacy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "AGPL-3.0-only"
authors = ["Sunrise contributors"]
repository = "https://github.com/justin13888/Sunrise"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# Defensive defaults for a security-critical core.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow ergonomic patterns we use.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
# Hard denies aligned with docs/01-architecture/shared-core.md determinism rules.
disallowed_methods = "deny"
disallowed_types = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
# --- crypto suite (frozen for v1; ADR-0004) ---
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core", "zeroize"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "rand_core", "stream"] }
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
blake3 = { version = "1.5", default-features = false, features = ["std", "traits-preview"] }
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc", "password-hash"] }
subtle = { version = "2.5", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }

# --- OIDC / JWT ---
# `jsonwebtoken` 9.x with `use_pem` off. Rationale (see
# `crates/sunrise-server/src/auth/oidc.rs`): MIT, and the only backend it
# links is `ring`, which rustls already pulls into this workspace — so the
# whole JWT/JWKS surface costs exactly one new crate in the lock file.
# 10.x/11.x dropped ring for a choice of `aws-lc-rs` (C, cmake+bindgen build)
# or `rust_crypto` (drags in `rsa` 0.9, which carries the unpatched
# RUSTSEC-2023-0071 Marvin advisory and would red `cargo deny check`).
# Dropping `use_pem` sheds `pem` + `simple_asn1`: JWKS keys arrive as
# base64url `n`/`e` components, never PEM.
jsonwebtoken = { version = "9.3", default-features = false }
oauth2 = { version = "5.0", default-features = false }
# HTTPS for the JWKS/discovery fetch. `ring` + `webpki-tokio` reuse the rustls
# stack and Mozilla root bundle already in the tree; `aws-lc-rs` (the default)
# would add a C toolchain dependency for no gain here.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
http-body-util = { version = "0.1", default-features = false }
# The `http` types `oauth2` speaks and `hyper` already uses; no new crate.
http = { version = "1.1", default-features = false }

# --- TLS / transport ---
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# --- storage ---
rusqlite = { version = "0.31", default-features = false, features = ["bundled-sqlcipher", "blob", "trace"] }

# --- async runtime / web ---
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
# `original-uri` keeps the pre-nesting request target available to handlers.
# `Router::nest` rewrites `Uri` to the path *inside* the nest, and the device
# signature covers the target the client actually sent.
# The REST surface's framework and its OpenAPI 3.2 document (ADR-0021).
# `openapi32` is what makes an event stream describable at all -- 3.1 has no
# `itemSchema`, so `response::stream` is a 3.2-only subtree, and ADR-0023's sync
# transport needs it.
kynos = { version = "0.1", default-features = false, features = ["openapi32", "macros", "server", "http1", "http2", "json", "trace"] }
hyper = { version = "1.5", default-features = false, features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

# --- serialization ---
ciborium = { version = "0.2", default-features = false }
ciborium-io = { version = "0.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# RFC 8785 JSON Canonicalization. ADR-0022 signs the canonical form of the
# request *value*, so both the relay and the generated client need one
# implementation of it and must agree byte for byte.
serde_jcs = { version = "0.2", default-features = false }
serde_bytes = { version = "0.11", default-features = false, features = ["alloc"] }

# --- compression / encoding ---
zstd = { version = "0.13", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
data-encoding = { version = "2.6", default-features = false, features = ["alloc"] }
jsonschema = { version = "0.18", default-features = false }

# --- logging / tracing ---
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-core = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json", "registry"] }

# --- utility ---
thiserror = { version = "1.0", default-features = false }
# Server config parsing. Already in the lock as a `uniffi_macros` dependency,
# so naming it here adds no crate to the tree that was not already built.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
anyhow = { version = "1.0", default-features = false, features = ["std"] }
once_cell = { version = "1.20", default-features = false, features = ["std"] }
parking_lot = { version = "0.12", default-features = false }
# OS advisory file locking (flock / LockFileEx). Chosen over fs2 (unmaintained
# since 2018) and fd-lock (guard borrows the lock, forcing a self-referential
# struct). Wraps rustix + windows-sys, both already in the lock file, so this
# adds no new transitive crates and keeps `forbid(unsafe_code)` intact.
# Supersedable by std::fs::File::try_lock once MSRV reaches 1.89 — fs4's API is
# a deliberate 1:1 mirror, so that migration is a find-and-replace.
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
arc-swap = { version = "1.7", default-features = false }
bytes = { version = "1.8", default-features = false, features = ["std"] }
smallvec = { version = "1.13", default-features = false, features = ["const_generics", "union"] }
async-trait = { version = "0.1", default-features = false }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
pin-project-lite = { version = "0.2", default-features = false }
url = { version = "2.5", default-features = false }
# `tzdb-bundle-always` embeds a fixed tzdb in the binary so every device
# resolves IANA zones identically (deterministic routine expansion), independent
# of the host OS tzdb. `default-features = false` also disables `tzdb-zoneinfo`,
# so without an explicit bundle no named zone would resolve at all.
jiff = { version = "0.2", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }

# --- random ---
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "getrandom"] }
rand_core = { version = "0.6", default-features = false, features = ["std"] }
rand_chacha = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.2", default-features = false, features = ["std"] }

# --- testing ---
proptest = { version = "1.5", default-features = false, features = ["std"] }
proptest-derive = "0.5"
insta = { version = "1.40", default-features = false, features = ["yaml"] }
# `cargo_bench_support` keeps the Criterion harness (raw sample.json output +
# CLI arg parsing) while dropping the plotters/gnuplot report backends we don't
# ship in CI. Benches live in `crates/sunrise-bench` (harness = false).
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# --- internal workspace crates ---
sunrise-log = { path = "crates/sunrise-log", version = "0.1.0" }
sunrise-id = { path = "crates/sunrise-id", version = "0.1.0" }
sunrise-error = { path = "crates/sunrise-error", version = "0.1.0" }
sunrise-http-sig = { path = "crates/sunrise-http-sig", version = "0.1.0" }
sunrise-auth = { path = "crates/sunrise-auth", version = "0.1.0" }
sunrise-cbor = { path = "crates/sunrise-cbor", version = "0.1.0" }
sunrise-crypto = { path = "crates/sunrise-crypto", version = "0.1.0" }
sunrise-crypto-test-vectors = { path = "crates/sunrise-crypto-test-vectors", version = "0.1.0" }
sunrise-domain = { path = "crates/sunrise-domain", version = "0.1.0" }
sunrise-storage = { path = "crates/sunrise-storage", version = "0.1.0" }
sunrise-wire-protocol = { path = "crates/sunrise-wire-protocol", version = "0.1.0" }
sunrise-sync = { path = "crates/sunrise-sync", version = "0.1.0" }
sunrise-pairing = { path = "crates/sunrise-pairing", version = "0.1.0" }
sunrise-onboarding = { path = "crates/sunrise-onboarding", version = "0.1.0" }
sunrise-core = { path = "crates/sunrise-core", version = "0.1.0" }
sunrise-client-core = { path = "crates/sunrise-client-core", version = "0.1.0" }
sunrise-cli = { path = "crates/sunrise-cli", version = "0.1.0" }
sunrise-server = { path = "crates/sunrise-server", version = "0.1.0" }
sunrise-integrations = { path = "crates/sunrise-integrations", version = "0.1.0" }
sunrise-core-bindings = { path = "crates/sunrise-core-bindings", version = "0.1.0" }
sunrise-bench = { path = "crates/sunrise-bench", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
# Line tables, not full DWARF. `target/` reached 20 GB on this profile and
# filled the disk twice, killing builds mid-run. Line tables are what a panic
# backtrace and a test failure actually read — file, line, and symbol survive
# intact; what goes is local-variable and type detail, which only an
# interactive debugger steps through. Measured on this workspace: 16 GB -> the
# figure in the commit message, for no change in backtrace quality.
debug = "line-tables-only"

# Keep test deps (proptest, etc.) optimized — property runs go from minutes to seconds.
[profile.dev.package."*"]
opt-level = 1
