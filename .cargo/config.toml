# Cross-compile target hints. Targets aren't installed by default; CI installs
# them on demand. Keep workspace-level settings minimal so local builds are
# fast on whatever host is running.

[build]
# Use the host target by default; CI overrides via --target.

[target.aarch64-apple-darwin]
# Apple Silicon: the macOS app's xcframework slice (`mise run apple-xcframework`).

[target.aarch64-apple-ios]
# iOS device: the iOS app's device slice (`mise run apple-xcframework`). Builds
# with no manifest change — `bundled-sqlcipher` takes libsqlite3-sys's
# `is_apple` branch (CommonCrypto + `framework=Security`) for any `*-apple-*`
# target, and the TLS stack is `ring` rather than `aws-lc`.

[target.aarch64-apple-ios-sim]
# iOS Simulator on Apple Silicon: the slice `mise run ios-app` tests against. A
# separate triple from the device even though both are arm64 — see the note in
# mise.toml about `LC_BUILD_VERSION`.

[target.aarch64-linux-android]
# Android arm64 target (UniFFI bindings). Deferred.

[target.wasm32-unknown-unknown]
# Web PWA WASM target (wasm-bindgen). Deferred (ADR-0012).

[target.x86_64-unknown-linux-gnu]
[target.x86_64-pc-windows-msvc]

[net]
git-fetch-with-cli = true
