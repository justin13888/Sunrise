# cargo-mutants configuration.
#
# Mutation testing asks a question `cargo test` cannot: not "do the tests
# pass", but "would they notice if the code were wrong". It changes one
# operator or return value at a time and reports the changes nothing caught.
#
# `docs/10-cross-cutting/testing.md` §Mutation testing scopes this to
# `sunrise-core`, `sunrise-crypto`, `sunrise-sync` and `sunrise-domain`, and to
# release candidates rather than pull requests. The scoping is a cost decision
# and it is the right one: those four crates alone generate ~2,500 mutants, and
# each one is an incremental rebuild plus a test run.
#
# Run it with `mise run mutants <crate>`, never bare — the task pins `--jobs 1`
# for a reason recorded there.

# What is not worth mutating.
#
# The excluded crates are excluded for four different reasons, and the
# distinction matters more than the list:
#
#   sunrise-core-bindings   The UniFFI seam. Its job is to hand values across
#                           an FFI boundary, so most of it is conversion code
#                           whose mutants are either unviable or caught by the
#                           crate on either side. The Swift half cannot be
#                           mutated at all, which would make any score here a
#                           statement about half a seam.
#   sunrise-bench           Benchmarks. Not correctness code.
#   sunrise-e2e             A test harness. Mutating a harness measures the
#                           harness's own tests, which do not exist.
#   sunrise-relay-client    Generated from the OpenAPI description by build.rs.
#                           A mutant here is a change to a file nobody edits.
#   sunrise-crypto-test-vectors
#                           Frozen literals. There is nothing to mutate but the
#                           constants the vectors exist to pin, and flipping one
#                           tests the test.
#   sunrise-test-seed       The `SUNRISE_FUZZ_SEED` reader. Same shape as the
#                           two entries above: test scaffolding, reachable from
#                           no shipping binary. Mutating the thing that decides
#                           which cases a property test draws would also make
#                           every mutation run non-reproducible.
exclude_globs = [
    "crates/sunrise-core-bindings/**",
    "crates/sunrise-bench/**",
    "crates/sunrise-e2e/**",
    "crates/sunrise-relay-client/**",
    "crates/sunrise-crypto-test-vectors/**",
    "crates/sunrise-test-seed/**",
    "**/tests/**",
    "**/benches/**",
    "**/build.rs",
]

# Mutants no test should be asked to catch.
#
# A `Debug` or `Display` impl that renders differently is not a defect anyone is
# going to assert on, and demanding coverage for it teaches people to write
# assertions that pin formatting — which then break on every unrelated change.
# That is the whole argument, and it reaches exactly these two traits.
#
# The patterns are written against the names `--list` prints, not against the
# source. cargo-mutants names a trait method by its impl header, so
# `impl std::fmt::Debug for CoreConfig` is listed as
# `<impl std::fmt::Debug for CoreConfig>::fmt` -- the path the source happens to
# spell is carried into the name verbatim. This tree spells it four ways
# (`Debug`, `fmt::Debug`, `std::fmt::Debug`, `core::fmt::Debug`), so the pattern
# has to admit an optional path prefix rather than anchor on the bare trait
# name. `(?:[A-Za-z0-9_]+::)*` is that prefix, and it is deliberately *not*
# `.*`: a wildcard would also swallow
# `<impl Deserialize<'de> for WeekdaySet>::deserialize::<impl Visitor<'de> for
# SetVisitor>::expecting`, which returns a `fmt::Result` but is a
# deserializer's error message, not a rendering of a value -- a test may
# legitimately assert on it, so it stays scored.
#
# The four patterns this replaces -- `impl Debug`, `impl Display`,
# `<impl Debug for`, `<impl Display for` -- matched **nothing**. #118 removed
# two dead patterns from this list and left these on the assumption they were
# live; they were not. Every hand-written `Debug`/`Display` impl in the four
# scoped crates qualifies the path, and a derived one has no body to mutate, so
# `cargo mutants -p <crate> --list` returns an identical population with this
# key set to `[]` as it does with those four patterns in place: 1130, 525, 137
# and 1357 for core, crypto, sync and domain. The gap #125 reported was
# therefore total, not partial.
#
# Widening it excludes 21 mutants, every one of them a `Debug` or `Display`
# `fmt`, and it is the first change to this key that moves the population:
#
#   sunrise-core     1130 -> 1121  (-9)
#   sunrise-crypto    525 ->  516  (-9)
#   sunrise-sync      137 ->  135  (-2)
#   sunrise-domain   1357 -> 1356  (-1)
#
# `mutants/baseline.json` is **not** re-recorded here. Its floors are absolute
# counts plus a percentage, and which side of the caught/missed line each of
# those 21 sat on is only knowable from a campaign, not from `--list`. The
# floors for `sunrise-crypto` and `sunrise-sync` are the two recorded today and
# both shrink by at most 9 and 2 respectively; the next nightly's artifacts are
# what should set them.
#
# Two patterns were removed from this list by #118, for opposite reasons, and
# the reasoning is worth keeping.
#
# `fn main` was dead. The scope above is `sunrise-core`, `sunrise-crypto`,
# `sunrise-sync` and `sunrise-domain`, and none of them has a binary target, so
# it matched nothing. The reason written for it argued about `sunrise-cli` --
# "covered by the CLI's own integration tests running the real binary" -- which
# is a crate this config never mutates. If the scope ever grows to a binary,
# make that argument then, against that binary's tests.
#
# `impl Clone` was never argued for at all, and the `Debug`/`Display` reason
# does not carry over: a `Clone` that drops a field, or shares one it should
# have copied, is an ordinary correctness defect, and the types cloned in these
# crates hold keys, cursors and caches. Every `Clone` in the four scoped crates
# is derived today, so the pattern was matching nothing either; dropping it
# means the first hand-written one gets scored instead of silently skipped.
exclude_re = [
    "<impl (?:[A-Za-z0-9_]+::)*Debug for ",
    "<impl (?:[A-Za-z0-9_]+::)*Display for ",
]

# `sunrise-crypto` runs Argon2id at production parameters — 64 MiB, t=3, p=1
# (`crates/sunrise-crypto/src/recovery.rs`), deliberately not weakened for
# tests. Under mutation each surviving mutant pays that cost again, and a
# machine under load pays it slower still. Without a generous multiplier those
# runs are scored as timeouts, which reads identically to "caught" in the
# summary and is not the same claim at all.
timeout_multiplier = 5.0
minimum_test_timeout = 120

# Build timeouts get their own headroom: the first build in a fresh tree
# compiles SQLCipher from source through `rusqlite`'s `bundled-sqlcipher`
# feature, which is much slower than the incremental rebuilds that follow.
build_timeout_multiplier = 5.0
