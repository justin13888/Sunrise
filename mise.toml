# Sunrise developer task runner.
# All project commands live here; git hooks (lefthook.yaml) call these tasks.
# Run `mise tasks` to see everything available, `mise run <task>` to run one.
#
# Task names are exactly the recipe names this file replaces, so every command
# in the README and the docs is the old one with `just` swapped for `mise run`.
#
# Two mise details worth knowing before editing:
#
# 1. `run` strings are Tera templates, so a literal `{{` would be interpreted.
#    None is needed here — what were `just` variables are environment variables
#    below, referenced as `$name`, which is also what makes them visible to the
#    scripts the tasks call.
# 2. `depends` runs in **parallel**. That is fine for a single dependency and
#    wrong for the aggregates, where order is the point and, for `apple-app`,
#    two concurrent release builds of the C dependencies are how the disk
#    fills. Those chain `mise run` calls in `run` instead, which is sequential.

[env]
# The UniFFI-exported crate, its underscored cargo lib name, and the framework.
ffi_crate = "sunrise-core-bindings"
ffi_lib = "sunrise_core_bindings"
ffi_fw = "SunriseCore"

# Slices, grouped by *platform*. Each group becomes one `-library` in the
# xcframework; several triples inside a group are `lipo`d into one fat archive
# first (add `x86_64-apple-darwin` to `macos_slices` — and `rustup target add`
# it — for a universal Mac binary).
#
# The three groups cannot be collapsed into one list. An xcframework is keyed
# by platform, and `aarch64-apple-ios` and `aarch64-apple-ios-sim` are both
# arm64: what tells them apart is the `LC_BUILD_VERSION` platform recorded in
# every object file, which is the whole reason the `-sim` triple exists.
macos_slices = "aarch64-apple-darwin"
ios_slices = "aarch64-apple-ios"
ios_sim_slices = "aarch64-apple-ios-sim"

# Deployment targets. Each must equal the matching `options.deploymentTarget`
# entry in apps/apple/project.yml; see the note in `apple-xcframework`.
macos_target = "26.0"
ios_target = "26.0"

# The simulator this project tests against. Any booted iPhone would do; naming
# one keeps `mise run ios-app` reproducible and keeps CI and a laptop on the
# same device.
ios_sim = "iPhone 17 Pro"

# --- Setup ---

[tasks.setup]
description = "Install JS dependencies and git hooks"
run = ["bun install", "lefthook install"]

# --- JavaScript / TypeScript (Bun + Biome + tsc) ---

[tasks.check]
description = "Lint & format check, no writes (Biome)"
run = "bun run check"

[tasks.fix]
description = "Lint & format with autofix (Biome)"
run = "bun run check:fix"

[tasks.ci]
description = "Strict CI lint check, no writes (Biome)"
run = "bun run ci"

[tasks.typecheck]
description = "Type-check every workspace package"
run = "bun run typecheck"

[tasks.test]
description = "Run the JS/TS test suite once"
run = "bun run test:run"

[tasks.test-coverage]
description = "Run the JS/TS test suite with coverage"
run = "bun run test:coverage"

# --- Rust (Cargo) ---

# Two commands, not one, on both of these. `--all` means "every member of the
# workspace this manifest names", and `fuzz/` is deliberately its own workspace
# root (see `fuzz/Cargo.toml`), so the root invocation cannot reach it. Naming
# its manifest here is also what puts `fuzz/Cargo.toml` in front of
# `crates/sunrise-log/tests/event_catalog.rs`, which derives the
# out-of-workspace half of its file set from the manifest paths this file
# names. (Spelling that flag out in prose is not possible here: the scan is a
# text search over this file and would read the word in a comment as a path,
# then fail because no manifest is at `\``.) The same scan is why the manifest
# path is not the last token of either command: it reads the path as the next
# whitespace-delimited word and strips quotes, not the `",` that closes a TOML
# array element, so a path at the end of one of these strings is read as
# `fuzz/Cargo.toml",` and the gate fails closed on a manifest that is not
# there. Do not "tidy" the flag order back.
[tasks.rust-fmt-check]
description = "Check Rust formatting, no writes"
run = [
  "cargo fmt --all -- --check",
  "cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check",
]

[tasks.rust-fmt]
description = "Format Rust code in place"
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path fuzz/Cargo.toml --all",
]

[tasks.rust-clippy]
description = "Lint Rust with Clippy (warnings denied)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.rust-check]
description = "Type-check the Rust workspace"
run = "cargo check --workspace --all-targets"

[tasks.rust-test]
description = "Run the Rust test suite"
run = "cargo test --workspace --all-targets"

[tasks.storage-fixtures]
description = "Rewrite the committed old-vault fixtures under crates/sunrise-storage/fixtures/"
shell = "bash -c"
# The generator is an `#[ignore]`d test rather than a binary, so that the
# fixtures and the assertions about them are the same code reading the same
# constants: a `main.rs` that drifted from the test would produce a file the
# test then rejects, and the fix would be to edit the generator to agree with
# itself. `--ignored` is what keeps `mise run rust-test` reading the committed
# files instead of rewriting them, and `--exact` keeps this from picking up the
# ordinary fixture tests beside it.
#
# Regenerate deliberately. A fixture rewritten at today's schema is no longer
# old, and the migration chain it exists to exercise then runs over nothing —
# the `the_committed_v13_fixture_is_a_sealed_vault_stamped_at_the_baseline`
# test is the tripwire for exactly that.
run = """
set -euo pipefail
cargo test -p sunrise-storage --lib \
  vault_fixtures::regenerate_the_committed_vault_fixtures -- --ignored --exact
echo
echo "rewritten: crates/sunrise-storage/fixtures/"
git status --short crates/sunrise-storage/fixtures/
"""

[tasks.rust-doctest]
description = "Run the workspace doc tests (CI's doc gate, verbatim)"
# `--all-targets` above silently excludes doc tests, so this is the only local
# command that runs them. Two runs rather than one, matching CI exactly: every
# crate but `sunrise-server` is watched with nothing filtered out, and the
# `--skip` that contains kynos 0.1.0's generated `relative_uri` items is
# confined to `sunrise-server`, the only crate in the workspace that carries a
# kynos route attribute. `--skip` is a substring match over whatever run it is
# given, so scoping the run is what keeps a genuine doc test elsewhere from
# being dropped by the same name. See crates/sunrise-server/Cargo.toml for why
# the 18 skipped items exist (#58) and #60 for the upstream release that
# retires the filter.
run = [
  "cargo test --workspace --exclude sunrise-server --doc",
  "cargo test -p sunrise-server --doc -- --skip relative_uri",
]

[tasks.rust-doc]
description = "Build the rustdoc for the workspace with every rustdoc warning denied"
# The third documentation gate, and the one a compiler decides. `cargo build`,
# `cargo clippy` and `cargo test` are all blind to a broken intra-doc link:
# `[`Foo`]` that resolves to nothing renders as literal text for exactly the
# reader the comment was written for, and nothing goes red. Forty-eight such
# errors were standing on master when this task was added — an ambiguous
# `[init]`, links to items in other crates that were never imported, and a row
# of public doc comments pointing at private items, which break in the published
# docs even though `--document-private-items` resolves them here.
#
# `--document-private-items` is deliberate: it documents the private half of
# every crate, so a link inside a private item is checked too rather than
# skipped. It also turns on `rustdoc::private_intra_doc_links`, which is the
# lint that catches a *public* comment linking somewhere a public reader cannot
# follow.
#
# `--no-deps` keeps this about this workspace. A dependency's rustdoc is its
# author's problem and would make the gate flap on a version bump.
run = 'RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items'

[tasks.orphan-crates]
description = "Reject crates that no shipping binary can reach (the CI gate, run locally)"
run = ".github/scripts/orphan-crate-gate.py"

# `spargen` reads the committed file, so it is an input rather than a report:
# `the_committed_description_is_current` fails until this has been re-run.
[tasks.openapi]
description = "Regenerate the OpenAPI description from the handlers that produce it"
run = "cargo run -q -p sunrise-server --bin openapi -- schemas/generated/openapi.v1.json"

# The same shape as `openapi` above, and for the same reason: the four files
# under `packages/sunrise-ui-tokens/generated/` are *inputs* — Xcode compiles
# `tokens.swift` and Vite bundles `tokens.css` — rather than reports, and
# neither build environment has Bun or mise on PATH to produce them on demand.
# `tokens-check` fails until this has been re-run. See ADR-0029.
[tasks.tokens]
description = "Regenerate the design tokens from packages/sunrise-ui-tokens/tokens/*.toml"
run = "bun run packages/sunrise-ui-tokens/build.ts"

[tasks.tokens-check]
description = "Reject generated tokens that have drifted, and prove tokens.rs still compiles"
shell = "bash -c"
run = '''
set -euo pipefail
bun run packages/sunrise-ui-tokens/build.ts >/dev/null
git diff --exit-code -- packages/sunrise-ui-tokens/generated \
  || { echo "tokens: the generated files are stale; run \`mise run tokens\` and commit the result." >&2; exit 1; }

# `tokens.rs` is the one output with no consumer (ADR-0029), so nothing else
# would notice it stop compiling. These two checks are what keep it a Rust file
# rather than a text file with a .rs extension. It is not a Cargo member and
# adds nothing to Cargo.toml or Cargo.lock, so `rustc` is invoked directly on
# the pinned toolchain.
meta="$(mktemp -d)"
trap 'rm -rf "$meta"' EXIT
rustc --edition 2021 --crate-type rlib --emit=metadata \
  --out-dir "$meta" packages/sunrise-ui-tokens/generated/tokens.rs
rustfmt --check --edition 2021 packages/sunrise-ui-tokens/generated/tokens.rs
'''

# --- Fuzzing (cargo-fuzz) ---
#
# The harnesses live in `fuzz/`, which is its own cargo workspace. Two things
# force that and neither is negotiable:
#
# 1. `cargo-fuzz` compiles a target with `-Zsanitizer=address` and the `sancov`
#    coverage passes, which are **nightly** rustc flags. This workspace pins
#    1.91.1 in `rust-toolchain.toml` under ADR-0026, and CI asserts that four
#    separate files agree about that number.
# 2. `libfuzzer-sys` and its C++ runtime would otherwise land in the root
#    `Cargo.lock` and be resolved on every ordinary workspace build.
#
# So the toolchain is selected per invocation with `+`, defaulting to whatever
# `nightly` currently resolves to. `SUNRISE_FUZZ_TOOLCHAIN` pins it to a dated
# nightly when a run has to be reproducible:
# `SUNRISE_FUZZ_TOOLCHAIN=nightly-2026-06-10 mise run fuzz-build`. There is no
# pin in this file because a pinned nightly nobody refreshes rots into "install
# this exact 400 MB toolchain to run one gate", and the harnesses use no
# nightly *language* feature — only the sanitizer flags, which every nightly
# has.
#
# `cargo-fuzz` must be installed first: `cargo install cargo-fuzz --locked`. It
# is not in `[tools]` because mise has no backend for it, and a `cargo:`
# backend entry would build it from source on every developer's first task.

[tasks.fuzz-build]
description = "Build every cargo-fuzz target (the compile gate for fuzz/, run locally)"
shell = "bash -c"
run = "cargo \"+${SUNRISE_FUZZ_TOOLCHAIN:-nightly}\" fuzz build --fuzz-dir fuzz"

# Ten seconds a target, six targets: about a minute once the build is warm.
# This is not a search — ten seconds finds nothing a corpus does not already
# contain. What it proves is that each harness starts, reads its committed
# seeds, and does not abort on one of them, which is the failure `fuzz-build`
# cannot catch and the one that actually happens when a crate under test
# changes its behaviour.
#
# `SUNRISE_FUZZ_SECONDS` raises the budget. Note it is a different name from
# `SUNRISE_FUZZ_SEED`, which `docs/10-cross-cutting/testing.md` §5 documents as
# the chaos harness's variable and says is the only consumer in the workspace;
# that sentence stays true.
[tasks.fuzz-smoke]
description = "Run every fuzz target briefly against its committed seeds. Proves they execute"
shell = "bash -c"
run = """
set -euo pipefail
seconds="${SUNRISE_FUZZ_SECONDS:-10}"
for target in op_envelope wire_frame rrule ical oauth_state recovery_blob; do
  mkdir -p "fuzz/corpus/$target"
  echo "== $target (${seconds}s)"
  cargo "+${SUNRISE_FUZZ_TOOLCHAIN:-nightly}" fuzz run --fuzz-dir fuzz "$target" \
    "fuzz/corpus/$target" "fuzz/seeds/$target" -- -max_total_time="$seconds"
done
"""

[tasks.fuzz]
description = "Fuzz one target for a while: `mise run fuzz op_envelope 3600`"
shell = "bash -c"
usage = """
arg "<target>" default="op_envelope"
arg "<seconds>" default="600"
"""
run = """
set -euo pipefail
mkdir -p "fuzz/corpus/$usage_target"
cargo "+${SUNRISE_FUZZ_TOOLCHAIN:-nightly}" fuzz run --fuzz-dir fuzz "$usage_target" \
  "fuzz/corpus/$usage_target" "fuzz/seeds/$usage_target" \
  -- -max_total_time="$usage_seconds"
"""

[tasks.bench]
description = "Run the Criterion benchmark suite (submit / query_today / fts / sync_session)"
run = "cargo bench -p sunrise-bench"

[tasks.bench-baseline]
description = "Run the benches, then merge the results into bench/baseline.json for this platform"
run = ["cargo bench -p sunrise-bench", "cargo run -p sunrise-bench --bin baseline"]

# --- Documentation ---

[tasks.docs-links]
description = "Reject a markdown link or heading anchor that resolves to nothing (the CI gate, run locally)"
# Offline by design: relative links, in-file anchors and cross-file anchors
# across every tracked `.md`, and nothing with a scheme. The docs cite plenty of
# third-party URLs, so an external crawler would go red on someone else's
# outage, and a gate people learn to ignore protects nothing. Runs in under a
# second over 130 files and needs no toolchain but python3.
run = ".github/scripts/docs-link-gate.py"

[tasks.proptest-persistence]
description = "Reject a tests/ proptest that does not set failure_persistence (the CI gate, run locally)"
# #118 settled the convention and nothing asserted it. proptest's default walks
# up from the source for a `lib.rs`, finds none above a `tests/` file, and
# writes a flat `<name>.proptest-regressions` beside the test instead of the
# tracked `proptest-regressions/tests/<name>.txt` — and the only thing between
# that and a silent divergence was somebody noticing an untracked file in
# `git status`. The script checks that every `proptest!` block under a crate's
# `tests/` carries a config, that the file names the persistence path derived
# from its own name, and that git neither ignores that path nor leaves an
# existing counterexample untracked.
run = ".github/scripts/proptest-persistence-gate.py"

[tasks.observability-catalog]
description = "Reject an observability.md event or metric block that has drifted from the tree (the CI gate, run locally)"
# `docs/06-server/observability.md` carries the operator-facing inventory of
# what this server emits, extracted from the source and marked as such. Nothing
# re-ran the extraction, and it had already drifted twice in one cycle. The
# script reads each block's own `grep` command out of the marker above it and
# runs that, so the document and the gate cannot disagree about what to extract,
# then diffs the result against the block in both directions — a name the
# catalogue advertises and the tree does not define is as much a defect as the
# reverse.
run = ".github/scripts/observability-catalog-gate.py"

[tasks.doc-comments]
description = "Reject a doc comment mangled into a shape rustdoc misreads (the CI gate, run locally)"
# `cargo fmt` does not reflow comments and clippy has no rule for comment
# *shape*, so a folded, split or detached doc comment passes every other gate
# here. Five decidable shapes, no prose style rule: two markers on one physical
# line (the PR #77 defect, created twice in one branch), an unclosed code fence,
# a paragraph indented into a code block that rustdoc then compiles (the #58/#60
# defect), a doc comment stranded below an outer attribute (the PR #63 defect),
# and two blocks split by a blank line that Rust silently rejoins. Standard
# library Python over every tracked `.rs`, in under a second.
run = ".github/scripts/doc-comment-gate.py"

# --- Apple clients (Swift / UniFFI) ---
#
# `--manifest-path` arguments in this file are an input to a test in another
# crate. `crates/sunrise-log/tests/event_catalog.rs` derives the out-of-workspace
# crates whose log vocabulary it gates by scanning this file for them, and it
# refuses a path it cannot resolve — so every one of them has to stay a literal.
# Factoring `tools/uniffi-bindgen/Cargo.toml` into a shell function parameter
# took 12 of that gate's 23 tests down, because the scan then finds `$1` (#138).
# The coupling is real and undeclared anywhere cargo can see, which is why it is
# written here, where the person editing the paths is looking.
#
# Comments are exempt: the scan skips lines whose first non-whitespace character
# is `#`, so prose here may name the flag freely (#147).

[tasks.apple-xcframework]
description = "Build the Swift bindings + SunriseCore.xcframework both Apple apps link"
shell = "bash -c"
run = """
set -euo pipefail
rm -rf build "out/$ffi_fw.xcframework"
mkdir -p build/headers build/macos build/ios build/ios-sim out/swift

# 0. Where cargo actually writes. Not necessarily `target/`: CARGO_TARGET_DIR
#    and `build.target-dir` both move it, and pointing several git worktrees
#    at one shared directory is how this repo is worked on a disk this full.
#    Ask cargo instead of restating its precedence rules here; `--no-deps`
#    keeps the question offline and cheap, and python3 reads the answer
#    because it is already a dependency of the gates in .github/scripts and
#    jq is not a dependency anywhere.
#
#    Honouring the variable by halves would be worse than ignoring it: two
#    worktrees sharing a target directory produce identically named outputs,
#    so building into the shared one and then reading a stale local `target/`
#    would package the other tree's slices without a word. Everything below
#    reads these two variables, never a literal path.
#
#    `tools/uniffi-bindgen` is a separate workspace with its own manifest, so
#    it is asked separately: the same directory as the workspace when the
#    variable is set, its own `tools/uniffi-bindgen/target` when it is not.
#
#    Only the JSON reader is a shared function. The manifest cannot be a
#    parameter: `event_catalog.rs` derives the set of out-of-workspace crates
#    whose log vocabulary it checks by scanning this file for the manifest
#    paths its cargo calls name, and it refuses an interpolated one because
#    it cannot tell which manifest that resolves to. So the bindgen manifest
#    is written out literally below, and the workspace query names none at
#    all — the task runs at the workspace root, like every cargo call here.
#    See the note at the top of this section.
target_directory() {
  python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])'
}
target_dir=$(cargo metadata --format-version 1 --no-deps | target_directory)
bindgen_target_dir=$(cargo metadata --format-version 1 --no-deps \\
  --manifest-path tools/uniffi-bindgen/Cargo.toml | target_directory)

# 1. One static + dynamic lib per slice. `--library` binding generation
#    reads the .dylib, so both crate-types are load-bearing.
#
#    The deployment targets must match the apps', or every object file in
#    the archive draws an `ld` warning about being built for a newer OS
#    than it is linked against — hundreds of them, from the C dependencies
#    (sqlite, zstd, ring), drowning every real diagnostic. Both variables
#    are exported for every slice: cc-rs reads whichever one matches the
#    target it is building for and ignores the other.
#
#    Serially, on purpose. A release build of the C dependencies for three
#    triples is the largest thing this repo does to the disk, and three of
#    them at once is how it fills.
export MACOSX_DEPLOYMENT_TARGET="$macos_target"
export IPHONEOS_DEPLOYMENT_TARGET="$ios_target"
for t in $macos_slices $ios_slices $ios_sim_slices; do
  cargo build -p "$ffi_crate" --release --target "$t"
done

# 2. Bindings, generated from the built library — no .udl, no build.rs.
#    Generated once, from the macOS slice, and used by both apps: this
#    reads UniFFI *metadata* out of the library rather than compiling
#    anything, and the Swift it emits names no platform.
#
#    `--locked` is not optional: the Swift this emits is an input to both
#    apps, so the generator is built from a resolved lockfile rather than
#    whatever the registry offers today. (It is no longer holding a
#    cargo-platform pin down — ADR-0026 raised the toolchain past that — but
#    the tool still lives outside the workspace; see its manifest for why.)
first=$(echo $macos_slices | awk '{print $1}')
cargo build --locked --release --manifest-path tools/uniffi-bindgen/Cargo.toml
"$bindgen_target_dir/release/uniffi-bindgen" generate \\
  --library "$target_dir/$first/release/lib$ffi_lib.dylib" \\
  --language swift --out-dir out/swift

# 3. The module map. UniFFI's own is unusable inside an xcframework: it is
#    named <lib>FFI.modulemap, which Xcode does not look for, and it emits
#    `use Darwin` / `use _Builtin_stdbool` / `use _Builtin_stdint` lines
#    that fail to resolve there. Rewriting it is the fix; the module name
#    must stay <lib>FFI to match the generated `import`. One set of headers
#    serves all three platforms — the C API does not vary by target.
cp "out/swift/${ffi_lib}FFI.h" build/headers/
printf 'module %sFFI {\\n    header "%sFFI.h"\\n    export *\\n}\\n' \\
  "$ffi_lib" "$ffi_lib" > build/headers/module.modulemap

# 4. One fat static lib per platform, then package the three together.
fatten() {
  local out="$1"; shift
  local libs=()
  for t in "$@"; do libs+=("$target_dir/$t/release/lib$ffi_lib.a"); done
  lipo -create "${libs[@]}" -output "build/$out/lib$ffi_lib.a"
}
fatten macos $macos_slices
fatten ios $ios_slices
fatten ios-sim $ios_sim_slices
xcodebuild -create-xcframework \\
  -library "build/macos/lib$ffi_lib.a" -headers build/headers \\
  -library "build/ios/lib$ffi_lib.a" -headers build/headers \\
  -library "build/ios-sim/lib$ffi_lib.a" -headers build/headers \\
  -output "out/$ffi_fw.xcframework"
echo "out/$ffi_fw.xcframework (macOS + iOS + iOS Simulator) + out/swift/$ffi_lib.swift"
"""

# Generate the Xcode project, build the macOS app, and run its tests.
#
# `xcodegen` needs the generated Swift bindings to exist before it can add them
# to the target, so the xcframework is built first even though the project's
# own `SunriseFFI` target would rebuild it. `.xcodeproj` is gitignored: this
# task is the only supported way to get one.
[tasks.macos-app]
description = "Generate the Xcode project, build the macOS app, and run its tests"
depends = ["apple-xcframework"]
dir = "apps/apple"
shell = "bash -c"
run = """
set -euo pipefail
xcodegen generate --quiet
swiftlint lint --strict --quiet --config .swiftlint.yml
xcodebuild test \\
  -project Sunrise.xcodeproj \\
  -scheme Sunrise \\
  -destination 'platform=macOS,arch=arm64' \\
  -quiet \\
  CODE_SIGNING_ALLOWED=NO
"""

# Generate the Xcode project, build the iOS app, and run its tests.
#
# The unit tests are `SunriseTests/` — the *same* sources the macOS bundle
# compiles, built a second time against the iOS app. That is the core claim
# this task makes: not that the iOS app builds, but that it behaves the way the
# Mac does everywhere the two share a model. The UI tests it also runs are
# below.
[tasks.ios-app]
description = "Generate the Xcode project, build the iOS app, and run its tests"
depends = ["apple-xcframework"]
dir = "apps/apple"
shell = "bash -c"
run = """
set -euo pipefail
xcodegen generate --quiet
swiftlint lint --strict --quiet --config .swiftlint.yml
# No `-only-testing`: the `SunriseiOS` scheme's test targets run whole, so this
# runs `SunriseiOSUITests` entire — the tab-shell and sidebar suites, and
# `ScreenshotWalkTests` with them. Deliberate, not an oversight. The walk costs
# about a minute inside a job budgeted for sixty, and this task is the only
# thing that runs it in CI: `apple-shots` needs machine grants a runner has
# not got. See the note on `ScreenshotWalkTests` for what the walk covers.
#
# If that minute ever stops being worth it, the lever is
# `-skip-testing:SunriseiOSUITests/ScreenshotWalkTests` on the command below —
# not `-only-testing`, which would drop the rest of the UI suite with it, and
# not deleting the suite.
#
# Signed, unlike the macOS build, and it has to be. iOS gates the Keychain
# on an application-identifier entitlement, which only exists on a signed
# binary — with `CODE_SIGNING_ALLOWED=NO` every `SecItemAdd` returns
# `errSecMissingEntitlement` and the vault cannot store its root, so the
# nine Keychain and vault-root tests fail for a reason that has nothing to
# do with the code. Ad-hoc (`CODE_SIGN_IDENTITY=-`, set in project.yml) is
# enough for the simulator and needs no developer account.
xcodebuild test \\
  -project Sunrise.xcodeproj \\
  -scheme SunriseiOS \\
  -destination "platform=iOS Simulator,name=$ios_sim" \\
  -quiet \\
  CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-
"""

[tasks.apple-app]
description = "Both Apple apps, back to back. What CI runs across its two jobs"
# Sequential rather than `depends`, which mise runs in parallel: two release
# builds of the C dependencies at once is how the disk fills.
run = ["mise run macos-app", "mise run ios-app"]

[tasks.ios-open]
description = "Generate the Xcode project and open it, with the iOS scheme selected"
depends = ["apple-xcframework"]
dir = "apps/apple"
run = "xcodegen generate --quiet && open Sunrise.xcodeproj"

[tasks.macos-uitest]
description = "Drive the real window (XCUITest); needs `sudo DevToolsSecurity -enable` once"
depends = ["apple-xcframework"]
shell = "bash -c"
run = """
set -euo pipefail
# Separate from `macos-app` because it needs one thing a build must not do
# for you. A macOS UI test takes control of another process, and the system
# kills the runner ("signal kill before establishing connection") unless
# developer mode is on — a one-time change to the machine's security
# posture. Signing is left on, too: the runner will not launch
# ad-hoc-unsigned.
if ! DevToolsSecurity -status | grep -q enabled; then
  echo "developer mode is off; run: sudo DevToolsSecurity -enable" >&2
  exit 1
fi
# Developer mode is the first of two grants and not the last. The runner
# also has to take automation control of the app, which is a separate TCC
# decision: the first attempt raises a system prompt, and a run nobody is
# watching fails with "Timed out while enabling automation mode" instead.
# Accept it, or add Xcode Helper under Privacy & Security → Accessibility.
# Both are one-time changes to the machine, which is why neither is done
# here.
cd apps/apple
xcodegen generate --quiet
# Its own scheme, not `-only-testing` on `Sunrise`: that flag cannot select
# a testable the scheme has skipped, and asking it to made this task fail
# before it built anything.
xcodebuild test \\
  -project Sunrise.xcodeproj \\
  -scheme SunriseUITests \\
  -destination 'platform=macOS,arch=arm64' \\
  -quiet
"""

[tasks.macos-open]
description = "Generate the Xcode project and open it. Everyday development entry point"
depends = ["apple-xcframework"]
dir = "apps/apple"
run = "xcodegen generate --quiet && open Sunrise.xcodeproj"

# --- Running the apps ---
#
# The three tasks above build and *test*; none of them puts an app on screen,
# which is the gap these two close. `-open` hands the project to Xcode and stops
# there, which is right for development and wrong for "does it work".
#
# `-derivedDataPath ../../out/dd` rather than Xcode's default, and that is the
# load-bearing part: the default lives under a hashed
# `~/Library/Developer/Xcode/DerivedData/Sunrise-<gibberish>` path that nothing
# can name without asking `xcodebuild -showBuildSettings` first. `out/` is
# gitignored and — unlike `build/` — is not `rm -rf`'d by `apple-xcframework`,
# so the product survives its own dependency.

[tasks.macos-run]
description = "Build the macOS app and launch it. The 'is it actually working' command"
depends = ["apple-xcframework"]
dir = "apps/apple"
shell = "bash -c"
# An optional scratch vault. With no argument the app opens the real vault in
# the standard location, which is what a demo should do; with one it opens a
# throwaway directory and an in-memory key store instead, so a run can be
# repeated from first-run without touching the developer's data or Keychain.
usage = 'arg "<vault>" default=""'
run = """
set -euo pipefail
xcodegen generate --quiet
xcodebuild build \\
  -project Sunrise.xcodeproj \\
  -scheme Sunrise \\
  -destination 'platform=macOS,arch=arm64' \\
  -derivedDataPath ../../out/dd \\
  -quiet \\
  CODE_SIGNING_ALLOWED=NO
app="../../out/dd/Build/Products/Debug/Sunrise.app"
# `open`, never `"$app/Contents/MacOS/Sunrise"`. Executing the binary directly
# starts the process without registering it with the window server as a
# foreground app: it runs, it opens no window, and it looks exactly like a hang.
# That is the single most likely way to conclude this app does not work.
if [ -n "$usage_vault" ]; then
  mkdir -p "$usage_vault"
  vault="$(cd "$usage_vault" && pwd)"
  echo "scratch vault: $vault"
  # `-n`, so a second scratch run is a second instance rather than a no-op
  # against the one already open. Two `Core::open`s on one directory are
  # refused by the vault lock, which is why each run wants its own directory.
  open -n "$app" --args -sunrise-ui-test-vault "$vault"
else
  open "$app"
fi
"""

[tasks.ios-run]
description = "Build the iOS app and launch it on the simulator"
depends = ["apple-xcframework"]
dir = "apps/apple"
shell = "bash -c"
run = """
set -euo pipefail
xcodegen generate --quiet
# Signed ad-hoc, like `ios-app` and for the same reason: iOS gates the Keychain
# on an application-identifier entitlement that only a signed binary carries,
# and the vault stores its root there.
xcodebuild build \\
  -project Sunrise.xcodeproj \\
  -scheme SunriseiOS \\
  -destination "platform=iOS Simulator,name=$ios_sim" \\
  -derivedDataPath ../../out/dd \\
  -quiet \\
  CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-
app="../../out/dd/Build/Products/Debug-iphonesimulator/Sunrise.app"
# The bundle id comes from the app that was just built. `project.yml` owns
# `PRODUCT_BUNDLE_IDENTIFIER`; a literal here is a second source of truth that
# fails silently — `install` still succeeds and only `launch` reports "not
# found", which reads like a broken build rather than a stale string.
bundle_id="$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")"
# Already-booted is not an error here; `bootstatus -b` then waits for the boot
# to actually finish, because `simctl install` against a half-booted device
# fails with a device-not-ready error that reads like a build problem.
xcrun simctl boot "$ios_sim" 2>/dev/null || true
open -a Simulator
xcrun simctl bootstatus "$ios_sim" -b
xcrun simctl install "$ios_sim" "$app"
xcrun simctl launch "$ios_sim" "$bundle_id"
echo
echo "To start again from first run:  xcrun simctl uninstall '$ios_sim' $bundle_id"
"""

[tasks.apple-shots]
description = "Walk every screen on both apps and write one PNG per screen to out/shots"
depends = ["apple-xcframework"]
shell = "bash -c"
run = """
set -euo pipefail
# The macOS half is an XCUITest, so it needs both of the grants `macos-uitest`
# documents — and the second one bites here in a way it does not there. The
# automation grant is keyed to the *app bundle path*, and these tasks build
# into `out/dd`, so a fresh clone or a new worktree is a new path and raises
# the prompt again. Unattended, it fails with "Timed out while enabling
# automation mode" after about three minutes.
#
# The iOS half needs neither. Failing here rather than producing half a walk
# is the more useful answer.
if ! DevToolsSecurity -status | grep -q enabled; then
  echo "developer mode is off; run: sudo DevToolsSecurity -enable" >&2
  exit 1
fi
echo "note: the first macOS run from this checkout raises an automation prompt." >&2
echo "      accept it, or the macOS half times out after ~3 minutes." >&2
root="$PWD"
# `-resultBundlePath` refuses to overwrite, and a stale bundle beside a fresh
# one is worse than no bundle at all.
rm -rf out/shots
mkdir -p out/shots
cd apps/apple
xcodegen generate --quiet

# `SunriseUITests` has a scheme of its own because the target is
# `skipped: true` in `Sunrise` — see the note on `macos-uitest`.
xcodebuild test \\
  -project Sunrise.xcodeproj \\
  -scheme SunriseUITests \\
  -destination 'platform=macOS,arch=arm64' \\
  -only-testing:SunriseUITests/ScreenshotWalkTests \\
  -resultBundlePath "$root/out/shots/macos.xcresult" \\
  -quiet

xcodebuild test \\
  -project Sunrise.xcodeproj \\
  -scheme SunriseiOS \\
  -destination "platform=iOS Simulator,name=$ios_sim" \\
  -only-testing:SunriseiOSUITests/ScreenshotWalkTests \\
  -resultBundlePath "$root/out/shots/ios.xcresult" \\
  -quiet \\
  CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-

cd "$root"
# The attachments come out under generated filenames; the manifest carries the
# names the tests set. A directory of UUIDs is not a design review.
for platform in macos ios; do
  xcrun xcresulttool export attachments \\
    --path "out/shots/$platform.xcresult" \\
    --output-path "out/shots/$platform" >/dev/null
  .github/scripts/name-shots.py "out/shots/$platform"
done
echo "out/shots/macos/*.png and out/shots/ios/*.png"
"""

# --- Mutation testing ---

[tasks.mutants]
description = "Mutation-test one core crate (cargo-mutants). Slow by nature; see mutants/baseline.json"
shell = "bash -c"
# `--shard k/n` splits one crate across runs. CI uses it to fan out; locally it
# is how you get a signal from `sunrise-domain` without giving up an afternoon.
usage = '''
arg "<crate>" default="sunrise-sync"
flag "--shard <shard>" default=""
'''
run = """
set -euo pipefail
# `--jobs 1`, and this is the line to read before changing it.
#
# cargo-mutants copies the source tree per job and runs a full cargo build and
# test inside each copy. Measured at `-j1` on this workspace: **604 MB peak
# RSS**, about one `cargo build`, and roughly 1.8 s per mutant on
# `sunrise-sync`. Every extra job is another tree on disk and another rustc
# resident — which on a laptop with an Xcode DerivedData directory beside it is
# how the machine falls over rather than how the run gets faster.
#
# If you have the headroom, raise it deliberately and watch the memory. The
# default is chosen to be safe on the machine most likely to run this, not fast
# on the biggest one.
shard_arg=""
slug="$usage_crate"
if [ -n "$usage_shard" ]; then
  shard_arg="--shard $usage_shard"
  # 3/6 -> 3-6. One directory per invocation, because cargo-mutants always
  # writes `mutants.out` under the directory it is given: pointed at a shared
  # one, every shard of a crate overwrites the last, and the run that scored
  # six shards would score whichever finished last. The gate reads the whole
  # tree of them, so keeping them apart is what makes a sharded local run add
  # up to the same verdict as CI's.
  slug="$slug-$(printf '%s' "$usage_shard" | tr / -)"
fi
# cargo-mutants creates its own `mutants.out` but not the parent it was told
# to put it in, and `out/` is gitignored so a fresh clone has none.
mkdir -p "out/mutants/$slug"
# cargo-mutants exits 2 when mutants survived and 3 when some timed out. Both
# mean the run measured something, and on this workspace both are the ordinary
# result — every scoped crate has surviving mutants, which is the entire reason
# the floors exist. Under `set -e` that aborted the task before the two lines
# below ever printed, so a run that worked perfectly looked like a run that
# broke, and the guidance it prints was unreachable in the only case that
# needed it. Coverage is the gate's verdict, not this task's; any other exit
# code is a real failure and is re-raised.
rc=0
cargo mutants -p "$usage_crate" --jobs 1 $shard_arg --output "out/mutants/$slug" || rc=$?
case "$rc" in
  0 | 2 | 3) ;;
  *) exit "$rc" ;;
esac
echo
echo "surviving mutants: out/mutants/$slug/mutants.out/missed.txt"
echo "score this run:    .github/scripts/mutants-gate.py out/mutants/$slug/mutants.out/outcomes.json"
"""

[tasks.mutants-baseline]
description = "Record the current mutation-coverage floors into mutants/baseline.json"
shell = "bash -c"
# `--expect-shards` is required, not optional, and this is the whole point of
# the task. The glob below picks up every run sitting under out/mutants/, and
# what is sitting there is whatever you happened to run last — one shard of
# sunrise-domain, say. Recorded as a floor, that shard's rate stands for the
# whole crate: measured over a sixth of its mutants and thereafter too low to
# fail on anything. Naming the counts is the one moment where someone states
# what the floor is supposed to cover, so the gate can check it did.
#
# For a deliberately partial floor, call the gate directly with
# `--allow-partial`, which records without the check and says so.
usage = 'flag "--expect-shards <expect_shards>" required=#true'
run = """
set -euo pipefail
# Deliberately separate from `mutants`, and deliberately not something the gate
# does on its own when the number goes up. Moving a floor is a claim that the
# tests got better, and a claim belongs in a commit message.
#
# Every run under out/mutants/, not one fixed path: `mise run mutants` gives
# each crate and shard its own directory, and a floor recorded from one of them
# while the others sit on disk is a floor for a fraction of the crate.
shopt -s nullglob
outcomes=(out/mutants/*/mutants.out/outcomes.json)
# Results from before each run got its own directory sit one level shallower,
# and the glob above steps straight over them. A tree that has them is not an
# empty tree, and saying "no results" to someone looking at a mutants.out they
# just produced is the wrong answer. Named literally rather than globbed:
# nullglob only drops patterns, and a literal path that does not exist would
# survive into the array and be handed to the gate as a file to read.
legacy=out/mutants/mutants.out/outcomes.json
if [ -f "$legacy" ]; then
  outcomes+=("$legacy")
fi
if [ -z "${outcomes[0]:-}" ]; then
  echo "no results in out/mutants/*/mutants.out/ or out/mutants/mutants.out/;" >&2
  echo "run 'mise run mutants <crate>' first" >&2
  exit 1
fi
echo "recording from:"
for outcome in "${outcomes[@]}"; do
  echo "  $outcome"
done
.github/scripts/mutants-gate.py "${outcomes[@]}" --update \
  --expect-shards "$usage_expect_shards"
"""

[tasks.mutants-gate-test]
description = "Assert the mutation gate's exit-code contract (fast, no mutants)"
# Runs in about a second: it synthesises outcomes.json fixtures in a temp
# directory and never invokes cargo. That is the point — the gate's contract is
# what CI and the printed remedies depend on, and it had drifted twice before
# anything asserted it, because the only way to exercise it was a full mutation
# run nobody waits for.
run = "python3 .github/scripts/test_mutants_gate.py"

# --- Release artifacts ---
#
# Same Dockerfile and the same build args the release workflow uses, so a
# failure here is a failure there. Note the size of the job: a release build of
# the workspace's C dependencies (SQLCipher, ring, zstd) inside a fresh
# container wants ~10 GB of container storage and tens of minutes cold.

# The two tasks that take arguments, and the one place mise is not a rename of
# what `just` did. `just` bound named parameters with defaults; mise appends
# whatever is on the command line to the `run` string, so a bare `$1` here
# would read the *script's* first argument and silently ignore the caller's —
# which is exactly what it did, quietly rendering the whole history.
#
# `usage` is the binding that works, and the only one with a future: the older
# `{{arg()}}` template is deprecated for removal in mise 2027.5.0, and it
# shell-quotes what it substitutes, so a value that then gets quoted again
# arrives with the quotes still on it. Declared args arrive as `usage_<name>`.
# `mise run <task> --help` lists them.

[tasks.docker-build]
description = "Build the sunrise-server image that the release workflow publishes to GHCR"
shell = "bash -c"
usage = 'arg "<tag>" default="sunrise-server:dev"'
run = '''
set -euo pipefail
docker build \
  --build-arg VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)" \
  --build-arg VCS_REF="$(git rev-parse --short HEAD)" \
  -t "$usage_tag" .
'''

[tasks.changelog]
description = "Render the Conventional-Commit changelog for a range, as the release notes do"
usage = '''
arg "<from>" default=""
arg "<to>" default="HEAD"
'''
run = '.github/scripts/changelog.sh "$usage_from" "$usage_to"'

# --- Aggregates (mirror the git hooks; handy to run by hand) ---

[tasks.pre-commit]
description = "Everything the pre-commit hook runs"
run = [
  "mise run fix",
  "mise run typecheck",
  "mise run rust-fmt-check",
  "mise run rust-clippy",
]

[tasks.pre-push]
description = "Everything the pre-push hook runs"
run = [
  "mise run ci",
  "mise run typecheck",
  "mise run test",
  "mise run rust-test",
]

[tasks.validate]
description = "Full local validation: Biome CI + typecheck + coverage"
run = "bun run validate"
