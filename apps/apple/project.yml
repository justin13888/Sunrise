# XcodeGen input. The generated `Sunrise.xcodeproj` is NOT committed —
# `mise run macos-app` regenerates it — so this file is the project.
#
# Two things here are load-bearing:
#
# 1. `SunriseFFI` is an aggregate target that runs `mise run apple-xcframework`,
#    and the app *depends* on it. The Rust build cannot be a script phase on
#    the app target: Xcode resolves and processes an `.xcframework` while it
#    plans that target's build, before any of its phases run, so a phase that
#    deletes and recreates the framework would race its own consumer.
#    In CI the framework is built once, by a job of its own, and that job's
#    consumers set `SUNRISE_FFI_PREBUILT=1`, which makes this target a no-op —
#    see the note on its script.
# 2. `SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY` is deliberately absent. Turning
#    it on produces 20 warnings in the generated bindings, which this project
#    compiles as errors.
# 3. Sparkle is pinned to an exact version, not a range. See `packages:` below.
name: Sunrise

# The macOS updater. ADR-0038 records why Sparkle, and — the part that is a
# security decision rather than a dependency choice — why its EdDSA appcast key
# is subordinate to the Developer ID certificate *in lifecycle* rather than a
# second, co-equal trust root, and why that is not the same as it being the
# weaker of the two.
#
# **`exactVersion`, not `from:`, and that is load-bearing.** `Sunrise.xcodeproj`
# is generated and gitignored, so the `Package.resolved` Xcode writes *inside*
# it is not committed either: a version range would let every CI machine and
# every developer resolve a different Sparkle, with nothing in the repository
# recording which one shipped. For the one dependency whose job is to authorise
# code that replaces the running app, "whatever resolved that day" is the wrong
# answer. Bumping it is a commit, which is what makes it reviewable.
#
# `.github/workflows/release.yml` downloads the matching Sparkle *tools*
# tarball to get `sign_update`, and asserts that its pin equals this line —
# signing an appcast with a different release of the tooling than the framework
# that will verify it is the kind of skew nobody notices until an update fails.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

options:
  bundleIdPrefix: dev.sunrise
  createIntermediateGroups: true
  # Both must equal the matching `*_target` in mise.toml, which is what the
  # xcframework's slices are built against.
  #
  # iOS 26.0 rather than the 17+ that `docs/07-clients/mobile-ios.md` used to
  # specify, and for one reason: the macOS app is pinned to macOS 26.0, and a
  # shared source file cannot use an API that only one of its two targets can
  # reach. Matching the majors means the shared tree needs no `@available`
  # forks at all — which is the whole point of sharing it.
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # The Rust build shells out to cargo, rustup and lipo. Script sandboxing
    # denies it the writes it needs under `target/` and `out/`.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    # macOS-only in effect (iOS has no such setting and ignores it), and here
    # rather than on the macOS target so there is exactly one place it lives.
    #
    # `YES` because the notary service rejects a submission without it, so a
    # release build has it whatever this file says — and until this line
    # existed, `release.yml` supplied it on the archive command line, which
    # made a developer's local archive a different bundle from the one that
    # ships in a setting that changes how the process runs. The hardened
    # runtime restricts library loading, ignores the DYLD environment
    # variables and requires an entitlement for each exception, so a crash it
    # causes appears first in a notarized build and nowhere earlier.
    #
    # No entitlement exception is needed today: the app loads one statically
    # linked xcframework and no plug-ins, `RegisterEventHotKey` is a Carbon
    # registration rather than an event tap, and `AXIsProcessTrusted` only
    # reads a permission. Anything that later needs an exception adds a
    # `com.apple.security.cs.*` entitlement here, not a `NO`.
    #
    # Unrelated to the App Sandbox, which stays off — see the note on the
    # macOS target below and ADR-0031.
    ENABLE_HARDENED_RUNTIME: YES
    # The App Group each app shares with its widget extension (#14): the
    # app writes the widgets' snapshot into its container and the extension
    # reads it. Spelled once, here, and reaching Swift through the
    # `SunriseAppGroup` Info.plist key every one of the four targets carries,
    # beside the entitlement that grants it.
    #
    # Two spellings because the two platforms grant a group differently.
    # iOS requires the `group.` form, which its provisioning profile
    # authorises. A Developer ID Mac app is granted a group prefixed with its
    # own team *without* a profile — and `release.yml` exports the Mac app
    # with no profile at all, so the `group.` form would be refused there.
    # With no team configured (every local and CI build) the prefix is
    # empty and the Mac group is plain `dev.sunrise`.
    "SUNRISE_APP_GROUP[sdk=iphone*]": group.dev.sunrise
    "SUNRISE_APP_GROUP[sdk=macosx*]": $(TeamIdentifierPrefix)dev.sunrise

# Builds `out/SunriseCore.xcframework` + `out/swift/sunrise_core_bindings.swift`,
# but only when there is something to build.
#
# The guard is not an optimisation. `apple-xcframework` opens with
# `rm -rf build out/SunriseCore.xcframework`, because
# `xcodebuild -create-xcframework` refuses to overwrite an existing output — so
# the task *destroys the framework before it knows it can replace it*, and
# anything that fails in between leaves the tree with no framework at all. Point
# 1 at the top of this file records that hazard for a script phase on the app
# target. It applies just as much to this aggregate target when the caller is
# `mise run ios-app` or `mise run macos-app`, whose `depends` has already built
# the framework moments earlier: the phase then deletes a *current* artefact
# that the very `xcodebuild` invocation running it is about to link, spends five
# minutes rebuilding three release slices of the C dependencies to arrive back
# where it started, and on any failure in those five minutes — a full disk is
# the one seen twice — surfaces as
# `The file "libsunrise_core_bindings.a" couldn't be opened`, which reads like a
# broken build and is nothing of the kind.
#
# So: rebuild when the framework is missing, when the generated bindings are
# missing, or when anything that feeds either is newer than the framework.
# Otherwise say so and stop. That leaves the two callers doing the right thing
# for the same reason — `mise run <task>` skips, because its `depends` just
# built it; Xcode on its own builds, because nothing else was going to.
#
# `basedOnDependencyAnalysis: false` stays. Xcode's own analysis needs the
# inputs enumerated, and the inputs are the whole Rust workspace; the check
# below asks that question directly and costs one `find`.
aggregateTargets:
  SunriseFFI:
    buildScripts:
      - name: Build SunriseCore.xcframework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          # CI builds the framework once, in a job of its own, and hands it to
          # the macOS and iOS jobs as an artefact. Those jobs pass
          # `SUNRISE_FFI_PREBUILT=1` to `xcodebuild` as a build setting, which
          # Xcode exports into this script's environment. Without this exit,
          # the first thing `apple-xcframework` does — `rm -rf` over
          # `out/SunriseCore.xcframework` — would delete the artefact the job
          # had just downloaded and rebuild it on a runner that no longer
          # carries a Rust toolchain. `basedOnDependencyAnalysis: false` above
          # is why nothing else can stop this phase from running.
          #
          # The freshness check below is not a substitute, and this is the
          # reason it sits first rather than being folded into it: that check
          # compares mtimes, and an artefact's mtimes survive a zip round trip
          # in a way this script cannot verify from the inside. A downloaded
          # framework could easily look older than a checkout made after it was
          # built. An explicit flag from the job that did the downloading is the
          # only signal here that means what it says.
          #
          # It is an opt-out and not an opt-in for the same reason the check
          # below is a check and not an assumption: on a developer's machine
          # the default has to stay "ask cargo". Nothing sets this variable
          # outside CI.
          if [ "${SUNRISE_FFI_PREBUILT:-}" = "1" ]; then
            echo "note: SUNRISE_FFI_PREBUILT=1 — reusing the prebuilt SunriseCore.xcframework"
            exit 0
          fi

          cd "$SRCROOT/../.."
          # Xcode's PATH carries neither Homebrew nor rustup.
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"

          framework="out/SunriseCore.xcframework"
          bindings="out/swift/sunrise_core_bindings.swift"
          # `-create-xcframework` writes Info.plist last, so its timestamp is
          # the moment the framework became usable rather than the moment the
          # build started.
          stamp="$framework/Info.plist"

          # `mise.toml` is an input: it names the three slices and both
          # deployment targets. `target/` directories are pruned — cargo's own
          # output is not an input, and walking it would dominate the check.
          if [ -f "$stamp" ] && [ -f "$bindings" ] && [ -z "$(
                find crates tools Cargo.toml Cargo.lock rust-toolchain.toml mise.toml \
                  \( -type d -name target -prune \) -o \( -newer "$stamp" -print -quit \)
              )" ]; then
            echo "note: $framework is newer than every input; nothing to rebuild."
            exit 0
          fi

          # `mise exec --` rather than a bare `mise run`: this script runs
          # under Xcode, which has none of the shell activation mise normally
          # relies on to put the toolchain on PATH.
          mise exec -- mise run apple-xcframework

targets:
  Sunrise:
    type: application
    platform: macOS
    sources:
      # `Sunrise/` compiles into both apps; `macOS/` into this one only. The
      # split is the point: everything a phone and a Mac agree on lives in the
      # first, and the second holds the surfaces a Mac has and a phone does not
      # — the menu bar, the global hotkey, the borderless capture panel, the
      # modal file panels and `NSPrintOperation`.
      - path: Sunrise
      - path: macOS
      # The widgets' snapshot format, which the app writes and the widget
      # extension reads — so both compile the one file.
      - path: Widgets/Shared
      # Generated from the Rust crate on every build; never edited, and
      # excluded from SwiftLint for the same reason.
      - path: ../../out/swift/sunrise_core_bindings.swift
        group: Generated
      # Generated from `packages/sunrise-ui-tokens/tokens/*.toml`, and — unlike
      # the bindings above — *committed*, not rebuilt here. Xcode's environment
      # has neither Bun nor mise on PATH (see the `SunriseFFI` script, which has
      # to inject both Homebrew and rustup), so this target cannot run the
      # generator. `mise run tokens-check` and the vitest drift test are what
      # keep the committed file honest instead. See ADR-0029.
      - path: ../../packages/sunrise-ui-tokens/generated/tokens.swift
        group: Generated
      # The string catalog, compiled from `i18n/*.toml` and committed for the
      # same reason (ADR-0054): `Strings.swift` is the typed `L10n` front, and
      # `Localizable.xcstrings` the messages Foundation formats, CLDR plurals
      # included. `mise run i18n-check` and the vitest drift test guard both.
      - path: ../../packages/sunrise-i18n/generated/Strings.swift
        group: Generated
      - path: ../../packages/sunrise-i18n/generated/Localizable.xcstrings
        group: Generated
        buildPhase: resources
    dependencies:
      - target: SunriseFFI
      - framework: ../../out/SunriseCore.xcframework
        embed: false
      # `Sunrise/Intents/` — the App Intents / Shortcuts surface
      # `docs/07-clients/parity-matrix.md` marks a MUST for macOS.
      #
      # Swift would autolink this from `import AppIntents` alone. It is named
      # anyway because the *other* half of the feature is invisible in the
      # sources: declaring the framework is what makes Xcode run
      # `appintentsmetadataprocessor` over this target, and that step is what
      # writes `Sunrise.app/Contents/Resources/Metadata.appintents`. Without
      # that bundle the intents compile, link, and are never offered by
      # Spotlight, Shortcuts or Siri — a surface that exists only in the
      # binary. `AppIntentsMetadataTests` asserts the bundle is really there.
      - sdk: AppIntents.framework
      # The updater, on this target only. iOS has no direct-download channel to
      # update over — ADR-0039 — so Sparkle on `SunriseiOS` would be a
      # framework that cannot be reached, embedded in a bundle App Store review
      # looks at. `macOS/SoftwareUpdate.swift` is the only file that imports
      # it, and it is a macOS-only source path for the same reason.
      - package: Sparkle
      # Embedded under `Contents/PlugIns`, which is where the system looks
      # for a Mac app's widgets.
      - target: SunriseWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunrise.Sunrise
        PRODUCT_NAME: Sunrise
        # Pinned rather than derived from the target name, and it is what makes
        # one test bundle serve both apps. Xcode would otherwise name the
        # module after the target, so the iOS app would be module `SunriseiOS`
        # and every `@testable import Sunrise` in `SunriseTests/` would have to
        # be conditional. Two targets may share a module name: they are
        # separate products, each with its own binary.
        PRODUCT_MODULE_NAME: Sunrise
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # No App Sandbox yet (#247). Sandboxing moves Keychain items into an
        # app-scoped group, which would have to land together with the
        # entitlement and a signing identity; both are release work.
        #
        # Nor is there a `keychain-access-groups` entitlement, which is a
        # *different* thing and is what the data-protection keychain needs —
        # the one that would make the vault root's `ThisDeviceOnly` class mean
        # something on the Mac. It cannot be committed on its own: it is a
        # restricted entitlement, and an ad-hoc-signed build carrying it is
        # killed by AMFI before `main`, so adding it here would break
        # `mise run macos-app` for everyone without an Apple team. See
        # docs/07-clients/desktop.md §The data-protection keychain is not a
        # one-line entitlement for the three configurations that were measured.
        #
        # The hardened runtime is a different setting and is on; it lives in
        # `settings.base` above, where its note explains why.
    # `CFBundleURLTypes` is the one key with no `INFOPLIST_KEY_` build setting
    # behind it, so registering `sunrise://` needs a real plist. It is
    # generated from here and gitignored, like the `.xcodeproj`: this file
    # stays the source of truth. `GENERATE_INFOPLIST_FILE` above still
    # supplies the rest — Xcode merges the `INFOPLIST_KEY_` settings into this
    # base.
    #
    # Written outside `Sunrise/` on purpose: a plist inside the source path
    # would also be copied into the bundle as a resource.
    info:
      path: Generated/Info.plist
      properties:
        # Per `docs/07-clients/interaction-patterns.md` §URL scheme.
        # Notification bodies carry these links, so without the registration a
        # tapped reminder opens nothing at all.
        #
        # `Viewer` rather than `Editor`: this app displays what the URL names,
        # it does not claim ownership of a document format.
        CFBundleURLTypes:
          - CFBundleURLName: dev.sunrise.Sunrise
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [sunrise]
        # XcodeGen writes literal defaults for these two; deferring to the
        # build settings keeps one version number in this file.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Where `WidgetSnapshotStore.appGroup()` writes. See
        # `SUNRISE_APP_GROUP` at the top of this file.
        SunriseAppGroup: $(SUNRISE_APP_GROUP)
        # --- Sparkle (ADR-0038) ------------------------------------------
        #
        # The feed the app asks "is there a newer build?". It is the
        # `appcast.xml` asset of the newest *stable* release: GitHub's
        # `/releases/latest/` alias skips prereleases, which is why the
        # `appcast` job in `release.yml` re-uploads the regenerated feed onto
        # the current stable release whenever it publishes a prerelease. The
        # feed itself carries both channels; this URL is only how it is
        # reached.
        SUFeedURL: https://github.com/justin13888/Sunrise/releases/latest/download/appcast.xml
        # **Empty on purpose, and the app checks it.** The EdDSA key pair does
        # not exist yet — only the repository owner can create it, with
        # `generate_keys`, and the private half becomes the
        # `SPARKLE_ED_PRIVATE_KEY` repository secret. The public half is not a
        # secret and belongs here, in the committed bundle, so that what a
        # build trusts is reviewable rather than injected at signing time.
        #
        # Until it is filled in, `SoftwareUpdate.controller` returns nil, no
        # updater is started and the Check for Updates item says why. That is
        # the fail-closed direction: a Sparkle configured with no public key
        # would be an updater that cannot verify what it downloads.
        SUPublicEDKey: ""
        # Check in the background; ask before installing. The second half is
        # narrower than Sparkle's automatic mode on purpose — replacing the
        # binary of an app that holds a user's encrypted vault without telling
        # them is a bigger claim than `docs/07-clients/desktop.md` §Update
        # channel makes. What that section does require is that a running
        # session is never interrupted, and Sparkle satisfies it either way:
        # the installer runs when the app quits.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        # The feed itself is signed, and the app requires it to be. Sparkle
        # documents `SURequireSignedFeed` as opt-in and says what it buys:
        # "an attacker that compromises an app's update server will not be
        # able to inform and trick existing users to update from another
        # location". This repository *is* the update server, and its release
        # assets are writable by anything holding a repository token — which
        # is a strictly wider set than the holders of the EdDSA key.
        #
        # `SUVerifyUpdateBeforeExtraction` is not optional beside it: Sparkle
        # requires it for signed feeds. It is also what makes the rotation
        # story in ADR-0038 work, because with it enabled Sparkle will only
        # accept a change of EdDSA key from a Developer ID code signed `.dmg`
        # — which is exactly what `release.yml` produces and nothing else can.
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    # The App Group, and nothing else. Generated and gitignored like the
    # Info.plist above, so this file stays the source of truth.
    #
    # Not a restricted entitlement in the team-prefixed form a Developer ID
    # build carries, which is why it can be committed where
    # `keychain-access-groups` (see the note above) cannot: no profile is
    # needed to be granted it, and an ad-hoc build that carries it still
    # launches. The app itself is not sandboxed and can reach the container
    # path without it; it is here so the group is *granted* to the app the
    # same way it is granted to the sandboxed extension, rather than the
    # two sides reaching the one directory by different rights.
    entitlements:
      path: Generated/Sunrise.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SUNRISE_APP_GROUP)
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [ -x /opt/homebrew/bin/swiftlint ]; then
            /opt/homebrew/bin/swiftlint lint --quiet --config "$SRCROOT/.swiftlint.yml" "$SRCROOT/Sunrise" "$SRCROOT/macOS"
          else
            echo "warning: swiftlint not installed; skipping"
          fi

  # The iOS / iPadOS app. Same `Sunrise/` sources as the Mac, plus `iOS/`
  # instead of `macOS/`.
  #
  # No `MenuBarExtra`, no hotkey and no `NSPanel` — those are the three
  # surfaces that do not cross, and they are whole files under `macOS/` rather
  # than conditionals precisely so this target simply does not see them.
  SunriseiOS:
    type: application
    platform: iOS
    sources:
      - path: Sunrise
      - path: iOS
      # See the macOS target.
      - path: Widgets/Shared
      - path: ../../out/swift/sunrise_core_bindings.swift
        group: Generated
      # The same committed, drift-checked token file the macOS target compiles.
      # See the note on that target.
      - path: ../../packages/sunrise-ui-tokens/generated/tokens.swift
        group: Generated
      # The same string catalog the macOS target compiles; see the note there.
      - path: ../../packages/sunrise-i18n/generated/Strings.swift
        group: Generated
      - path: ../../packages/sunrise-i18n/generated/Localizable.xcstrings
        group: Generated
        buildPhase: resources
    dependencies:
      - target: SunriseFFI
      - framework: ../../out/SunriseCore.xcframework
        embed: false
      # The same argument as the macOS target: naming it is what makes Xcode
      # run `appintentsmetadataprocessor`, and without that bundle the intents
      # link but are never offered by Shortcuts or Siri. `Sunrise/Intents/` is
      # shared, so this surface is the Mac's, unchanged.
      - sdk: AppIntents.framework
      # Embedded under `PlugIns`; the Home and Lock Screen widgets.
      - target: SunriseWidgetsiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunrise.SunriseiOS
        PRODUCT_NAME: Sunrise
        # See the macOS target: pinned so `SunriseTests/` needs no conditional
        # imports.
        PRODUCT_MODULE_NAME: Sunrise
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait plus both landscapes on iPad, portrait-first on iPhone. The
        # calendar grid and the split shell are the two screens that earn
        # landscape, and both are better for it.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/Info-iOS.plist
      properties:
        # The same registration the Mac carries, and for the same reason:
        # notification bodies and the widget's tap target are `sunrise://`
        # links, so without this a tapped reminder opens nothing.
        CFBundleURLTypes:
          - CFBundleURLName: dev.sunrise.SunriseiOS
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [sunrise]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SunriseAppGroup: $(SUNRISE_APP_GROUP)
    # The App Group. iOS's `containerURL` answers `nil` to a process the
    # group was not granted to, so without this the app would have nowhere
    # to write and every widget would say "Open Sunrise" forever.
    entitlements:
      path: Generated/SunriseiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SUNRISE_APP_GROUP)
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [ -x /opt/homebrew/bin/swiftlint ]; then
            /opt/homebrew/bin/swiftlint lint --quiet --config "$SRCROOT/.swiftlint.yml" "$SRCROOT/Sunrise" "$SRCROOT/iOS"
          else
            echo "warning: swiftlint not installed; skipping"
          fi

  # The widgets (#14), built once per platform from the same `Widgets/`
  # sources and embedded in the matching app.
  #
  # **No Rust in here, on purpose.** The extension links neither the
  # xcframework nor the bindings: the app holds the vault lock, the vault
  # root is in the app's Keychain items, and a widget's memory ceiling is far
  # below what opening a vault costs. It reads the snapshot the app writes
  # into the App Group and draws it; `Widgets/Shared/WidgetSnapshot.swift`
  # says what that snapshot may carry.
  SunriseWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        # Under the app's own identifier, which the system requires of an
        # embedded extension.
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunrise.Sunrise.Widgets
        PRODUCT_NAME: SunriseWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sunrise
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SKIP_INSTALL: YES
    info:
      path: Generated/Info-Widgets.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SunriseAppGroup: $(SUNRISE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # A Mac widget extension must be sandboxed or the system will not load
    # it — unlike the app, whose sandbox is still #247's. The group is the
    # one door out of that sandbox it needs.
    entitlements:
      path: Generated/SunriseWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(SUNRISE_APP_GROUP)

  SunriseWidgetsiOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunrise.SunriseiOS.Widgets
        PRODUCT_NAME: SunriseWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sunrise
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Generated/Info-Widgets-iOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SunriseAppGroup: $(SUNRISE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/SunriseWidgets-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - $(SUNRISE_APP_GROUP)

  # Drives the real window. This is the only target that proves a click
  # reaches the core: `SunriseTests` exercises the view *models*, which is a
  # different claim.
  SunriseUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SunriseUITests
      - path: UITestSupport
    dependencies:
      - target: Sunrise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunrise.SunriseUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sunrise

  SunriseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SunriseTests
    dependencies:
      - target: Sunrise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunrise.SunriseTests
        GENERATE_INFOPLIST_FILE: YES

  # The iOS twin of `SunriseUITests`, and — unlike it — actually run.
  #
  # A macOS XCUITest drives another process on the developer's machine, which
  # the system refuses until `DevToolsSecurity` is enabled, so that target is
  # `skipped: true` in its scheme. A simulator runner has no such requirement:
  # these run on every `mise run ios-app`, which means iOS is the platform where a
  # tap is actually proved to reach the core on every build.
  SunriseiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SunriseiOSUITests
      - path: UITestSupport
    dependencies:
      - target: SunriseiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunrise.SunriseiOSUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SunriseiOS

  # The same `SunriseTests/` sources, compiled against the iOS app.
  #
  # One suite, built twice, rather than an iOS suite of its own. What these
  # tests assert is view-*model* behaviour against a real vault over the real
  # seam — none of it is macOS-specific, and none of it should be allowed to
  # become iOS-specific either. Running the identical file on both platforms is
  # what turns "the iOS app compiles" into "the iOS app behaves the same", and
  # it is the reason `PRODUCT_MODULE_NAME` is pinned on both app targets: with
  # it, `@testable import Sunrise` resolves in either bundle unchanged.
  SunriseiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SunriseTests
    dependencies:
      - target: SunriseiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunrise.SunriseiOSTests
        GENERATE_INFOPLIST_FILE: YES
        # Spelled out because the target is `SunriseiOS` and its product is
        # `Sunrise.app` — the app a user installs is called Sunrise on both
        # platforms, and only the *target* carries the suffix. XcodeGen's
        # default derives both halves from the target name, which looks for a
        # `SunriseiOS.app/SunriseiOS` that is never built.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sunrise.app/Sunrise
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Sunrise:
    build:
      targets:
        Sunrise: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SunriseTests
        # Skipped by default, and not because it is optional.
        #
        # A macOS UI test takes control of another process, which the system
        # refuses while developer mode is off: the runner is killed with
        # "signal kill before establishing connection" before it can connect.
        # Turning it on is a one-time change to the machine's security
        # posture, not something a build should do:
        #
        #     sudo DevToolsSecurity -enable
        #
        # Then: `mise run macos-uitest`, which runs the scheme below. Leaving it in
        # this scheme keeps it compiled on every build — an uncompiled test
        # target rots in a week — while keeping `mise run macos-app` honest about
        # what it ran.
        - name: SunriseUITests
          skipped: true

  # The UI tests on their own, and a scheme rather than a flag because
  # `-only-testing` cannot select a testable the scheme has skipped:
  # `xcodebuild` refuses with "isn't a member of the specified test plan or
  # scheme". `mise run macos-uitest` asked for exactly that and so had never run
  # once — which is how a UI test that captured on Today and asserted the row
  # appeared stayed red without anybody hearing about it.
  SunriseUITests:
    build:
      targets:
        Sunrise: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SunriseUITests

  SunriseiOS:
    build:
      targets:
        SunriseiOS: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SunriseiOSTests
        # Not skipped, unlike the macOS UI tests: a simulator runner needs no
        # change to the machine's security posture, so there is nothing to opt
        # into.
        - SunriseiOSUITests
