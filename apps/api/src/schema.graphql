scalar DateTime
scalar URL

type Query {
    # User authentication and profile
    me: User

    # Calendar operations
    calendars: [Calendar!]!
    calendar(id: ID!): Calendar
    events(
        calendarId: ID
        timeMin: DateTime
        timeMax: DateTime
        first: Int = 20
        after: String
        orderBy: EventOrderBy = START_TIME
    ): EventConnection!
    event(id: ID!, calendarId: ID): CalendarEvent

    # Auth operations
    authUrl: String!

    # Routine operations
    routines: [Routine!]!
    routine(id: ID!): Routine
}

type Mutation {
    # Authentication
    authenticateWithCode(code: String!): AuthPayload!
    refreshToken: AuthPayload!
    logout: Boolean!

    # Event operations
    createEvent(input: CreateEventInput!): CalendarEvent!
    updateEvent(id: ID!, input: UpdateEventInput!): CalendarEvent!
    deleteEvent(id: ID!, calendarId: ID): Boolean!

    # Routine operations
    createRoutine(input: CreateRoutineInput!): Routine!
    updateRoutine(id: ID!, input: UpdateRoutineInput!): Routine!
    deleteRoutine(id: ID!): Boolean!
}

type Subscription {
    eventUpdated(calendarId: ID): CalendarEvent!
    eventCreated(calendarId: ID): CalendarEvent!
    eventDeleted(calendarId: ID): EventDeletedPayload!

    routineCreated: Routine!
    routineUpdated: Routine!
    routineDeleted: RoutineDeletedPayload!
}

# Types
type User {
    id: ID!
    email: String!
    name: String
    picture: URL
    verified: Boolean!
}

type Calendar {
    id: ID!
    summary: String!
    description: String
    primary: Boolean!
    accessRole: CalendarAccessRole!
    backgroundColor: String
    foregroundColor: String
    timeZone: String
    events(
        timeMin: DateTime
        timeMax: DateTime
        first: Int = 20
        after: String
    ): EventConnection!
}

type CalendarEvent {
    id: ID!
    calendarId: ID!
    summary: String!
    description: String
    location: String
    start: EventDateTime!
    end: EventDateTime!
    status: EventStatus!
    visibility: EventVisibility!
    creator: EventParticipant
    organizer: EventParticipant
    attendees: [EventParticipant!]
    recurringEventId: ID
    originalStartTime: EventDateTime
    htmlLink: URL
    created: DateTime!
    updated: DateTime!
}

type EventDateTime {
    dateTime: DateTime
    date: String
    timeZone: String
}

type EventParticipant {
    email: String!
    displayName: String
    self: Boolean
    responseStatus: AttendeeResponseStatus
}

type AuthPayload {
    accessToken: String!
    refreshToken: String
    user: User!
    expiresIn: Int!
}

type EventDeletedPayload {
    id: ID!
    calendarId: ID!
}

type Routine {
    id: ID!
    name: String!
    description: String
    duration: RoutineDuration!
    priority: PriorityLevel!
    flexibility: Int!
    energyLevelRequired: EnergyLevel!
    category: String!
    frequency: Frequency!
    timePreferences: [TimeOfDay!]!
    availabilityWindows: [TimeWindow!]!
    dependencies: [RoutineDependency!]!
    minimumGapMinutes: Int!
    bufferTimeMinutes: Int!
    conflictResolution: ConflictResolution!
    canBeGrouped: Boolean!
    preferredBatchSize: Int
    enabled: Boolean!
    tags: [String!]!
}

type RoutineDuration {
    minutes: Int!
    flexible: Boolean!
    minDuration: Int
    maxDuration: Int
}

type TimeWindow {
    startHour: Int!
    startMinute: Int!
    endHour: Int!
    endMinute: Int!
}

type RoutineDependency {
    routineId: String!
    relationship: DependencyRelationship!
    bufferMinutes: Int
}

type RoutineDeletedPayload {
    id: ID!
}

# Relay-style Connection Types for Pagination
type EventConnection {
    edges: [EventEdge!]!
    pageInfo: PageInfo!
    totalCount: Int
}

type EventEdge {
    node: CalendarEvent!
    cursor: String!
}

type PageInfo {
    hasNextPage: Boolean!
    hasPreviousPage: Boolean!
    startCursor: String
    endCursor: String
}

# Inputs
input CreateEventInput {
    calendarId: ID!
    summary: String!
    description: String
    location: String
    start: EventDateTimeInput!
    end: EventDateTimeInput!
    attendees: [String!] # Email addresses
    reminders: ReminderInput
}

input UpdateEventInput {
    calendarId: ID
    summary: String
    description: String
    location: String
    start: EventDateTimeInput
    end: EventDateTimeInput
    attendees: [String!]
    reminders: ReminderInput
}

input EventDateTimeInput {
    dateTime: DateTime
    date: String
    timeZone: String
}

input ReminderInput {
    useDefault: Boolean
    overrides: [ReminderOverrideInput!]
}

input ReminderOverrideInput {
    method: ReminderMethod!
    minutes: Int!
}

# Enums
enum EventOrderBy {
    START_TIME
    UPDATED
}

enum CalendarAccessRole {
    NONE
    FREE_BUSY_READER
    READER
    WRITER
    OWNER
}

enum EventStatus {
    CONFIRMED
    TENTATIVE
    CANCELLED
}

enum EventVisibility {
    DEFAULT
    PUBLIC
    PRIVATE
    CONFIDENTIAL
}

enum AttendeeResponseStatus {
    NEEDS_ACTION
    DECLINED
    TENTATIVE
    ACCEPTED
}

enum ReminderMethod {
    EMAIL
    POPUP
}

# Routine enums
enum PriorityLevel {
    HIGH
    MEDIUM
    LOW
}

enum EnergyLevel {
    HIGH
    MEDIUM
    LOW
}

enum Frequency {
    DAILY
    WEEKLY
    WEEKDAYS
    WEEKENDS
    CUSTOM
}

enum TimeOfDay {
    EARLY_MORNING
    MORNING
    LATE_MORNING
    MIDDAY
    AFTERNOON
    EVENING
    NIGHT
    FLEXIBLE
}

enum ConflictResolution {
    SKIP
    RESCHEDULE
    COMPRESS
    OVERRIDE
}

enum DependencyRelationship {
    BEFORE
    AFTER
    SAME_TIME_BLOCK
}

# Routine inputs
input CreateRoutineInput {
    name: String!
    description: String
    duration: RoutineDurationInput!
    priority: PriorityLevel!
    flexibility: Int!
    energyLevelRequired: EnergyLevel!
    category: String!
    frequency: Frequency!
    timePreferences: [TimeOfDay!]!
    availabilityWindows: [TimeWindowInput!]!
    dependencies: [RoutineDependencyInput!]!
    minimumGapMinutes: Int!
    bufferTimeMinutes: Int!
    conflictResolution: ConflictResolution!
    canBeGrouped: Boolean!
    preferredBatchSize: Int
    enabled: Boolean!
    tags: [String!]!
}

input UpdateRoutineInput {
    name: String
    description: String
    duration: RoutineDurationInput
    priority: PriorityLevel
    flexibility: Int
    energyLevelRequired: EnergyLevel
    category: String
    frequency: Frequency
    timePreferences: [TimeOfDay!]
    availabilityWindows: [TimeWindowInput!]
    dependencies: [RoutineDependencyInput!]
    minimumGapMinutes: Int
    bufferTimeMinutes: Int
    conflictResolution: ConflictResolution
    canBeGrouped: Boolean
    preferredBatchSize: Int
    enabled: Boolean
    tags: [String!]
}

input RoutineDurationInput {
    minutes: Int!
    flexible: Boolean!
    minDuration: Int
    maxDuration: Int
}

input TimeWindowInput {
    startHour: Int!
    startMinute: Int!
    endHour: Int!
    endMinute: Int!
}

input RoutineDependencyInput {
    routineId: String!
    relationship: DependencyRelationship!
    bufferMinutes: Int
}
