# The Sunrise string catalog: every user-visible string, in English.
#
# This file is the single source (docs/10-cross-cutting/i18n.md §String
# catalog). A translation is `i18n/<locale>.toml` with the same keys; a key it
# omits falls back to the English here. `mise run i18n` compiles the catalog
# into the committed bindings under packages/sunrise-i18n/generated/, and
# `mise run i18n-check` fails while they are stale.
#
# Values are ICU MessageFormat, in the subset every binding renders the same
# way: text, {name}, {name, number}, and {name, plural, …} with the CLDR
# categories plus =0 and `#`. A literal apostrophe before `{`, `}` or `#`
# starts a quote; write '' for a lone apostrophe there. No concatenation:
# a sentence is one message with placeholders, so a translator can move them.
#
# The first key segment is the surface that shows the string, and decides
# which bindings carry it:
#
#   common  every binding            apple  Strings.swift + xcstrings
#   web     messages.ts              cli    strings.rs
#   docs    messages.ts (docs site)
#
# A comment above a key is the translator's context. Say where the string
# appears and what it must not lose; do not restate the English.

[common]
# The product name. Not translated; carried so no binding hard-codes it.
product_name = "Sunrise"

[web.app]
# <title> of the web client, and its page heading.
title = "Sunrise — Web"
# Today's list when it holds no task.
empty = "Nothing on the list."
# The installable app's description, in its web app manifest.
description = "Local-first, end-to-end encrypted productivity"

[docs.site]
# The documentation site's title, beside the logo and in the browser tab.
title = "Sunrise"
# The site's <meta name="description">.
description = "Local-first, end-to-end encrypted productivity: the design, the protocol, and the decisions behind them."
# The top navigation's link to the architecture decision records.
nav_adrs = "Decisions"
# The top navigation's link to the ranked roadmap.
nav_roadmap = "Roadmap"

