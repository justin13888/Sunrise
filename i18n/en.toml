[cli.pair]
# `sunrise pair` with no step. Translate the parenthesised notes and the last
# line; the command lines are typed as written.
usage = '''
usage:
  sunrise pair offer    --out <file>                 (on the device with the vault)
  sunrise pair request  --offer <file> --out <file>  (on the device being added)
  sunrise pair issue    --request <file> --out <file>(on the device with the vault)
  sunrise pair accept   --response <file>            (on the device being added)

Run them in that order, moving each file to the other machine as it is written.
'''
# {flag} is the missing flag; {usage} is the text above.
flag_required = "{flag} is required\n\n{usage}"
# {step} is what the user typed, in quotes.
unknown_step = "unknown pair step {step}\n\n{usage}"
cannot_sponsor = "this vault was itself added by pairing, so it holds the account's public identity and no signing key; it cannot certify another device. Run this on the device the account was created on."
# Each of these is three lines: what was written to {path}, then what to do
# next, then the command to run on the other machine.
offer_written = "wrote the pairing offer -> {path}\nmove it to the device you are adding, then run:\n  sunrise pair request --offer <that file> --out request.cbor"
# {dir} is the vault directory.
not_empty = "{dir} already holds a vault; a device joins an account when its vault is created, so pair into an empty directory (set SUNRISE_VAULT)"
request_written = "minted this device's keys and wrote the cert request -> {path}\nmove it back to the device with your vault, then run:\n  sunrise pair issue --request <that file> --out grant.cbor"
grant_written = "issued a certificate and wrote the grant -> {path}\nthis file carries your vault key. Move it to the device you are adding, then run:\n  sunrise pair accept --response <that file>"
no_pending = "no pending pairing in {dir} ({error}); run `sunrise pair request` on this device first"
# {device} is this device's new id.
joined = "this device joined the account as {device}\nrun `sunrise sync --once` against the account's relay to pull its history"

[cli.recover]
# Printed above the 24 words, which follow in rows of four.
code_heading = "Your recovery code — write it down now, on paper:"
# Printed below the 24 words. Keep the line breaks: the terminal shows it as is.
code_footer = "This code and your devices are the only two ways into this account. \nSunrise is end-to-end encrypted: the relay stores your recovery blob \nas ciphertext it cannot open, and nobody — including us — can reset \nthe account for you. Lose every device and this code, and the data is \ngone permanently.\n\nIt is shown once. It is not written to any file and not in any log."
# {dir} is the directory the recovery was pointed at.
not_empty = "{dir} already holds a vault; a recovery creates one and cannot merge into another. Point SUNRISE_VAULT at an empty directory and run this again."
needs_code = "a recovery needs the 24-word code: `sunrise recover <word>...`, or pipe it in"
# {detail} is the relay's refusal; {var} the bearer's environment variable.
step_up_required = "the relay will not serve the recovery blob to this session: {detail}. It requires a fresh sign-in (an OIDC step-up), which is what `sunrise recover` performs when it runs the login itself — so this means the token in {var} is an ordinary one. Unset it and let this command sign you in."
# {error} says how far the replay got.
never_caught_up = "{error}. Nothing is lost: run `sunrise sync --once` when the network is better."
# Progress, on stderr.
code_accepted = "recovery code accepted; the account identity is restored"
vault_rebuilt = "vault rebuilt from the recovery code"
rekeyed = "re-keyed as device {device}"
unrecorded = "registered as {device} but could not record it: {error}"
replaying = "{count, plural, one {replaying history: # change applied} other {replaying history: # changes applied}}"
using_bearer = "using the bearer in {var}"
needs_config = "{error}; set {issuer} and {client_id}, or set {var} to a token that carries a fresh sign-in"
signing_in = "signing in — your provider will ask you to authenticate again, which is what lets the relay release the recovery blob"
# Printed last, on stderr. {identity} is the account's id. Keep the line breaks.
aftercare = "Account {identity} is restored on this device.\n\nTwo things are worth doing now, and neither is automatic:\n\n* Revoke the devices you lost. Until you do, anything still\nholding them can read what this account writes.\n* Rotate your Stream keys. A recovery means an unknown-state\nenvironment, and rotation is what bounds what a lost device\nkeeps reading. See docs/03-crypto/key-rotation.md.\n\nYour recovery code still works and has not changed. This device now\nholds ID_D_priv, so it can seal a new one if you ever rotate it."

[cli.vault]
# A vault made before vaults had their own keys. {dir} is its directory; the
# second line is a command to copy, with {var}={root} typed as written.
pre_multi_account = "the vault at {dir} was created before vaults had their own keys, when every vault shared one root compiled into this binary. It is not opened by guessing that root, because that would leave it readable by anyone holding a copy of `sunrise`. To open it once and move the work somewhere new:\n    {var}={root} sunrise export activity json > out.json\nOtherwise pick a fresh directory; this build makes a new key for it."
# {id} is the vault's id; {keystore} the directory searched for its key.
root_missing = "no key for vault {id} in {keystore}. The key never lives beside the data — a vault directory copied on its own is ciphertext. Bring the keystore over from the machine that made it, or supply the root directly with {var}=<64 hex chars>."
bad_root_hex = "{var} must be exactly {chars, plural, one {# hex character} other {# hex characters}} ({bytes, plural, one {# byte} other {# bytes}}); got {len, number}"
# What is wrong with a vault's id or key file.
bad_id = "{chars, plural, one {expected # hex character naming a vault} other {expected # hex characters naming a vault}}"
bad_key = "{chars, plural, one {expected # hex character} other {expected # hex characters}}"
