# cargo-deny configuration.
# Run with: cargo deny check

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = [
    # ---- Reaches us only through `loro` (sunrise-crdt) ----
    # All "unmaintained" advisories, not vulnerabilities, and none has an
    # upgrade path: the `im` immutable-collections family was archived
    # upstream, and `heapless` 0.7 pins `atomic-polyfill` transitively.
    #
    # These are expected to disappear entirely once `sunrise-crdt` is removed
    # (ADR superseding 0003) — `loro` is its only consumer. Re-run
    # `cargo deny check advisories` after that lands and DELETE any entry that
    # stops being reported, rather than leaving a stale suppression behind.
    { id = "RUSTSEC-2026-0248", reason = "im: unmaintained; via loro. Expected to vanish with sunrise-crdt." },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps: unmaintained; via im <- loro. Expected to vanish with sunrise-crdt." },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks: unmaintained; via im <- loro. Expected to vanish with sunrise-crdt." },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill: unmaintained; via heapless <- postcard <- loro. Expected to vanish with sunrise-crdt." },

    # ---- Survives the sunrise-crdt removal ----
    # `paste` is archived but is a compile-time-only proc macro reached through
    # `ratatui`, which we depend on directly (ADR-0006). No runtime exposure and
    # no replacement available upstream; revisit when ratatui drops it.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro; via ratatui. Compile-time only." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
# Sunrise's own crates are AGPL-3.0-only and `publish = false`. Skipping
# workspace-private crates is deliberate: adding "AGPL-3.0-only" to `allow`
# below would also silently permit a *third-party* AGPL dependency, which is
# not something we want to accept without a decision.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    # Mozilla's CA bundle, reached through tokio-tungstenite (ADR-0005).
    # A data licence, permissive, and AGPL-compatible. Permanent.
    "CDLA-Permissive-2.0",
    # Boost Software Licence — OSI-approved, permissive, AGPL-compatible.
    # Reached through `xxhash-rust` <- loro, so it is expected to become
    # unused once sunrise-crdt is removed; drop this entry if so.
    "BSL-1.0",
]
confidence-threshold = 0.9

# `icy_sixel` (via ratatui-image) ships a `license-file` instead of an SPDX
# expression. The file is the MIT licence verbatim, so state that explicitly
# rather than widening the allow-list or skipping the crate.
[[licenses.clarify]]
crate = "icy_sixel"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0x6ce9e0d1 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
